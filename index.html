<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b3f1d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Trench Snot"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Trench Snot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Lobster&display=swap">
<style>
:root{--bg:#f3ead8;--panel:#fbf5e8;--fg:#2c1f12;--mute:#7a6650;--line:#d9c9a8;--accent:#6b3f1d;--accent-fg:#fbf5e8;--bad:#a3261b;--okc:#3d6b2a;--warn:#8a5a00;--logo-bg:#e8d7b4;--logo-cup:#5a3416;--shadow:0 1px 0 rgba(60,35,10,.08),0 6px 18px -10px rgba(60,35,10,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1610;--panel:#2a2019;--fg:#efe3cb;--mute:#b09a7a;--line:#45362a;--accent:#d9a45b;--accent-fg:#1d1610;--bad:#ff8a78;--okc:#9fd27d;--warn:#e8b24f;--logo-bg:#3a2b1e;--logo-cup:#e9c48a;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1610;--panel:#2a2019;--fg:#efe3cb;--mute:#b09a7a;--line:#45362a;--accent:#d9a45b;--accent-fg:#1d1610;--bad:#ff8a78;--okc:#9fd27d;--warn:#e8b24f;--logo-bg:#3a2b1e;--logo-cup:#e9c48a;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:17px/1.5 Alegreya,Georgia,serif;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:860px;margin:0 auto}
h1,h2,h3,h4,.btn,.stats,.tabs,nav button,.c,.cnt{font-family:'Special Elite','Courier New',monospace;font-weight:400}
h1{font-size:2.6rem;margin:.2em 0;text-wrap:balance}h2{font-size:1.5rem;margin:1.2em 0 .5em}h3{font-size:1.1rem;margin:1.2em 0 .5em}h3 small{font:inherit;color:var(--mute);font-size:.8em}
h4{margin:.8em 0 .3em;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}h5{margin:.6em 0 .2em;font-size:.85rem;color:var(--mute)}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:2px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit}.bt{display:flex;flex-direction:column;line-height:1.1}.bt b{font:1.35rem 'Special Elite',monospace}.bt i{font-size:.8rem;color:var(--mute)}
nav{display:flex;gap:4px}nav button{background:none;border:0;color:var(--fg);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:.95rem}nav button.on{background:var(--panel);box-shadow:inset 0 -2px 0 var(--accent)}
main{padding:14px 0 30px;min-width:0}
.hero{padding:28px 0 8px}.hero p{max-width:55ch;color:var(--mute);font-size:1.1rem}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:9px 16px;cursor:pointer;font-size:.95rem}.btn.big{padding:13px 24px;font-size:1.05rem;margin-top:12px}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}.btn.sm{padding:3px 9px}
.btn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bands{list-style:none;padding:0;display:grid;gap:10px}.bandcard{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--fc);border-radius:8px;padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}.bandcard h3{margin:0}.bandcard p{margin:0;color:var(--mute)}.bandcard .m{color:var(--fg)}
.bad{color:var(--bad)}.muted{color:var(--mute)}.sm{font-size:.9rem;margin:.2em 0}
.facs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}.fac{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--fc);border-radius:8px;padding:10px;text-align:left;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;font-size:1rem}.fac b{font:1rem 'Special Elite',monospace}.fac span{color:var(--mute);font-size:.85rem}.fac.on{outline:2px solid var(--accent);background:var(--bg)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}.mode{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;cursor:pointer;color:var(--fg);font-size:1rem;display:flex;flex-direction:column;gap:2px}.mode b{font:1.05rem "Special Elite",monospace}.mode span{color:var(--mute);font-size:.82rem}.mode.on{outline:2px solid var(--accent);background:var(--bg)}@media(max-width:420px){.modes{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:12px 0;box-shadow:var(--shadow)}.card h3{margin-top:.3em}
label{display:block;margin:.7em 0;font-size:.9rem;color:var(--mute)}input,select{display:block;width:100%;margin-top:4px;font:1rem Alegreya,serif;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
details{border-top:1px solid var(--line);padding:6px 0}summary{cursor:pointer;font-weight:700}details p{margin:.4em 0;color:var(--fg)}
.bhead{border-left:6px solid var(--fc);padding-left:12px;margin:6px 0}.bhead p{margin:0;color:var(--mute)}input.nm{font:1.5rem 'Special Elite',monospace;background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:2px 0}
.sticky{position:sticky;top:0;background:var(--bg);z-index:5;padding:8px 0;border-bottom:1px solid var(--line)}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}.meter.over i{background:var(--bad)}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:.95rem}.ok{color:var(--okc)}.ok.bad{color:var(--bad)}
.errs,.warns{margin:8px 0;padding:8px 8px 8px 28px;border-radius:6px;font-size:.95rem}.errs{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}.warns{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.tabs{display:flex;gap:4px;margin:10px 0;border-bottom:1px solid var(--line)}.tabs button{background:none;border:0;padding:8px 14px;color:var(--mute);cursor:pointer;font-size:.95rem}.tabs button.on{color:var(--fg);box-shadow:inset 0 -3px 0 var(--accent)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ucard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 52px 9px 11px;text-align:left;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;font-size:1rem;min-width:0}.ucard b{font-weight:700;overflow-wrap:anywhere}.ucard .c{font-size:.85rem;color:var(--mute)}.ucard .cnt{position:absolute;right:10px;top:9px;font-size:.85rem;background:var(--bg);border-radius:10px;padding:0 8px}.ucard.full{opacity:.55}.ucard em,.mdl em{font-style:normal;font-size:.7rem;letter-spacing:.06em;color:var(--accent)}
.ucard:hover{border-color:var(--accent)}
.mdl{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;min-width:0}.mdl.has-err{border-color:var(--bad)}
.mh{display:flex;justify-content:space-between;gap:8px;align-items:center}.mt{flex:1;display:flex;gap:8px;align-items:baseline;background:none;border:0;color:var(--fg);cursor:pointer;font:1.05rem Alegreya,serif;text-align:left;padding:4px 0;min-width:0;flex-wrap:wrap}.mc{margin-left:auto;font:.9rem 'Special Elite',monospace;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}.chip{font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 8px;display:inline-flex;align-items:center;gap:4px}.chip.lock{opacity:.7;border-style:dashed}.chip.opt{border-color:var(--accent)}.chip small{color:var(--mute)}.chip button{background:none;border:0;color:var(--bad);cursor:pointer;font-size:1rem;padding:0 2px}
.prof{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}.prof span{background:var(--bg);border-radius:6px;padding:3px 6px;font-size:.9rem;text-align:center;min-width:0;overflow-wrap:anywhere}.prof i{display:block;font-style:normal;font-size:.7rem;color:var(--mute);text-transform:uppercase}
.kw{font-size:.8rem;letter-spacing:.05em;color:var(--accent);margin:.2em 0}.cap{font-size:.92rem;color:var(--mute);margin:.2em 0}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--fg);margin:.3em 0;font-size:.95rem}.chk input{width:auto;margin-top:5px}.chk em{display:block;color:var(--mute);font-size:.85rem}
.sel{display:grid;grid-template-columns:1fr;gap:0}.sel span{font-size:.8rem}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font:.9rem/1.5 'Courier New',monospace}
.sig{display:flex;gap:10px;align-items:center;justify-content:center;border-top:2px solid var(--line);padding:16px 0 28px;color:var(--mute);font-size:.9rem;text-align:center;flex-wrap:wrap}.sig b{color:var(--fg)}
a{color:var(--accent)}ul{padding-left:1.2em}
@media(max-width:480px){h1{font-size:2.1rem}.prof{grid-template-columns:repeat(3,1fr)}}
#printsheet{display:none}
@media print{
 body{background:#fff;color:#000;padding:0;font-size:11pt}
 .top,.sticky,.tabs,.errs,.warns,.bhead,.sig,main>*:not(#printsheet){display:none!important}
 main{padding:0}#printsheet{display:block!important}
 #printsheet h1{font-size:20pt;margin:0}#printsheet .ps{margin:.2em 0 .8em;border-bottom:1.5pt solid #000;padding-bottom:6pt}
 .pm{break-inside:avoid;border:.8pt solid #444;border-radius:4pt;padding:5pt 8pt;margin:0 0 6pt}
 .pmh{display:flex;justify-content:space-between;font-size:12pt}.pmh em{font-style:normal;font-size:8pt;margin-left:6pt}
 .pp{font-size:9.5pt}.pk{font-size:8.5pt;letter-spacing:.04em}.pe{font-size:10pt;margin-top:2pt}.pc{font-size:8.5pt;color:#333;margin-top:2pt}
 .pf{font-size:8pt;color:#555;text-align:center;margin-top:10pt}
 @page{margin:14mm}
}
#splash{position:fixed;inset:0;z-index:999;background:#f3ead8;color:#2c1f12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;animation:spOut .35s ease 1.6s forwards}
#splash img{width:min(52vw,230px);height:auto;animation:spIn .7s ease both}
#splash h1{font:clamp(2.2rem,9vw,3.4rem) 'Special Elite','Courier New',monospace;margin:.1em 0 0;animation:spUp .6s ease .25s both}
#splash p{margin:0;font:clamp(1.4rem,6vw,2rem) Lobster,cursive;color:#6b3f1d;animation:spUp .6s ease .5s both}
@keyframes spIn{from{opacity:0;transform:scale(.8) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash,#splash *{animation-duration:.01s!important}#splash{animation-delay:1.6s!important}}
.brand img{width:40px;height:40px;object-fit:contain}
@media print{#splash{display:none!important}}
.ctlogo{width:84px;height:auto;max-height:70px;object-fit:contain}

/* v5 : fiches, équipement, budget, emblèmes */
.emb{border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--line);background:#fff}
.fac{flex-direction:row;align-items:center;gap:10px}.fac .ft{display:flex;flex-direction:column;min-width:0}
.bc,.bh{display:flex;gap:12px;align-items:center;min-width:0}.bc>div,.bh>div{min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pre{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.budbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin:8px 0}.budbox summary{font-weight:400;font-size:.95rem}.budbox em{font-style:normal;font-size:.7rem;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.bud{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}.bud label{flex:1;min-width:130px;margin:0}
.ucw{position:relative;display:flex;min-width:0}.ucw .ucard{flex:1;width:100%}
.ib{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--accent);font:italic 700 .95rem Georgia,serif;cursor:pointer;line-height:1;padding:0}
.ib:hover{border-color:var(--accent)}
.peek{border-left:6px solid var(--fc)}
.car{color:var(--accent);width:1em}
.prof span.chg{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg))}.prof small{display:block;font-size:.65rem;color:var(--mute)}
.modnote{font-size:.82rem;color:var(--accent);margin:.2em 0}.kadd{color:var(--okc);font-weight:700}
.eqt{font-size:.92rem;margin:.5em 0}.fluff p{font-size:.9rem;color:var(--mute)}
.caps p{margin:.5em 0;font-size:.95rem}.caps b{color:var(--accent)}
.etabs{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.etabs button{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:4px 12px;color:var(--fg);cursor:pointer;font:.9rem 'Special Elite',monospace}.etabs button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}.etabs i{font-style:normal;font-size:.75rem;opacity:.8;margin-left:3px}
.icard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--bg);min-width:0}.icard.dis{opacity:.62}
.ih{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}.ipx{font:.9rem 'Special Elite',monospace;color:var(--accent)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0}.tag{font-size:.72rem;border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--mute)}
.ik{font-size:.78rem;letter-spacing:.04em;color:var(--accent);overflow-wrap:anywhere}.ie{font-size:.9rem;margin:.25em 0 0}.ir{font-size:.8rem;color:var(--mute);margin:.2em 0 0}.why{font-size:.82rem;color:var(--bad);margin:.2em 0 0}
.icard .row{margin-top:6px}.icard .row:empty{display:none}
.catalog{margin-top:6px;max-height:60vh;overflow:auto;border-top:1px dashed var(--line);padding-top:4px}
button:disabled{cursor:not-allowed;opacity:.5}
.scx{overflow-x:auto}.wt table{border-collapse:collapse;width:100%;font-size:.85rem}.wt th,.wt td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}.wt th{font:.72rem 'Special Elite',monospace;text-transform:uppercase;color:var(--mute)}
.opl{margin:.2em 0;font-size:.92rem}
.pht{display:flex;gap:10px;align-items:center}.pw{font-size:8.5pt;margin-top:2pt}
@media(max-width:480px){.two{grid-template-columns:1fr 1fr}}
@media print{.pc p{margin:1pt 0}.pc b{font-weight:700}.pht .emb{box-shadow:none}.budbox,.peek{display:none!important}}
</style>

const UDB={"na|lieutenant": {"fl": "Une bande de la Nouvelle-Antioche doit inclure 1 Lieutenant. Les Lieutenants commandent de petites escouades ou sections de soldats de la Nouvelle-Antioche, et ils jouent donc un rôle capital sur les lignes de front. Loyaux envers leur devoir, ils préservent l’unité et le moral de leurs troupes dans ce conflit incessant. Un Lieutenant peut être l’enfant préféré d’une famille noble ou s’être hissé dans les rangs en impressionnant ses supérieurs par son sens stratégique exceptionnel, couplé à une audacieuse bravoure. En plus de son rôle de commandant, un Lieutenant est responsable de l’acquisition d’armes, d’armures, d’équipement et de provisions pour ses soldats. En raison d’un ravitaillement au mieux sporadique, il se voit fréquemment contraint de piller les champs de bataille du No Man’s Land, voire les communautés rencontrées, pour soutenir ses forces. Les Lieutenants n’ont pas volé leur place: ils jouissent donc du privilège de choisir les armes et armures qu’ils préfèrent, et ils ne se privent pas de réclamer les trouvailles les plus rares du champ de bataille. Nombre d’entre eux se distinguent de diverses manières, qu’il s’agisse d’un héritage familial révéré, d’un maintien caractéristique ou d’une pièce ostentatoire faisant ressentir une assurance plus que nécessaire.", "eq": "Un Lieutenant peut recevoir toute pièce d’équipement des tables d’armurerie de la Nouvelle-Antioche.", "cap": [{"n": "ACTION Cessez le feu!", "t": "le Lieutenant ordonne à sa bande d’arrêter de tirer, ce qui contraint l’ennemi à agir en premier. Pour représenter cela, un Lieutenant peut déclarer l’ACTION Cessez le feu ! Choisissez alors 1 figurine ennemie dans la ligne de vue du Lieutenant et que l’adversaire est autorisé à activer. L’activation du Lieutenant prend alors fin, et l’adversaire doit maintenant activer la figurine désignée."}], "kw": "NOUVELLE-A"}, "na|sniper": {"fl": "Les fidèles de l’Église s’aveuglent de manière rituelle en signe de dévotion envers Dieu, et ils s’en remettent uniquement à leur foi pour frapper Ses ennemis. On raconte que, durant le siège du monastère de Saint-Lux, un Prêtre sniper abattit sa cible à près de cinq mille mètres.", "eq": "Un Prêtre sniper peut recevoir toute pièce d’équipement des tables d’armurerie de la Nouvelle-Antioche.", "cap": [{"n": "ACTION de Visée", "t": "le Prêtre sniper peut entreprendre l’ACTION de Visée. Effectuez alors un jet de résolution risqué pour la figurine en y ajoutant +2 DÉS. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique et pour le reste de l’activation du Prêtre sniper, ajoutez +2 DÉS aux jets de résolution des ses attaques de tir."}, {"n": "Foi absolue", "t": "les Prêtres snipers ne se reposent pas sur la vue pour viser leurs ennemis. Le joueur adverse ne peut pas dépenser de MARQUEURS SANG pour ajouter −DÉS à une attaque de tir d’un Prêtre sniper."}], "kw": "NOUVELLE-ANTIOCHE, ÉLITE"}, "na|aumonier": {"fl": "Ce guerrier saint s’est vu confier les âmes mêmes des soldats de sa compagnie. L’Aumonier chante des prières de bataille inspirantes et peut invoquer des miracles divins, qu’il s’agisse de soigner les blessés ou de frapper l’ennemi. L’Aumonier transporte souvent un sanctuaire de terrain sur le dos, en l’honneur du Mécène de sa compagnie, que ce soit un saint révéré dans sa terre natale, un puissant archange ou le Seigneur en personne.", "eq": "L’Aumonier de tranchée peut recevoir toute pièce d’équipement des tables d’armurerie de la Nouvelle-Antioche.", "cap": [{"n": "ACTION Dieu nous accompagne!", "t": "l’Aumônier de tranchée peut déclarer l’ACTION Dieu nous accompagne! Effectuez alors un jet de résolution risqué pour la figurine. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique, vous pouvez placer 1 MARQUEUR BÉNEDICTION à côté de l’Aumônier de tranchée ou d’une figurine amie à 6” ou moins de lui. En avant, soldats du Christ: les figurines amies de la Nouvelle-Antioche situées à 8” ou moins de l’Aumônier de tranchée bénéficient du mot-clé IMMUNITÉ PEUR."}], "kw": "NOUVELLE-ANTIOCHE, ÉLITE, IMMUNITÉ PEUR"}, "na|yeoman": {"fl": "Les troupes de base de la Nouvelle-Antioche se composent de femmes et d’hommes courageux qui ont suivi un entraînement réglementaire et ont prêté serment au duc de la Nouvelle-Antioche. Bien qu’ils puissent manquer des compétences au combat de soldats d’élite, ils compensent par la force du nombre et l’accès à une grande variété d’armes. Profil du Yeoman", "eq": "Lors de son recrutement, un Yeoman peut recevoir un fusil à verrou (▶ voir l’équipement standard, page 133) pour un coût réduit de 5 👑. Un Yeoman peut de plus recevoir toute pièce d’équipement des tables d’armurerie de la Nouvelle-Antioche.", "cap": [{"n": "Taupe de tranchée", "t": "les Taupes de tranchée sont des éclaireurs qui utilisent les tunnels quadrillant le No Man’s Land pour atteindre des positions avancées par rapport aux principales tranchées. Jusqu’à 2 Yeomans peuvent être promus en Taupes de tranchée avec le mot-clé INFILTRATEUR pour un surcoût individuel de +10 👑. Vous pouvez ajouter une troisième Taupe de tranchée dans une bande dont le coût total des autres figurines (comprenant leur équipement, etc.) atteint au moins 1 000 👑."}], "kw": ""}, "na|choc": {"fl": "Avec un entraînement rigoureux en matière de combat interarmes et de tactiques d’équipe-feu, ces troupes d’assaut se spécialisent dans le franchissement des défenses ennemies et maîtrisent parfaitement l’assaut rapide et le combat au corps à corps.", "eq": "Un Soldat de choc peut recevoir toute pièce d’équipement des tables d’armurerie de la Nouvelle-Antioche.", "cap": [{"n": "Charge de choc", "t": "pour déterminer le bonus de charge d’un Soldat de choc, jetez deux d6 et conservez le résultat le plus haut."}, {"n": "Manœuvre d’assaut", "t": "vous pouvez ignorer l’effet du mot-clé LOURD pour l’une des armes de corps à corps que possède le Soldat de choc. Un Soldat de choc ne peut pas être équipé de plus de 1 arme (quel qu’en soit le type) avec le mot-clé LOURD."}], "kw": "NOUVELLE-ANTIOCHE"}, "na|genie": {"fl": "Les Soldats du génie se spécialisent dans la destruction de bunkers, dans la découverte de champs de mines et dans la construction d’emplacements de champ de bataille. Vêtus d’une armure d’acier et armés pour le combat rapproché, ils bravent les plus dangereuses des lignes de front. Ils subissent toujours des pertes très élevées et pourtant ils considèrent comme un honneur de se battre et de périr pour la Nouvelle-Antioche et pour l’Église.", "eq": "Un Soldat du génie possède toujours une cuirasse du génie (▶ voir l’armurerie de la Nouvelle-Antioche) et une pelle. Ces pièces d’équipement ne peuvent être ni retirées ni perdues au fil de la campagne, quelle qu’en soit la raison. Le modificateur de blessure dû à l’armure est inclus dans le profil de la figurine. Un Soldat du génie peut de plus recevoir toute pièce d’équipement des tables d’armurerie de la Nouvelle-Antioche, en dehors d’une armure.", "cap": [{"n": "ACTION Fortification", "t": "le Soldat du génie peut déclarer l’ACTION Fortification. Effectuez alors un jet de résolution risqué pour la figurine. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique, le Soldat du génie gagne le mot-clé COUVERT jusqu’à ce qu’il se déplace et quitte sa position actuelle."}, {"n": "ACTION Miner", "t": "le Soldat du génie peut déclarer l’ACTION Miner s’il est en contact avec un élément de terrain de 8” par 8” qui ne possède pas déjà le mot-clé MINÉ. Effectuez alors un jet de résolution en y ajoutant +2 DÉS. En cas d’échec, rien ne se passe. En cas de réussite ou de réussite critique, l’élément de terrain gagne le mot-clé MINÉ."}, {"n": "Démolition sur le champ de bataille", "t": "vous pouvez ignorer l’effet du motclé LOURD pour 1 sacoche d’explosif que possède le Soldat du génie. Un Soldat du génie ne peut pas être équipé de plus de 1 arme (quel qu’en soit le type) avec le mot-clé LOURD."}, {"n": "Désamorçage", "t": "lorsqu’un Soldat du génie se déplace au contact d’un marqueur ou d’un élément de terrain avec le mot-clé MINÉ, vous pouvez déclarer que le Soldat du génie va tenter de désamorcer la mine avant qu’elle n’explose (▶ voir MINÉ). Effectuez un jet de résolution risqué pour la figurine. En cas d’échec, la mine explose et l’activation du Soldat du génie prend fin. En cas de réussite ou de réussite critique, la mine n’explose pas et le marqueur ou l’élément de terrain perd le mot-clé MINÉ. Une figurine qui a posé une mine peut automatiquement la désamorcer s’il entre en contact avec (ne faites pas de jet de résolution risqué)."}], "kw": "NOUVELLE-ANTIOCHE, IMMUNITÉ MINÉ"}, "na|fantassin": {"fl": "Les Fantassins lourds mécanisés, des soldats imposants et bien blindés, manient les armes lourdes de la compagnie. Sélectionnés parmi les meilleurs, ils reçoivent des améliorations chimiques importantes pour maximiser leur force et leur endurance.", "eq": "Un Fantassin lourd mécanisé possède toujours soit une armure renforcée (et coûte alors 85 👑), soit une armure mécanisée (et coûte alors 95 👑), qui ne peut être ni retirée ni perdue au fil de la campagne, quelle qu’en soit la raison. Le modificateur de blessure dû à l’armure est inclus dans le profil de la figurine. Un Fantassin lourd mécanisé peut de plus recevoir toute pièce d’équipement des tables d’armurerie de la Nouvelle-Antioche, en dehors d’une armure.", "cap": [{"n": "", "t": "Aucune"}], "kw": "NOUVELLE-ANTIOCHE, FORT"}, "na|infirmier": {"fl": "Les Infirmiers militaires de la Nouvelle-Antioche forment des troupes spécialisées à l’entraînement poussé. Nombre d’entre eux sont des adorateurs dévoués de l’archange saint Michel, révéré autant comme guerrier saint que comme protecteur des infirmiers, qui pensent qu’il affermit leur main et guide leur lame. Les Infirmiers militaires remplissent un devoir double brutal. Ils doivent fournir des soins d’urgence sur le champ de bataille afin de renvoyer le plus vite possible les soldats au combat, et leur miséricorde leur sert autant à opérer sur le coup qu’à éliminer rapidement les ennemis tombés.", "eq": "Un Infirmier militaire possède toujours une armure standard, un masque à gaz, une trousse de soins et une miséricorde (▶ voir la section d’équipement ordinaire des règles, page 132). Le modificateur de blessure dû à l’armure est inclus dans le profil de la figurine. Un Infirmier militaire peut de plus recevoir toute pièce d’équipement des tables d’armurerie de la Nouvelle-Antioche, en dehors d’une armure.", "cap": [{"n": "Achever les blessés", "t": "en raison de ses connaissances sur l’anatomie et la physiologie, l’Infirmier sait parfaitement infliger des blessures débilitantes et une douleur atroce. Ajoutez +1 DÉ BLESSURE aux jets de blessure pour les attaques au corps à corps que l’Infirmier militaire porte à une cible À terre et dépourvue des mots-clés GRAAL NOIR ou DÉMONIAQUE."}, {"n": "Infirmier expert", "t": "ajoutez +2 DÉS aux jets de résolution risqués d’un Infirmier militaire qui effectue l’ACTION Soins avec sa trousse de soins."}], "kw": "NOUVELLE-ANTIOCHE, IMMUNITÉ PEUR"}, "pe|prophete": {"fl": "Une bande de Pèlerins des tranchées doit inclure 1 Prophète de guerre. Chef charismatique et redoutable guerrier de son groupe de Pèlerins, le Prophète de guerre est poussé par des visions de l’Armageddon. Ses prêches et ses prophéties conduisent ses ouailles d’un champ de bataille à l’autre, en vue de contrecarrer les forces de Satan et en quête du martyre au combat. Le Prophète de guerre, grâce à ses haut-parleurs, diffuse un vacarme de sermons sacrés et de sombres prophéties, dont les cent décibels inspirent les Fidèles.", "eq": "Un Prophète de guerre peut recevoir toute pièce d’équipement des tables d’armurerie des Pèlerins des tranchées.", "cap": [{"n": "ACTION Haut-parleurs", "t": "le Prophète de guerre peut déclarer l’ACTION Haut-parleurs. Effectuez alors un jet de résolution risqué pour la figurine en y ajoutant +2 DÉS. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique, vous pouvez déplacer toutes les figurines amies à 8” ou moins du Prophète de guerre (y compris celui-ci) sur une distance maximale de 3”. Ces figurines doivent se rapprocher au maximum de la figurine ennemie la plus proche en ligne de vue au début de ce déplacement. Celui-ci peut permettre à une figurine de se retrouver à 1” ou moins d’une figurine ennemie, auquel cas elle compte comme ayant chargé. En l’absence de figurine ennemie visible, une figurine peut se déplacer normalement."}, {"n": "ACTION Imposition des mains", "t": "le Prophète de guerre peut déclarer l’ACTION Imposition des mains. Effectuez alors un jet de résolution pour la figurine. En cas d’échec, rien ne se passe. En cas de réussite, retirez 1 MARQUEUR SANG d’une figurine amie à 6” ou moins du Prophète de guerre, en cas de réussite critique, retirez 3 MARQUEURS SANG. Le Prophète de guerre peut retirer ses propres MARQUEURS SANG."}, {"n": "Memento Mori", "t": "le Prophète de guerre est touché par une puissance supérieure, et la vérité qui se révèle à lui lui offre un certain degré de protection contre une mort prématurée. Le premier résultat Hors de combat qu’il subit sur la table des blessures est traité comme un résultat Pas d’effet. Un Prophète de guerre ne peut jamais gagner le mot-clé ROBUSTE."}], "kw": "PÈ"}, "pe|communiant": {"fl": "Les Communiants sont des dévots qui ont consommé la chair d’un Méta-Christ et bu son sang. Renforcés par l’essence divine, ils grandissent jusqu’à une taille imposante, et les blessures dont ils souffrent se referment par miracle. Ils y voient mieux lorsqu’ils sont aveuglés, alors on leur cloue une croix bénie en travers des yeux.", "eq": "Un Communiant possède une croix de Communiant (▶ voir ci-dessous) et peut recevoir toute pièce d’équipement des tables d’armurerie des Pèlerins des tranchées.", "cap": [{"n": "Garde du corps", "t": "si une attaque (de tir ou de corps à corps) touche une figurine PÈLERIN amie à 1” ou moins du Communiant, vous pouvez annoncer que celui-ci s’interpose. Effectuez alors un jet de blessure pour le Communiant plutôt que pour la cible d’origine. Cette capacité ne peut pas servir contre les attaques dotées du mot-clé EXPLOSION."}, {"n": "La croix du Communiant", "t": "le Communiant compte comme disposant des pièces d’équipement suivantes, sans surcoût en 👑: capirote de fer; masque à gaz. Cette croix ne peut être ni retirée ni perdue au fil de la campagne, quelle qu’en soit la raison."}], "kw": "PÈLERIN, ÉLITE, FORT, RÉGÉNÉRATION 1"}, "pe|castigateur": {"fl": "Chargé d’instiller la peur de Dieu dans le cœur des troupes, cet officier orthodoxe maintient les guerriers sur la voie de la vertu et punit ceux qui transgressent les règles. Une foi inébranlable, ainsi que les saints qu’il révère, protège le Castigateur.", "eq": "Un Castigateur peut recevoir toute pièce d’équipement des tables d’armurerie des Pèlerins des tranchées.", "cap": [{"n": "ACTION Orthodoxie imposée", "t": "un Castigateur peut déclarer l’ACTION Orthodoxie imposée. Effectuez alors un jet de résolution risqué pour la figurine en y ajoutant +1 DÉ. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique, toutes les figurines amies à 8” ou moins du Castigateur qui se trouvent À terre se relèvent immédiatement sans pénalité à leur Mouvement."}, {"n": "Force du fanatique", "t": "un Castigateur peut recevoir le mot-clé FORT pour +5 👑."}, {"n": "Fouet de Dieu", "t": "quand un Castigateur effectue une attaque au corps à corps, il peut prendre pour cible une figurine amie à 1” ou moins de lui au lieu d’une figurine ennemie. Placez un d6 de côté chaque fois que le Castigateur met ainsi une figurine amie Hors de combat. La prochaine fois que la bande du Castigateur doit effectuer un test de Moral, chaque d6 ainsi mis de côté ajoute +1 DÉ au jet, avant d’être défaussé."}], "kw": "PÈLERIN, ÉLITE"}, "pe|pelerin": {"fl": "Ces guerriers sacrés des tranchées considèrent comme leur devoir religieux d’effectuer des pèlerinages jusqu’aux champs de bataille saints pour combattre les légions hérétiques. Les Pèlerins portent le capirote de fer pour protéger leur esprit contre les horreurs de la guerre.", "eq": "Un Pèlerin des tranchées peut recevoir toute pièce d’équipement des tables d’armurerie des Pèlerins des tranchées.", "cap": [{"n": "Force du fanatique", "t": "jusqu‘à 1 Pèlerin des tranchées ou Martyr-Pénitent peut recevoir le mot-clé FORT pour +5 👑. De plus, la figurine doit être montée sur un socle de 32mm."}, {"n": "Résurrection", "t": "lorsqu‘un Pèlerin des tranchées est tué (▶ voir les règles de campagne, page 258), il peut ressusciter en tant que Martyr-Pénitent"}], "kw": ""}, "pe|nonne": {"fl": "Bénies de stigmates et d’une foi inébranlable, ces nonnes maîtrisent l’épée et constituent l’avantgarde de tout assaut des forces sacrées.", "eq": "Une Nonne stigmatisée peut recevoir toute pièce d’équipement des tables d’armurerie des Pèlerins des tranchées. Les armes de tir et les grenades se trouvent cependant limitées aux pistolets, aux pistolets automatiques et aux croix de guerre ; aucune restriction ne s’applique aux autres types d’équipement.", "cap": [{"n": "Leste", "t": "ajoutez +1 DÉ au jet de résolution risqué quand la Nonne stigmatisée escalade, saute, effectue une charge plongeante ou une ACTION de Course."}, {"n": "Stigmates bénis", "t": "à chaque fois que vous retirez 1 M ARQUEUR SANG d‘une Nonne stigmatisée grâce au mot-clé RÉGÉNÉRATIO N 1 , placez 1 MA RQUEUR BÉNÉDICTION à côté de la Nonne stigmatisée."}], "kw": "PÈLERIN, RÉGÉNÉRATIO"}, "pe|prisonnier": {"fl": "Entravés par des chaînes, l’esprit consumé par une détermination désespérée, les Prisonniers ecclésiastiques foncent vers l’avant, motivés par l’espoir que leur charge sacrificielle purifiera d’une manière ou d’une autre leur âme ternie.", "eq": "Un Prisonnier ecclésiastique porte toujours un capirote de fer ( ▶ voir l’équipement spécial des Pèlerins des tranchées). Jusqu’à 4 Prisonniers ecclésiastiques peuvent recevoir un engin de martyre pour 35 👑 ( ▶ voir ci-dessous). Le reste de l’équipement leur est interdit.", "cap": [{"n": "Attendu", "t": "un Prisonnier ecclésiastique mis Hors de combat quand son engin de martyre est déclenché ne compte pas dans le nombre de figurines de la bande mises Hors de combat pour ce qui est des tests de Moral."}, {"n": "Course folle", "t": "ajoutez +1 DÉ au jet de résolution risqué quand le Prisonnier ecclésiastique effectue une ACTION de Course."}, {"n": "Piètre coup", "t": "un Prisonnier ecclésiastique peut effectuer une attaque au corps à corps même s’il ne dispose d’aucune arme de corps à corps. Pour cela, ajoutez −1 DÉ au jet de résolution pour l’attaque."}], "kw": "PÈLERIN"}, "pe|anachorete": {"fl": "Cette colossale armure mécanique, alimentée au diesel et à la foi, se dresse comme un sinistre symbole du désespoir de l’humanité. Dans la cavité tachée de sang et hérissée de pics de l’engin, le moine-pilote endure une forme de pénitence terrible. Ses prières et ses chants angoissés résonnent à travers le champ de bataille. Ce grotesque amalgame de souffrance et de dévotion instille la peur dans le cœur des Hérétiques quand l’Anachorète, arme malveillante drapée dans une iconographie sainte et des viscères dégoulinants, émerge pour libérer une symphonie de massacre. Avec ce chant, la misérable union de l’homme et de la machine annonce la fin de quiconque s’oppose au Tout-puissant..", "eq": "Un Sanctuaire d’anachorète est équipé d‘une broyeuse d’os et d‘une roue de Sainte-Catherine ( ▶ voir ci-dessous). Ces armes sont intégrées au Sanctuaire d’anachorète et ne peuvent être ni retirées ni perdues au fil de la campagne, quelle qu’en soit la raison. La figurine ne peut recevoir aucun autre équipement.", "cap": [{"n": "Brisé sur la roue", "t": "au début de chaque partie, avant le déploiement, vous pouvez annoncer qu’un Pèlerin des tranchées ou un Prisonnier ecclésiastique est brisé sur la roue pour démontrer sa piété et sa dévotion. La figurine que vous désignez est définitivement retirée de votre bande, mais vous pouvez distribuer son équipement aux autres figurines autorisées à le recevoir à la phase d‘Intendance suivante. Le Sanctuaire d’anachorète brise alors les os du volontaire et emporte au combat le corps désarticulé de sa victime, attachée sur sa roue. Infligez à l’infortuné martyr les blessures que devrait subir le Sanctuaire d’anachorète, jusqu’à ce que le sacrifié finisse par succomber. Cet effet est représenté par les règles spéciales ci-dessous, qui s’appliquent au Sanctuaire d’anachorète jusqu’à ce qu’il souffre d’un résultat Hors de combat sur la table de blessure : Sa caractéristique d’Armure égale 0 et il perd les mots-clés IMMUNITÉ SHRAPNEL et ROBUSTE. Il considère les résultats À terre comme des résultats Blessure légère. Le premier résultat Hors de combat qu’il subit sur la table de blessure est traité comme un résultat Pas d’effet . Retirez alors tous les MARQUEURS SANG du Sanctuaire d’anachorète, et ces règles spéciales ne s’appliquent plus à sa figurine. La figurine regagne alors une caractéristique d‘armure de −3, et les motsclés IMMUNITÉ SHRAPNEL et ROBUSTE. Le mot-clé ROBUSTE s‘appliquera donc la prochaine fois que la figurine subira un résultat Hors de combat sur la table de blessure."}, {"n": "Symphonie de massacre", "t": "un Sanctuaire d’anachorète est armé de deux armes de corps à corps à 1 main (la roue de Sainte-Catherine et la broyeuse d’os). Quand il effectue une attaque au corps à corps, il peut attaquer une seule fois, à l’aide de l’une ou l’autre de ces armes, ou deux fois (la première avec la roue et la seconde avec la masse ; le modificateur d’arme secondaire s’applique à l’attaque portée avec la broyeuse d’os)."}], "kw": "PÈLERIN, PEUR, IMMUNITÉ SHRAPNEL, FORT, ROBUSTE"}, "su|yuzbasi": {"fl": "Une bande du Sultanat de Fer doit inclure 1 Yüzbaşı. Les expéditions militaires au-delà du Grand Mur de Fer et dans le No Man’s Land s’accompagnent de nombreux risques, et elles obéissent à des officiers de terrain, les Yüzbaşı. On attend d’eux qu’ils mènent depuis le front, et leur sélection s’opère uniquement au mérite, sans accorder aucune considération à la lignée familiale ou à la richesse. Les Yüzbaşı sont promus dans les rangs des meilleurs soldats du Sultanat, et l’on endurcit leurs corps contre les blessures grâce aux arts jabiréens.", "eq": "Un Yüzbaşı peut recevoir toute pièce d’équipement des tables d’armurerie du Sultanat de Fer.", "cap": [{"n": "Vétéran des Janissaires", "t": "vous pouvez faire du Yüzbaşı un Vétéran des Janissaires avec le mot-clé FORT et la capacité Contre-charge pour +10 👑 . Contre-charge (Vétéran des Janissaires uniquement) : Si la première ACTION du Yüzbaşı au cours de son activation est une charge, ajoutez +1 DÉ aux attaques au corps à corps qu’il effectue pour le reste de cette activation."}, {"n": "Mubarizun", "t": "on attend du Yüzbaşı qu’il affronte en duel les plus redoutables des ennemis, inspirant ainsi les troupes à remporter la victoire grâce à ses prouesses personnelles. Ajoutez +1 D É BLESSURE aux attaques effectuées contre une cible avec le mot-clé ROBUSTE."}], "kw": "SULTANAT, ÉLITE, CHEF, IMMUNITÉ PEUR, ROBUSTE"}, "su|alchimiste": {"fl": "L’alchimiste jabiréen est un maître des pouvoirs ésotériques, capable de contrôler le feu, la glace, le métal et le liquide, mais aussi de créer des appareils mécaniques complexes, des formes de vie artificielles et des armes d’une puissance calamiteuse. En échange de la liberté de pratiquer leurs arts, les alchimistes fournissent au Sultanat les lions de bataille jabiréens, inégalés, et servent au front, où leurs composés alchimiques dévastateurs font fondre la chair sur les os des Infidèles, allant jusqu’à dissoudre les plus résistantes des armures.", "eq": "Un Alchimiste jabiréen peut recevoir toute pièce d’équipement des tables d’armurerie du Sultanat de Fer.", "cap": [{"n": "Maîtrise des éléments", "t": "quand vous déployez pour la première fois de la partie cette figurine, vous pouvez donner l’un des mots-clés suivants à toutes ses armes (de tir et de corps à corps) : FEU, GAZ ou SHRAPNEL. Toutes les armes reçoivent le même mot-clé. Si une arme présente déjà ce mot-clé, elle ne reçoit rien de plus."}, {"n": "ACTION Changement élémentaire", "t": "un Alchimiste jabiréen peut déclarer l’ACTION Changement élémentaire. Effectuez alors un jet de résolution risqué pour la figurine. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique, vous pouvez modifier le mot-clé offert à toutes ses armes par la capacité Maîtrise des éléments, en optant alors pour l’un des autres choix."}], "kw": "SULTANAT, ÉLITE"}, "su|assassin": {"fl": "Les assassins constituent un ordre légendaire de guerriers mystiques, dont on évoque les arts ésotériques et le caractère impitoyable à voix basse à travers le monde. Les assassins peuvent plier le temps et l’espace grâce à des rituels sacrés et de puissants hallucinogènes découverts par les mages de l’ordre. Ces obscurs pouvoirs leur permettent de rôder derrière les lignes ennemies pour chasser leurs proies avec une efficacité impitoyable. Ils semblent pouvoir se trouver à deux endroits à la fois : ils frappent un adversaire à une vitesse remarquable avant de remonter le temps sur quelques battements de cœur, à l’abri des représailles.", "eq": "Un Assassin du Sultanat peut recevoir toute pièce d’équipement des tables d’armurerie du Sultanat de Fer.", "cap": [{"n": "Assassin temporel", "t": "après avoir déterminé le bonus de charge d’un Assassin du Sultanat qui n’a pas encore effectué d’ACTION de Combat durant cette activation, vous pouvez annoncer qu’il va se diviser dans le cours du temps. Dans ce cas, désignez une figurine supplémentaire éligible comme cible de la charge (les règles de charge normales s’appliquent, sauf que les cibles de votre charge ne comptent plus comme des figurines ennemies interposées). Faites ensuite votre mouvement de charge pour terminer à 1” ou moins de l’une des deux cibles déclarées et effectuez immédiatement une ACTION de Combat contre elle. Après avoir résolu cette ACTION, retirez l’Assassin du Sultanat du champ de bataille et redéployez-le à 1” ou moins de la seconde cible déclarée et effectuez immédiatement une ACTION de Combat contre elle. L’Assassin du Sultanat doit utiliser la même arme de corps à corps pour ces deux attaques, et il ne peut pas effectuer d’autre ACTION de Combat durant la même activation."}, {"n": "Glissade temporelle", "t": "si votre adversaire échoue à un jet de résolution pour une attaque prenant pour cible l’Assassin du Sultanat, vous pouvez déclarer que ce dernier glisse de quelques secondes dans le futur. Vous pouvez alors le redéployer n’importe où à 6” ou moins de son emplacement d’origine (en mesurant du centre de son socle jusqu’au centre de son socle), mais à plus de 1” de toute figurine ennemie. Si l’attaque ratée était provoquée par le repli de l’Assassin du Sultanat, le repli se termine après avoir redéployé la figurine."}], "kw": "SULTANAT, ÉLITE, INFILTRATEUR"}, "su|azab": {"fl": "Les Azabs sont des soldats que l’on recrute dans la multitude de provinces du Sultanat, où une maison sur vingt doit équiper un soldat et l’envoyer servir le prince de Tous Ceux qui Croient. Leurs supérieurs les utilisent souvent comme escarmoucheurs légers pour harceler et retenir l’ennemi le temps que les soldats lourds approchent pour l’achever.", "eq": "Un Azab peut recevoir toute pièce d’équipement des tables d’armurerie du Sultanat de Fer.", "cap": [{"n": "Tirailleur léger", "t": "tout Azab peut recevoir le mot-clé TIRAILLEUR pour +5 👑 ."}], "kw": "SULTANAT"}, "su|sapeur": {"fl": "Les sapeurs du Sultanat se composent de spécialistes prisés : ils tiennent les grands canons du Mur de Fer, qu’importe ce que leurs ennemis leur jettent dessus. On les identifie sans mal aux terribles brûlures qui meurtrissent leur corps, puisque leur puissante artillerie tend à surchauffer.", "eq": "Un Sapeur du Sultanat possède toujours une pelle ( ▶ voir l’équipement standard, page 132), qui ne peut être ni retirée ni perdue au fil de la campagne, quelle qu’en soit la raison. Il peut aussi recevoir toute pièce d’équipement des tables d’armurerie du Sultanat de Fer.", "cap": [{"n": "ACTION Fortification", "t": "le Sapeur du Sultanat peut déclarer l’ACTION Fortification. Effectuez alors un jet de résolution risqué pour la figurine. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique, le Sapeur du Sultanat gagne le mot-clé COUVERT jusqu’à ce qu’il quitte sa position actuelle."}, {"n": "ACTION Pose de mine", "t": "un Sapeur du Sultanat peut déclarer l’ACTION Pose de mine s’il se trouve en contact d’un élément de terrain mesurant au maximum 8” de côté qui na pas le mot-clé MINÉ. Effectuez alors un jet de résolution pour la figurine en y ajoutant +2 DÉS. En cas d’échec, rien ne se passe. En cas de réussite ou de réussite critique, l’élément de terrain gagne le mot-clé MINÉ."}, {"n": "Désamorçage", "t": "lorsqu’un Sapeur du Sultanat se déplace au contact d’un marqueur ou d’un élément de terrain avec le mot-clé MINÉ , vous pouvez déclarer que le Soldat du génie va tenter de désamorcer la mine avant qu’elle n’explose ( ▶ MINÉ). Effectuez un jet de résolution risqué pour la figurine. En cas d’échec, la mine explose et l’activation du Sapeur du Sultanat prend fin. En cas de réussite ou de réussite critique, la mine n’explose pas et le marqueur ou l’élément de terrain perd le mot-clé MINÉ . Une figurine qui a posé une mine peut automatiquement la désamorcer s’il entre en contact avec (ne faites pas de jet de résolution risqué )."}, {"n": "Positions avancées", "t": "quand vous déployez pour la première fois de la partie un Sapeur du Sultanat, vous pouvez le déployer jusqu’à 6” au-delà de votre zone de déploiement, au contact d’un élément de terrain d’au moins ½” de haut."}], "kw": ""}, "su|lion": {"fl": "Malgré leur nom tiré des prédateurs meurtriers des plaines, les Lions de Jabir peuvent prendre de nombreuses formes, et toutes ne sont pas léonines. Chacun d’entre eux constitue un chef-d’œuvre unique, qui se développe selon les talents et le sens artistique du scientifique jabiréen qui le crée. La vitesse et la férocité des Lions n’ont presque pas d’égal, et certains d’entre eux possèdent d’étranges pouvoirs que leur a accordés leur naissance alchimique.", "eq": "Un Lion de Jabir ne peut être équipé que d’une armure et/ou une amulette du vent, tirées des tables d’armurerie du Sultanat de Fer. Tout Lion de Jabir peut recevoir le mot-clé PEUR pour +5 👑 .", "cap": [{"n": "Crocs et griffes", "t": "le Lion de Jabir peut effectuer une attaque au corps à corps même s’il ne dispose d’aucune arme de corps à corps."}, {"n": "Grâce du Lion", "t": "ajoutez +1 D É au jet de résolution risqué quand le Lion de Jabir escalade, saute, effectue une charge plongeante ou une ACTION de Course."}, {"n": "Clouage au sol", "t": "les figurines ennemies montées sur un socle de 40 mm ou moins qui se trouvent À terre à 1” ou moins du Lion de Jabir ne peuvent pas se relever (même si le Lion de Jabir est lui-même À terre )."}, {"n": "Vie artificielle", "t": "ajoutez −1 DÉ BLESSU RE aux jets de blessure infligés au Lion de Jabir."}], "kw": "SULTANAT, ARTIFICIEL"}, "su|janissaire": {"fl": "Les janissaires constituent l’élite des guerriers du Sultanat. On les élève dès l’enfance aux arts de la guerre. Capturés durant des raids sur les marches désolées à l’est et au nord du Mur de Fer, ils subissent dès leur plus jeune âge un entraînement martial et un endoctrinement rigoureux. Sur le champ de bataille, les janissaires excellent dans les contre-charges dévastatrices, l’écrasement des formations d’élite et la protection d’individus de haut rang.", "eq": "Un Janissaire peut recevoir toute pièce d’équipement des tables d’armurerie du Sultanat de Fer.", "cap": [{"n": "Contre-charge", "t": "si la première ACTION effectuée par un Janissaire au cours de son activation est une charge, ajoutez +1 DÉ aux attaques au corps à corps qu’il effectue pour le reste de cette activation."}], "kw": "SULTANAT, FORT"}, "su|taureau": {"fl": "Le Taureau d’airain, créature monstrueuse d’une immense puissance et d’une vitalité débordante, s’avère capable de trancher net même les rejetons bâtards d’un diable. Les armuriers l’équipent d’une artillerie lourde que même les surhumains janissaires ne peuvent soulever, et encore moins utiliser au combat : des canons à flammes, des armes à canons multiples et des lames sacrées bénies par la Parole du Grand Protecteur.", "eq": "Un Taureau d’airain sélectionne son équipement dans les tables d’armurerie du Sultanat de Fer. Toutes ses armes doivent avoir le mot-clé LOURD, et il ne peut pas avoir de pelle à moins qu’il s’agisse d’une pelle de marid. Aucune restriction ne s’applique aux autres types d’équipement.", "cap": [{"n": "ACTION Piétinement", "t": "le Taureau d’air ain peut déclarer l’ACTION Piétinement. Il prend alors pour cible d’une attaque au corps à corps un ennemi qui se trouve À terre à 1 ” ou moins. Cette attaque n’utilise pas d’arme de corps à corps et possède le mot-clé IGNORE ARMURE."}, {"n": "Vie artificielle", "t": "ajoutez −1 DÉ BLESSURE aux jets de blessure infligés au Taureau d’airain."}], "kw": "SULTANAT, ARTIFICIEL, FORT, PEUR, ROBUSTE"}, "su|homoncule": {"fl": "Les Homoncules du Takwin peuvent endosser pratiquement n’importe quelle forme, et leur taille varie du minuscule diablotin au colosse culminant à plus de quatre mètres et demi, selon le talent et les besoins de l’alchimiste qui les crée. Leur existence se révèle souvent difficile, puisque même la mort ne les libère pas de la servitude. En effet, l’alchimiste peut alors se contenter de les réparer et de les ranimer. Certains, dotés d’une intelligence suffisante, adoptent une posture philosophique et trouvent un certain épanouissement au service d’une cause noble.", "eq": "Un Homoncule du Takwin ne peut recevoir aucun équipement, mais il peut faire l’objet de formules alchimiques ( ▶ voir ci-dessous).", "cap": [{"n": "Martèlement", "t": "l’Homoncule du Takwin peut effectuer une attaque au corps à corps même s’il ne dispose d’aucune arme de corps à corps."}, {"n": "Re-création", "t": "si l’Homoncule du Takwin est tué durant la phase de Campagne, vous n’avez pas besoin de le retirer de la fiche de bande. À la place, vous pouvez payer 40 👑 à la prochaine phase d’Intendance pour le maintenir sur la fiche."}, {"n": "Vie artificielle", "t": "ajoutez −1 DÉ BL ESSURE aux jets de blessure infligés à l’Homoncule du Takwin."}], "kw": "SULTANAT, ARTIFICIEL"}, "le|pretre": {"fl": "Une bande des Légions Hérétiques doit inclure 1 Prêtre hérétique. Ces prêtres déchus, à la tête des bandes hérétiques, manient des magies impies pour convoquer des démons pétrificateurs et d’autres créatures grâce à leurs sorts goétiques. La majorité d’entre eux a prêté serment à un seigneur démoniaque de l’Enfer, comme Pazuzu ou Gusion, et les évangiles impies qu’ils récitent frappent de terreur les forces ecclésiastiques, causant saignements d’oreille et explosions de globes oculaires.", "eq": "Un Prêtre hérétique peut recevoir toute pièce d’équipement des tables d’armurerie des Légions Hérétiques.", "cap": [{"n": "ACTION Marionnettiste", "t": "le Prêtre hérétique peut déclarer l’ACTION Marionnettiste. Effectuez alors un jet de résolution risqué pour la figurine. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique, désignez 1 figurine (amie ou ennemie, sauf le Prêtre hérétique) à 12” ou moins du Prêtre hérétique et dans sa ligne de vue. Vous pouvez déplacer cette figurine de d6”, en ligne droite, dans n’importe quelle direction. Vous pouvez l’amener à 1” ou moins d’un ennemi, effectuer un repli, escalader, sauter, sauter en contrebas. La figurine ainsi déplacée ne peut pas faire de charge plongeante et ne compte pas comme ayant chargé si elle termine à 1” ou moins d’un ennemi."}], "kw": "HÉRÉTIQUE, ÉLITE, CHEF, ROBUSTE"}, "le|commando": {"fl": "Ces terrifiants agents infiltrés se doublent de tueurs silencieux, qu’équipent des générateurs de discrétion capables de les camoufler aux Yeux de Dieu. Ils ont la réputation d’éliminer des escouades entières à eux seuls.", "eq": "Un Commando de la Mort peut recevoir de l’équipement des tables d’armurerie des Légions Hérétiques. Les seules armes de tir et grenades auxquelles il a accès sont les pistolets silencieux et chaînes de tourmenteur, et les grenades à gaz ; aucune restriction ne s’applique aux autres types d’équipement.", "cap": [{"n": "ACTION Se cacher", "t": "le Commando de la Mort peut déclarer l’ACTION Se cacher s’il se trouve au contact d’un élément de terrain d’au moins ½” de haut. Effectuez alors un jet de résolution risqué pour la figurine en y ajoutant +1 DÉ. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique, les figurines ennemies ne peuvent pas prendre le Commando de la Mort pour cible de leurs attaques de tir et de leurs charges jusqu’à ce qu’il se déplace, charge, se replie ou effectue une attaque de tir, ou jusqu’à ce qu’une figurine ennemie parvienne à 1,5” ou moins de lui. Le Commando de la Mort peut néanmoins être touché par l’explosion d’une arme dotée du mot-clé EXPLOSION."}, {"n": "Générateur de discrétion", "t": "ajoutez −1 DÉ aux attaques de tir qui prennent pour cible le Commando de la Mort."}], "kw": "HÉRÉTIQUE, ÉLITE"}, "le|choriste": {"fl": "Les Choristes se sacrifient sur des autels noirs et, si on les juge dignes, se relèvent après neuf jours pour finir leur propre décapitation. Leur tête tranchée se met alors à chanter. Leurs hymnes convoquent des visions de l’Enfer qui sapent la force et la détermination de leur auditoire, et leur sang gelé trace des symboles diaboliques au rythme de ce chœur impie. Quiconque entend ces chants voit son esprit envahi de visions des fosses de l’Enfer, ce qui affaiblit sa résolution et sa force, car la musique redoutable dévore son âme même.", "eq": "Un Choriste peut recevoir toute pièce d’équipement des tables d’armurerie des Légions Hérétiques.", "cap": [{"n": "Hymnes impies", "t": "ajoutez −1 DÉ aux jets de résolution des figurines ennemies à 8” ou moins d’un Choriste."}], "kw": "HÉRÉTIQUE, ÉLITE, PEUR"}, "le|soldat": {"fl": "Ces soldats composent le gros des forces hérétiques. Les légionnaires hérétiques ont vu la porte de l’Enfer et survécu ; ils sont damnés pour l’éternité. Profil du Soldat hérétique", "eq": "Un Soldat hérétique et un Légionnaire hérétique peuvent recevoir toute pièce d’équipement des tables d’armurerie des Légions Hérétiques.", "cap": [{"n": "Légionnaires hérétiques", "t": "vous pouvez améliorer tout Soldat hérétique en Légionnaire hérétique pour un surcoût de 10 👑 , sauf si cette promotion devait vous laisser avec plus de Légionnaires que de Soldats dans votre bande. Augmentez alors sa caractéristique de Tir ou sa caractéristique de Corps à corps de +0 D É à +1 D É."}], "kw": "HÉRÉTI"}, "le|loup": {"fl": "Cette abomination charge à travers des kilomètres de fil barbelé, dégageant ainsi le passage pour les fantassins hérétiques : sa tête à la forme particulière est expressément conçue pour couper net ces obstacles. Les loups de guerre portent une armure singulière, forgée dans les usines infernales, comme en témoigne le poinçon du fabricant.", "eq": "Un Loup de guerre possède une gueule-tronçonneuse et des griffes affûtées. Ces armes font partie de lui et ne peuvent être ni retirées ni perdues au fil de la campagne, quelle qu’en soit la raison. Le reste de l’équipement lui est interdit.", "cap": [{"n": "Bête d’assaut", "t": "le Loup de guerre est équipé de deux armes de corps à corps (sa gueule-tronçonneuse et ses griffes affûtées). Quand il effectue une attaque au corps à corps, il peut attaquer une seule fois, à l’aide de l’une ou l’autre de ces armes, ou deux fois (la première avec sa gueule et la seconde avec ses griffes ; le modificateur d’Arme secondaire s’applique à l’attaque portée avec les griffes). Notez que chacune de ces armes présente le mot-clé RISQUÉ, ce qui signifie que l’activation du Loup de guerre prend fin si le jet de résolution d’une attaque portée avec l’une de ces armes se solde par un échec."}, {"n": "Course bondissante", "t": "ajoutez +1 DÉ au jet de résolution risqué pour l’ACTION de Course du Loup de guerre."}], "kw": "HÉRÉTIQUE, ARTIFICIEL, IMMUNITÉ TERRAIN DIFFICILE, PEUR, ROBUSTE"}, "le|miserable": {"fl": "De nombreux malchanceux tombent dans les mains de bandes d’Hérétiques, qu’ils soient capturés dans des raids, achetés sur des marchés aux esclaves ou cueillis par des patrouilles vigilantes. On marque ces âmes désespérées avec des tatouages maudits qui dévorent la chair pour les dissuader de s’échapper, et on les drogue fortement pour émousser leur volonté tout en laissant leur agressivité intacte.", "eq": "Un Misérable peut recevoir toute pièce d’équipement des tables d’armurerie des Légions Hérétiques qui coûte au maximum 10 👑 . Il doit avoir au moins 1 arme (on ne peut pas l’envoyer au combat complètement désarmé).", "cap": [{"n": "Bétail humain", "t": "dans une campagne, un Misérable peut être vendu durant l’étape d’Intendance, contre 25 👑 plus la moitié du coût en 👑 de son équipement."}, {"n": "Loi de l’Enfer", "t": "si une attaque du Misérable met Hors de combat une figurine ennemie avec le mot-clé ÉLITE, la figurine du Misérable gagne sa liberté, et vous la retirez immédiatement de la partie. Elle ne compte plus dans votre bande du point de vue des tests de Moral, et vous l’effacez de la fiche de bande."}, {"n": "Sombre bénédiction", "t": "quand un Misérable est mis Hors de combat , placez 1 MARQUEUR BÉNÉDICTION à côté de la plus proche figurine amie dotée des mots-clés ÉLITE et HÉRÉTIQUE. En cas d’égalité entre deux figurines, choisissez celle qui reçoit le MARQUEUR BÉNÉDICTION."}], "kw": "HÉRÉTIQUE"}, "le|oint": {"fl": "La peau de ces soldats d’assaut lourdement armés et caparaçonnés est brûlée, et elle cloque à cause des allées et venues en Enfer pour leurs pèlerinages religieux.", "eq": "Un Fantassin lourd oint possède toujours une armure renforcée et une marque infernale ( ▶ voir l’équipement ordinaire, page 132). Ces pièces d’équipement ne peuvent être ni retirées ni perdues au fil de la campagne, quelle qu’en soit la raison. Le modificateur de blessure dû à l’armure est inclus dans le profil de la figurine. De plus, un Fantassin lourd oint peut recevoir toute pièce d’équipement des tables d’armurerie des Légions Hérétiques, en dehors d’une armure.", "cap": [{"n": "", "t": "Aucune"}], "kw": "HÉRÉTIQUE, FORT"}, "le|sorciere": {"fl": "Les sorcières artilleuses arpentent le champ de bataille pour jeter des équipements militaires assemblés dans les usines de la mort, au cœur du troisième cercle de l’Enfer. Complètement muettes, elles n’ont jamais révélé leur visage, ce qui en pousse certains à se demander si elles sont vraiment vivantes. Des rumeurs suggèrent qu’elles aussi sortent des usines infernales. Une sorcière artilleuse peut convoquer une infinité de bombes de l’Enfer grâce à un portail mystique qu’elle ouvre à volonté. Chaque engin apparaît dans sa main à travers un puits de ténèbres de minuit.", "eq": "Une Sorcière artilleuse possède toujours des bombes infernales ( ▶ voir ci-dessous) et peut recevoir toute pièce d’équipement des tables d’armurerie des Légions Hérétiques, en dehors des armes de tir et des grenades.", "cap": [{"n": "Batterie de sorcière artilleuse", "t": "vous pouvez inclure 0-2 Sorcières artilleuses dans votre bande si le coût total des autres figurines (comprenant leur équipement, etc.) atteint au moins 1 000 👑 ."}, {"n": "Lévitation", "t": "vous n’avez pas besoin d’effectuer de jet de résolution risqué pour une Sorcière artilleuse lorsqu’elle escalade ou saute, ou de jet de blessure lorsqu’elle chute."}, {"n": "Vie abiotique", "t": "ajoutez −1 DÉ BLESSURE au jet de blessure pour les attaques portées avec des armes dotées du mot-clé GAZ et qui prennent pour cible la Sorcière artilleuse."}], "kw": "HÉRÉTIQUE, ARTIFICIEL, IMMUNITÉ GAZ, IMMUNITÉ PEUR"}, "gn|seigneur": {"fl": "Une bande du Culte du Graal noir doit inclure 1 Seigneur des Tumeurs ou 1 Chevalier de la Peste. Ce célébrant noble de haut rang répand la crasse et la corruption chez ses amis comme chez ses ennemis. Il communie avec le seigneur des Mouches à travers une transe extatique et peut canaliser la puissance même du septième cercle de l’Enfer, sur lequel règne Belzébuth.", "eq": "Un Seigneur des Tumeurs peut recevoir toute pièce d’équipement des tables d’armurerie du Culte du Graal noir.", "cap": [{"n": "Caresse de Belzébuth", "t": "chaque fois qu’une attaque au corps à corps effectuée par le Seigneur des Tumeurs cause au moins 1 MARQ UEUR SANG ou INFECTION à une cible, placez 1 MA RQUEUR INFECTION supplémentaire."}, {"n": "Concassage", "t": "le Seigneur des Tumeurs peut effectuer une attaque au corps à corps de Concassage même s’il n’est pas équipé d’arme de corps à corps, ou à la place de ses armes de corps à corps. Dans ce cas, son attaque gagne le motclé BALAYAGE 2 ."}, {"n": "Résilience morte-vivante", "t": "ajoutez −1 DÉ BLE SSURE aux jets de blessure infligés au Seigneur des Tumeurs, à moins que l’attaque présente le mot-clé FEU."}], "kw": "GRAAL NOIR, ÉLITE, CHEF, FORT, IMMUNITÉ GAZ, PEUR, ROBUSTE"}, "gn|chevalier": {"fl": "Une bande du Culte du Graal noir doit inclure 1 Seigneur des Tumeurs accompagné de 0-2 Chevaliers de la Peste ou, en l’absence de Seigneur des Tumeurs, entre 1 et 3 Chevaliers de la Peste. Dernier échelon de la noblesse du Graal noir, ces grands guerriers en armure étaient autrefois des adorateurs parfaitement dépravés de Belzébuth. Quand le Culte du Graal noir vint les chercher, ils se soumirent volontiers à l’autorité du seigneur des Mouches. Ils conservent en conséquence un semblant de conscience et la capacité de manier des armes comme de leur vivant. Les Chevaliers de la Peste aspirent à remporter les faveurs de Belzébuth afin d’être peut-être promus, un jour, dans l’ordre de la Mouche.", "eq": "Un Chevalier de la Peste peut recevoir toute pièce d’équipement des tables d’armurerie du Culte du Graal noir. Il doit posséder une armure, mais aucune restriction ne s’applique aux autres types d’équipement.", "cap": [{"n": "Résilience morte-vivante", "t": "ajoutez −1 DÉ BLE SSURE aux jets de blessure infligés au Chevalier de la Peste, à moins que l’attaque présente le mot-clé FEU."}, {"n": "Rangs des Chevaliers de la Peste", "t": "▶ voir les règles spéciales de la page 209"}], "kw": "GRAAL"}, "gn|garde": {"fl": "Seuls les plus forts des dévots humains peuvent survivre aux bénédictions débilitantes du Culte du Graal noir. Quiconque y parvient est intronisé dans les rangs des gardes cadavériques, les gardes du corps de la noblesse du culte. S’ils se distinguent dans leur service, ils pourront un jour rejoindre les rangs de la noblesse infernale.", "eq": "Un Garde cadavérique peut recevoir toute pièce d’équipement des tables d’armurerie du Culte du Graal noir.", "cap": [{"n": "Garde du corps", "t": "si une attaque (de tir ou au corps à corps) touche une figurine du Graal noir amie à 1” ou moins du Garde cadavérique, vous pouvez annoncer que celui-ci s’interpose. Effectuez alors un jet de blessure pour le Garde cadavérique plutôt que pour la cible d’origine. Cette capacité ne peut pas servir contre les attaques dotées du mot-clé EXPLOSION."}, {"n": "Résilience morte-vivante", "t": "ajoutez −1 DÉ BLE SSURE aux jets de blessure infligés au Garde cadavérique, à moins que l’attaque présente le mot-clé FEU."}, {"n": "Hôte parasite", "t": "chaque fois qu’une attaque au corps à corps effectuée par le Garde cadavérique cause au moins 1 MA RQUEUR SANG ou INFECTION à la cible, vous pouvez retirer 1 M ARQUEUR SANG ou INFECTION du Garde cadavérique."}], "kw": "GRAAL NOIR, ÉLITE, IMMUNITÉ GAZ, PEUR"}, "gn|esclave": {"fl": "Les bienfaits du Culte du Graal noir conduisent lentement mais sûrement à une corruption totale. Seuls de très rares élus peuvent supporter les bénédictions du seigneur des Mouches. La plupart se transforment en Esclaves du Graal, destinés à rejoindre les légions infinies de coquilles malades, évidées et creuses qui doivent obéir pour l’éternité aux caprices des nobles du culte, tout en souffrant le tourment à cause de leurs innombrables infections surnaturelles. Les Esclaves se divisent en deux catégories : Les Esclaves du Graal sont devenus presque insensibles à la douleur, et les Esclaves de la Mouche sont contrôlés par les gigantesques mouches infernales qui ont planté leur trompe dans les profondeurs du système nerveux de leur victime, ce qui offre à celle-ci une plus grande mobilité, mais une résistance moindre à la douleur. Profil d’Esclave du Graal", "eq": "Un Esclave ne peut recevoir ni armes, ni armure, ni matériel. Il ne subit aucune pénalité quand il combat à mains nues.", "cap": [{"n": "Horde accablante", "t": "l’Esclave (du Graal ou de la Mouche) peut effectuer une attaque au corps à corps même s’il ne dispose d’aucune arme de corps à corps. De plus, pour chaque autre figurine amie à 3” ou moins de lui (sans le compter), ajoutez +1 D É au jet de résolution des attaques au corps à corps qu’il effectue."}, {"n": "Résilience morte-vivante (Esclaves du Graal uniquement)", "t": "ajoutez −1 D É BLESSURE aux jets de blessure infligés aux Esclaves du Graal, à moins que l’attaque présente le mot-clé FEU."}], "kw": "GRAAL NOIR, IMMUNITÉ GAZ, PEU R, VOL"}, "gn|molosse": {"fl": "Des vers et des mouches engendrés par le corps de Belzébuth en personne infestent ces carcasses de canidés parasites. Leur mission impie consiste à rôder dans le No Man’s Land pour répandre la maladie et la pestilence au nom de leur sombre maître.", "eq": "Un Molosse du Graal noir ne peut recevoir aucun équipement.", "cap": [{"n": "Carcasse infestée", "t": "le Molosse du Graal noir peut recevoir le mot-clé MARQUEUR INFECTION pour ses attaques au corps à corps pour un coût de 5 👑 ."}, {"n": "Crocs et griffes", "t": "le Molosse du Graal noir peut effectuer une attaque au corps à corps même s’il ne dispose d’aucune arme de corps à corps."}, {"n": "Porteur de maladie", "t": "quand une figurine ennemie est activée à 1” ou moins du Molosse du Graal noir, avant qu’elle effectue la moindre ACTION, placez 1 MARQUEUR INFECTION à côté d’elle."}, {"n": "Résilience morte-vivante", "t": "ajoutez −1 DÉ BLESSURE aux jets de blessure infligés au Molosse du Graal noir, à moins que l’attaque présente le mot-clé FEU."}, {"n": "Vitesse effrayante", "t": "ajoutez +1 DÉ au jet de résolution risqué quand le Molosse du Graal noir effectue une ACTION de Course. De plus, il ne subit aucune pénalité à sa caractéristique de Mouvement quand il se relève au début de son activation."}], "kw": "GRAAL NOIR, IMMUNITÉ GAZ, PEUR"}, "gn|heraut": {"fl": "Certaines victimes du Culte du Graal noir subissent un sort pire que la transformation en Esclave : fusionnées avec des mouches infernales, elles passent par une mutation épouvantable et deviennent des insectes ailés monstrueux composés de chair difforme. Ces écuyers et éclaireurs de l’ordre de la Mouche s’envolent en tant que hérauts de Belzébuth. Leur corps humain résiduel reste conscient pendant que le mal le dévore lentement de l’intérieur pour servir de carburant au héraut. Leur corps difforme, lui, combat contre leur gré pour la gloire de l’Enfer. Les hérauts servent d’avant-garde à tout assaut du Graal noir. Le bourdonnement à crever les tympans de leurs ailes frappe de terreur tous les défenseurs, brise leur concentration et sape leur volonté. Les hérauts manient des armes abandonnées, contaminées par des vers parasites qui les forent et infectent les victimes. Chaque balle malade présente une conscience lugubre : elle trouve la moindre faille dans une armure, elle fouit le système nerveux, et elle liquéfie les organes internes.", "eq": "Un Héraut de Belzébuth peut recevoir toute arme de tir des tables d’armurerie du Culte du Graal noir et un casque aux yeux à facettes. Il ne peut recevoir aucune autre pièce d’équipement.", "cap": [{"n": "Bourdonnement exaspérant", "t": "jusqu’à 1 Héraut de Belzébuth peut recevoir la capacité Bourdonnement exaspérant pour un surcoût de 10 👑 . Les jets de résolution effectués pour les figurines ennemies à 8” ou moins de ce Héraut deviennent des jets de résolution risqués (aucun effet s’il s’agit déjà de jets de résolution risqués )."}, {"n": "Trompe infectée", "t": "le Héraut de Belzébuth peut effectuer une attaque au corps à corps dotée du mot-clé MARQUEUR INFECTION même s’il ne dispose d’aucune arme de corps à corps. Si une telle attaque cause au moins 1 MAR QUEUR INFECTION à la cible, vous pouvez retirer 1 M ARQUEUR SANG du Héraut de Belzébuth."}], "kw": "GRAAL NOIR, IMMUNITÉ GAZ, PEUR, TIRAILLEU"}, "gn|amalgame": {"fl": "Masse titubante et gigantesque, un Amalgame se compose de dizaines de cadavres infectés de guerriers ennemis, d’insectes et de mammifères, ainsi que de toute autre créature vivante qui a eu le malheur de succomber aux bénédictions insoutenables du Culte du Graal noir. Ces aberrations chancellent à travers le champ de bataille comme des montagnes ambulantes de chair malade et corpulente. Leurs bras balancent en tous sens les armes que leurs victimes utilisaient de leur vivant. Tout ce qui a la malchance de se trouver sur leur route finit écrasé, réduit en pulpe révoltante par leurs jambes gigantesques.", "eq": "", "cap": [{"n": "Monstruosité à six bras", "t": "l’Amalgame peut effectuer à chaque activation, 1 ACTION de Tir pour chaque arme de tir et 1 ACTION de Combat pour chaque arme de corps à corps dont il est équipé. Le modificateur d’arme secondaire ne s’applique à aucune de ces attaques au corps à corps."}, {"n": "Corpulent", "t": "ajoutez −2 DÉS BLESSURE au jet de blessure pour toutes les attaques infligées à l’Amalgame."}, {"n": "ACTION Piétinement", "t": "l’Amalgame peut déclarer l’ACTION Piétinement. Il doit alors effectuer une attaque au corps à corps contre un ennemi qui se trouve À terre . Cette attaque n’utilise aucune arme de corps à corps et présente le mot-clé IGNORE ARMURE."}, {"n": "Inarrêtable", "t": "les figurines ennemies montées sur un socle de 32 mm ou moins ne sont pas autorisées à effectuer une attaque au corps à corps contre un Amalgame qui se replie à 1” ou moins d’elles. En outre, l’Amalgame peut déclarer une ACTION de Déplacement ou de Charge même s’il commence à 1” ou moins de figurines ennemies montées sur un socle de 32 mm ou moins."}], "kw": "GRAAL NOIR, FORT, IMMUNITÉ GAZ, PEUR, ROBUSTE"}, "co|preteur": {"fl": "Une bande de la Cour doit inclure soit un Préteur, soit un Sorcier, ou les deux. Chacun des préteurs, les commandants et magistrats de l’Enfer, supervise une province du fief de ses seigneurs démoniaques. Sur ordre de son maître, il dirige de petites cohortes qu’il lève parmi la population des domaines infernaux toujours changeants. Les Fiélons marqués se rassemblent à son signal, et les Chevaliers infernaux, contraints d’obéir aveuglément, ploient le genou face à ces redoutables commandants de campagne de l’Enfer.", "eq": "Un Préteur peut recevoir toute pièce d’équipement des tables d’armurerie de la Cour. Pouvoirs Un Préteur peut avoir jusqu’à 2 pouvoirs de la Goétie, sauf les Préteurs d’une bande de la Colère, limités à 1 Pouvoir.", "cap": [{"n": "", "t": "Aucune"}], "kw": "LA COUR, DÉMONIAQUE, ÉLITE, CHEF, FORT, PEUR, ROBUSTE, VOL"}, "co|sorcier": {"fl": "Une bande de la Cour doit inclure soit un Préteur, soit un Sorcier, ou les deux. Les Sorciers prennent diverses formes, modelant leur corps pour mieux lancer les sorts puissants dont ils ont la charge. Certains présentent plusieurs bras ou plusieurs têtes ; d’autres subissent d’innombrables altérations et de terribles améliorations. Ils s’en administrent eux-mêmes, mais d’autres leur sont imposées de force, selon les caprices de l’archidiable et de la cabale de grands sorciers qui mènent leur stratégie goétique. Les pieds des sorciers ne touchent pas le sol, un souvenir lointain de leur passé angélique. Ces créatures flottent plutôt sur les champs de bataille du No Man’s Land, en chantant le cruel Évangile de l’Enfer tout en avançant. Leur sagesse obscure et leur ruse impitoyable les rendent tout aussi capables de mener au combat les bandes de la Cour que de servir de conseiller à un Préteur qui s’aventure dans les royaumes mortels.", "eq": "Un Sorcier peut recevoir toute pièce d’équipement des tables d’armurerie de la Cour, à l’exception d’armes de tir et de grenades. Pouvoirs Un Sorcier peut avoir jusqu’à 3 pouvoirs de la Goétie. Il dispose en plus du sort goétique Bénédiction de la lune du Serpent ( ▶ voir ci-dessous) sans surcoût.", "cap": [{"n": "", "t": "Aucune"}], "kw": "LA COUR, DÉMONIAQUE, ÉLITE, PEUR, VOL"}, "co|chasseur": {"fl": "Les Chasseurs de la Cour du Serpent à Sept Têtes sont des disciples de la voie de la Main gauche. Ils arpentent l’arrière-pays primordial de l’Enfer, où ils traquent des bêtes cauchemardesques. Ils pratiquent une ignoble magye, grâce à laquelle ils lisent des présages et des signes dans le sang et les entrailles de leur proie, qu’ils ouvrent tandis qu’elle vit encore.", "eq": "Un Chasseur de la voie de la Main gauche possède toujours un arc du Léthé ( ▶ voir ci-contre), qui ne peut être ni retiré ni perdu au fil de la campagne, quelle qu’en soit la raison. Il doit toujours tenir cet arc dans l’une de ses mains, mais peut sinon recevoir toute pièce d’équipement des tables d’armurerie de la Cour, en dehors des armes à 2 mains. Pouvoirs Un Chasseur de la voie de la Main gauche dispose toujours des pouvoirs de la Goétie suivants : Arpenteur des ombres, Cape en peau de bête oracle et Voie de la Main gauche.", "cap": [{"n": "", "t": "Aucune"}], "kw": "LA COUR, DÉMONIAQUE, ÉLITE, INFILTRÉ"}, "co|chevalier": {"fl": "Les bataillons silencieux de l’Enfer, convoqués quand la Cour du Serpent à Sept Têtes cherche à se divertir, se composent des chevaliers infernaux. Leurs étendards aux flammes éternelles flottent lorsqu’ils partent en guerre pour exaucer la volonté de leurs maîtres. Bannerets des grands seigneurs de la Cour, ces champions répondent aux mortels assez fous pour oser défier les groupes de chasseurs de la noblesse du Serpent.", "eq": "Un Chevalier infernal possède toujours une armure en fer infernal ( ▶ voir l’armurerie de la Cour), qui ne peut être ni retirée ni perdue au fil de la campagne, quelle qu’en soit la raison. Le modificateur de blessure dû à l’armure est inclus dans le profil de la figurine, ci-dessus. Un Chevalier infernal peut de plus recevoir toute pièce d’équipement des tables d’armurerie de la Cour, en dehors d’une armure. Pouvoirs Un Chevalier infernal peut avoir jusqu’à 2 pouvoirs de la Goétie, dont l’un doit être le sort goétique Magie du sang ( ▶ voir ci-dessous), appris sans surcoût.", "cap": [{"n": "", "t": "Aucune"}], "kw": "LA COUR, DÉMONIAQUE, ÉLITE, FORT"}, "co|miserable": {"fl": "Les Misérables doivent rester moins nombreux que les figurines DÉMONIAQUES. Ces âmes infortunées ne possèdent pas une goutte de sang démoniaque. Elles servent de troupes de choc quand on ne les soumet pas à la torture pour alimenter la magie goétique des sorciers et d’autres utilisateurs des arts noirs. La loi de l’Enfer ne laisse aucun doute : si un misérable abat un puissant adversaire, on lui accorde la liberté, en mémoire et en l’honneur de la Première Rébellion, durant laquelle la guerre ravagea les Cieux et le sang des anges peignit le firmament en rouge.", "eq": "Un Misérable peut recevoir toute pièce d’équipement des tables d’armurerie de la Cour qui coûte au maximum 10 👑 . Il doit avoir au moins 1 arme (on ne peut pas l’envoyer au combat complètement désarmé).", "cap": [{"n": "Loi de l’Enfer", "t": "si une attaque du Misérable met Hors de combat une figurine ennemie avec le mot-clé ÉLITE, la figurine du Misérable gagne sa liberté, et vous la retirez immédiatement de la partie. Elle ne compte plus dans votre bande du point de vue des tests de Moral, et vous l’effacez de la fiche de bande."}], "kw": "LA COUR"}, "co|sauterelle": {"fl": "Ces terrifiantes créatures caparaçonnées et ailées, de la taille d’un cheval, présentent un visage difforme évoquant les humains. Elles se battent avec des lames tranchantes attachées à leurs membres et avec des dards empoisonnés.", "eq": "Une Sauterelle de la Fosse peut recevoir une couronne de feu infernal. Elle ne peut recevoir aucune autre pièce d’équipement.", "cap": [{"n": "Dards empoisonnés", "t": "une Sauterelle de la Fosse effectue ses attaques au corps à corps avec les mot-clé BALAYAG E 2 et SHRAPNEL même si elle n’a pas d’arme de corps à corps."}], "kw": ""}, "co|fielon": {"fl": "Les Fiélons marqués mesure entre sept et huit pieds de haut. Leur corps puissant, mêlant chairs épaisses et muscles noueux, est marqué au fer par leurs maîtres et tailladé par les couteaux des prêtres de l’Enfer afin de les désigner comme la propriété de démons plus puissants. Ils présentent des traits bestiaux, comme des cornes et des sabots de bovin ou de chèvre, ainsi que des membres simiesques aux os d’une densité prodigieuse. Les Fiélons marqués haïssent contempler leur propre reflet, car au plus profond de leur âme corrompue demeure encore la connaissance de la beauté et de la gloire qu’ils ont à jamais perdues.", "eq": "Un Fiélon marqué peut recevoir 1 arme de tir d’un coût maximal de 30 👑 dans les tables d’armurerie de la Cour. Il peut de plus recevoir toute pièce d’équipement des tables d’armurerie de la Cour, en dehors d’une arme de tir.", "cap": [{"n": "Haineux", "t": "quand le Fiélon marqué est activé, s’il se trouve à plus de 1” de toute figurine ennemie et si au moins une figurine ennemie dépourvue des motsclés GRAAL NOIR ou DÉMONIAQUE se situe à 12” ou moins de lui et dans sa ligne de vue, il doit alors déclarer une ACTION de Charge prenant pour cible la plus proche figurine ennemie. S’il est À terre au début de cette activation, il commence par se relever avant d’effectuer cette charge."}, {"n": "Tortionnaire", "t": "quand le Fiélon marqué effectue une attaque au corps à corps, il peut prendre pour cible une figurine amie dépourvue du mot-clé DÉMONIAQUE. Il ne peut alors plus attaquer durant cette activation."}], "kw": "LA COUR, DÉMONIAQUE"}, "co|saint": {"fl": "Les saints profanés comptent parmi les possessions les plus prisées des seigneurs de l’Enfer. Ces hommes et ces femmes étaient jadis destinés, selon le plan de Dieu, à devenir des saints, de grands prophètes ou des personnalités sacrées, mais on les détourna du droit chemin et ils tombèrent en disgrâce.", "eq": "Un Saint profané possède plusieurs bras : il peut être équipé de jusqu’à trois armes de corps à corps à 1 main tirées des tables d’armurerie de la Cour, ou deux armes de corps à corps à 1 main et une arme de corps à corps à 2 mains. Il ne peut recevoir aucune autre pièce d’équipement.", "cap": [{"n": "Annihilateur", "t": "un Saint profané peut effectuer une ACTION de Combat par arme dont il est équipé."}, {"n": "Aura démoniaque", "t": "un Saint profané émet l’une des auras suivantes. Celle-ci dépend du Péché capital auquel se dévoue la bande."}, {"n": "Aura de colère", "t": "ajoutez +1 DÉ aux attaques au corps à corps et au jet de résolution risqué effectué pour l’ACTION de Course pour les figurines amies à 8” ou moins du Saint profané (y compris pour lui-même)."}, {"n": "Aura d’envie", "t": "les figurines ennemies situées à 12” ou moins du Saint profané ne peuvent pas charger de
