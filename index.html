 figurines de votre bande situées à 1” ou moins d’une figurine de leur bande. Elles peuvent toutefois charger d’autres figurines de votre bande. Dans ce cas, celles situés à 1” ou moins d’une figurine de leur bande ne comptent pas comme figurine interposée."}, {"n": "Aura de luxure", "t": "si une figurine ennemie à 4” ou moins du Saint profané porte une armure dépourvue du mot-clé RÉSISTANT, vous pouvez ne pas tenir compte des autres mots-clés et des règles spéciales de cette armure tant que la figurine concernée reste à 4” ou moins du Saint profané. Les seuls mots-clés ou règles que vous ne pouvez pas ainsi annuler sont ceux qui affectent la taille du socle de la figurine. Par exemple, dans le cas d’une figurine dotée d’une armure mécanisée, vous pouvez annoncer que vous annulez les mots-clés −3 MODIFI CATEURS BLESSURE et la règle spéciale Inamovible tant qu’elle se trouve à 4” ou moins du Saint profané, mais que vous décidez de ne pas annuler la règle spéciale Volumineux ."}, {"n": "Aura d’orgueil", "t": "quand l’activation du Saint profané prend fin, placez 1 MARQUEUR SANG à côté de chaque figurine ennemie à 8” ou moins de lui."}, {"n": "Aura de paresse", "t": "les figurines ennemies à 8” ou moins du Saint profané considèrent un résultat de Blessure légère comme un résultat À terre . L’aura affecte aussi les figurines ennemies qui, en temps normal, considèrent un résultat À terre comme un résultat Blessure légère (comme les figurines vêtues d’une armure mécanisée)."}, {"n": "Aura de gourmandise", "t": "ajoutez −1 DÉ aux jets des figurines ennemies à 8” ou moins du Saint profané, sauf pour les figurines dotées des mots-clés GRAAL NOIR ou ARTIFICIEL."}, {"n": "Aura d’avarice", "t": "les figurines ennemies à 12” ou moins du Saint profané qui effectuent une ACTION de Charge doivent le prendre pour cible s’il se trouve dans leur ligne de vue et peuvent l’atteindre sans avoir à traverser un terrain dangereux, escalader, sauter, sauter en contrebas ou effectuer une charge plongeante."}], "kw": "LA COUR, DÉMONIAQUE, FORT, IGNORE ARME SECONDAIRE, PEUR, ROBUSTE"}, "mer|cosmas": {"fl": "Une Sœur de saint Cosmas est une Fidèle que peuvent recruter les bandes de Pèlerins des tranchées en tant que Mercenaire. Les sœurs de saint Cosmas constituent un corps médical d’élite, à l’entraînement parfait, qui se spécialise dans les premiers secours et les actes chirurgicaux sur les lignes de front de la Grande Guerre. Les sœurs prononcent un serment d’Hippocrate modifié, qui les contraint à aider les soldats de la foi blessés, qu’importe la gravité de la situation, tout en ne montrant absolument aucune pitié ou merci envers les Hérétiques et les autres ennemis sur le champ de bataille. Armées d’un couteau chirurgical faisant aussi office de miséricorde, elles s’avèrent autant douées pour sauver des vies que pour prendre celle des individus qu’elles trouvent blessés dans le No Man’s Land. Les sœurs transportent des trousses médicales remplies d’une variété de drogues de combat, capables d’engourdir la douleur des blessures les plus terribles. Dans le feu du combat, ces drogues se révèlent vitales, car elles donnent aux soldats la force de se relever une nouvelle fois et de retourner au combat au pas de course, même si ce n’est que pour quelques instants, afin d’accomplir leur mission ou de mourir en essayant.", "eq": "Une Sœur de saint Cosmas possède toujours une armure standard, un masque à gaz, une trousse de soins et une miséricorde.", "cap": [{"n": "Achever les blessés", "t": "en raison de leurs connaissances sur l’anatomie et la physiologie, les Sœurs savent parfaitement infliger des blessures débilitantes et une douleur atroce. Ajoutez +1 DÉ BLESSURE aux jets de blessure pour les attaques au corps à corps que la Sœur porte à une cible À terre et dépourvue des mots-clés GRAAL NOIR ou DÉMONIAQUE."}, {"n": "Infirmier expert", "t": "ajoutez +2 DÉ S au jet de résolution risqué d’une Sœur de saint Cosmas qui effectue l’ACTION Soins avec sa trousse de soins."}], "kw": "IMMUNITÉ"}, "mer|biologiste": {"fl": "Un Biologiste de combat est un Fidèle que peuvent recruter les bandes de la Nouvelle- Antioche et du Sultanat de Fer en tant que Mercenaire. La foi ne constitue pas un instrument passif sur la scène de la Grande Guerre. Il s’agit plutôt d’un outil que l’on renforce sans cesse, qu’on affûte par la connaissance et l’expérience. Pour les Fidèles, les biologistes de combat comptent parmi les nombreuses pierres à aiguiser destinées à cet affûtage. Ils se rendent auprès des souffrances du No Man’s Land pour capturer les ennemis du Tout-Puissant ou rassembler le plus de données possible sur leurs cadavres. Ces recherches aident à concevoir de nouvelles armes à brandir contre les adversaires de l’Église et du Sultanat de Fer, et aucun pécheur ni aucune bête de l’Enfer n’est à l’abri du vivisecteur bourré de toxines du biologiste de combat. Les biologistes de combat appartiennent au bureau pontifical de la Guerre biologique ou, dans le cas du Sultanat de Fer, à l’école Al-Bisţāmī des quatre-vingt-dix-neuf noms, qui forme d’une manière similaire les apprentis alchimistes ratés. Ces érudits se spécialisent dans la vivisection sur le champ de bataille : ils collectent des échantillons sur les plus puissants serviteurs de l’Enfer afin de les étudier, dans l’espoir perpétuel de concevoir de nouvelles armes capables de repousser les créatures de la Fosse dans les ténèbres. En raison de son entraînement, d’un conditionnement par l’hypnose et d’une exposition constante aux spécimens capturés, le biologiste de combat entre dans une transe guerrière quand il se retrouve face à des créatures qui provoquent la peur chez des soldats ordinaires. L’arme d’hast qu’il manie, un vivisecteur, combine des agents biologiques militaires sophistiqués et la brutalité fonctionnelle de la guerre de tranchées.", "eq": "Grenade à Gaz, Armure standard, masque à gaz et Viviscteur (voir vivisecteur)", "cap": [{"n": "Vivisection de terrain", "t": "si votre bande compte un Biologiste de combat, ajoutez l’Exploit glorieux Collecte d’informations à ceux que le scénario vous indique."}, {"n": "Collecte d’informations", "t": "vous complétez cet Exploit glorieux quand 3 figurines ennemies ont été mises Hors de combat alors qu’elles se trouvaient à 1” ou moins d’un Biologiste de combat ami."}, {"n": "Précieux spécimens", "t": "quand le Biologiste de combat met Hors de combat une figurine ennemie dotée du mot-clé DÉMONIAQUE ou GRAAL NOIR grâce à une attaque au corps à corps, placez 1 MARQUEUR BÉNÉDICTION à côté de lui."}], "kw": "IMMUNITÉ PEUR"}, "mer|bruleur": {"fl": "Un Brûleur de sorcières est un Fidèle que peuvent recruter les bandes de la Nouvelle-Antioche et de Pèlerins des tranchées en tant que Mercenaire. Les brûleurs de sorcières sont les officiers de terrain de l’Inquisition, et ils sont chargés de traquer et de châtier les sorcières, les sorciers et les Hérétiques que l’on ne peut conduire face à la justice par des moyens conventionnels. Sur le champ de bataille, ils disposent de la puissance nécessaire pour invoquer le châtiment divin sur celles et ceux qu’ils jugent avoir transgressé les lois de Dieu : les pécheurs prennent feu sur un simple mot de condamnation. Puisque tout le monde a commis au moins un péché mineur, personne n’est vraiment à l’abri.", "eq": "Un Brûleur de sorcières possède toujours une armure renforcée, un casque de combat et un marteau de la Justice ( ▶ voir ci-dessous).", "cap": [{"n": "ACTION Jugement divin", "t": "le Brûleur de sorcières peut déclarer l’ACTION Jugement divin. Effectuez alors un jet de résolution risqué pour la figurine. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique, désignez 1 figurine ennemie à 24” ou moins du Brûleur de sorcières (même hors de sa ligne de vue) et placez 1 M ARQUEUR SANG à côté d’elle. Si la figurine ennemie présente le mot-clé GRAAL NOIR, DÉMONIAQUE ou HÉRÉTIQUE, placez 2 MA RQUEURS SANG au lieu de 1."}, {"n": "Conduit digne", "t": "le Brûleur de sorcières a parfaitement conscience de la dignité de son statut. Il ne peut pas effectuer d’ACTION de Course."}], "kw": "ÉLITE, IMMUNITÉ PEUR"}, "mer|moine": {"fl": "Un Moine des munitions mendéliste est un Fidèle que peuvent recruter les bandes de la Nouvelle-Antioche et de Pèlerins des tranchées en tant que Mercenaire. L’ordre des moines mendélistes s’est vu confier la conception d’objets améliorés par les lois divines, ainsi que la création des Communiants, ces dévots qui ont subi une communion chimique. La confrérie des Munitions bénies constitue une secte interne de l’ordre, dont le devoir consiste à fournir aux Fidèles des munitions imprégnées du sang d’un Méta-Christ, altéré par chimie. Ces concoctions s’avèrent hautement instables et dangereuses à manipuler, et les secrets derrière leurs formules restent farouchement gardés. Sur le champ de bataille, les moines bravent le feu ennemi et les terreurs infernales sans ciller pour remplir leur devoir sacré : livrer des munitions et déverser la colère du Seigneur sur les Hérétiques. Leur patronne, sainte Barbara, relèverait ceux qui tombent au combat pour leur offrir une gloire éternelle.", "eq": "Un Moine des munitions mendéliste possède uniquement un masque à gaz. Notez que, puisqu’il n’a pas d’armes, il ne peut pas attaquer.", "cap": [{"n": "Adeptes fidèles", "t": "quand vous activez une figurine à 1” ou moins du Moine des munitions mendéliste, vous pouvez aussi activer ce dernier si vous ne l’avez pas encore fait ce tour. Dans ce cas, vous pouvez accomplir leurs ACTIONS dans l’ordre que vous souhaitez, et vous pouvez passer librement de l’un à l’autre. Cependant, si l’activation de l’une des deux figurines prend fin (par exemple à cause d’un jet de résolution risqué raté), celle de l’autre figurine continue normalement."}, {"n": "ACTION Sacrement des munitions", "t": "le Moine des munitions mendéliste peut déclarer l’ACTION Sacrement divin. Effectuez alors un jet de résolution risqué pour la figurine. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique, désignez 1 figurine amie à 1” ou moins du Moine des munitions mendéliste et dans sa ligne de vue, puis choisissez un Sacrement des munitions ci-dessous. Il s’applique à la figurine désignée jusqu’à la fin de sa prochaine activation."}, {"n": "Sacrement de la balle de la voie guidée", "t": "ajoutez +1 DÉ au jet de résolution pour les attaques de tir effectuées par la figurine."}, {"n": "Sacrement de la cartouche de sa Colère", "t": "ajoutez les mots-clés EXPLOSION 2” et SHRAPNEL aux armes de tir qu’utilise la figurine et qui sont dépourvues des mots-clés EXPLOSION et LANCE-FLAMMES."}, {"n": "Sacrement de l’écho de sa Parole", "t": "ajoutez +1 DÉ BLESSURE au jet de résolution pour les attaques de tir effectuées par la figurine."}], "kw": "A"}, "mer|chasseurchars": {"fl": "Un Communiant chasseur de chars est un Fidèle que peuvent recruter les bandes de la Nouvelle-Antioche et de Pèlerins des tranchées en tant que Mercenaire. Les Communiants résultent d’un rituel de communion chimique expérimental, durant lequel les moines mendélistes lient le sang et la chair récoltés sur un Méta-Christ au génome du récipiendaire. Seuls les individus les plus dévots et les plus pieux de l’Église reçoivent l’honneur de la communion. Celles et ceux qui endurent le rituel transcendent leur biologie mortelle et se voient dotés d’une taille et d’une résilience immense, ce qui en fait de redoutables atouts sur le champ de bataille. Leur force améliorée par des moyens divins leur permet de manier des fusils antimatériel imposants comme s’il s’agissait d’armes à feu réglementaires. Néanmoins, le procédé est encore loin de la perfection et connaît une forte probabilité d’effets secondaires imprévisibles. Certains sujets malchanceux perdent la parole, d’autres leurs fonctions cérébrales avancées, car ils sont distraits par le chœur céleste qu’eux seuls peuvent entendre, et ils ne peuvent plus agir sans des ordres précis de la part de leur officier. L’Église, qui a sans cesse besoin de fonds pour soutenir ses opérations militaires, octroie souvent les Communiants au plus offrant. La demande pour leurs services ne faiblit jamais, car ils possèdent la capacité de détruire les véhicules de combat ennemis, les troupes lourdement blindées et les places fortes, tout ça d’un seul tir.", "eq": "Un Communiant chasseur de chars possède toujours un fusil antimatériel et un casque de combat.", "cap": [{"n": "Poings de fer", "t": "la chair d’un Communiant chasseur de chars est aussi dure que le fer, ce qui fait de ses poings des armes meurtrières en soi. Il peut effectuer une attaque au corps à corps avec le mot-clé BALAYAGE 2 même s’il ne possède aucune arme de corps à corps (le modificateur d’arme secondaire s’applique à la seconde attaque)."}], "kw": "FORT, RÉGÉNÉRATION 1, ROBUSTE"}, "mer|goetique": {"fl": "Un Sorcier goétique est un Déchu que peuvent recruter les bandes des Légions Hérétiques et de la Cour du Serpent à Sept Têtes en tant que Mercenaire. Les sorciers goétiques sont des créations cauchemardesques forgées dans les usines de la mort du troisième cercle de l’Enfer. Des prêtres, des prophètes, des vicaires, des recteurs et des moines capturés souffrent mille tortures dans des machines démoniaques qui brûlent leur chair au feu de l’Enfer, avant d’insérer leur squelette toujours vivant dans des armures infernales et de le marquer de runes goétiques. Le processus s’avère si douloureux que les victimes, poussées par le désespoir, acceptent de leur plein gré des pactes démoniaques afin de peut-être mettre un terme à cette souffrance insoutenable. Ainsi naît un nouveau sorcier goétique, qui devient un prédateur impitoyable, motivé à traquer les mortels mêmes qu’il avait jadis juré de protéger. Le simple regard d’un sorcier entraîne une nécrose. En combat rapproché, il piège ses ennemis dans une étreinte implacable. Il puise alors dans la puissance de la Goétie pour ouvrir un portail vers un lieu isolé, où il peut savourer la lente destruction de sa victime, qu’il met petit à petit en morceaux. Il se délecte du dépeçage grotesque de sa proie encore en vie, dont il transforme les restes en répugnants parchemins pour de noirs grimoires et des textes religieux impies. Certains sorciers portent même le visage de leurs victimes afin d’alimenter leurs sorts d’illusion et d’ainsi confondre leurs ennemis. La rareté des victimes nécessaires pour créer les sorciers goétiques implique qu’on les réserve aux commandants hérétiques les plus réputés, ceux qui en ont le plus besoin et détiennent les relations les plus influentes dans la toile difforme de la politique infernale. Mammon, le puissant diable de l’Avarice, offre son bataillon personnel de sorciers au plus offrant.", "eq": "Un Sorcier goétique possède toujours une armure renforcée.", "cap": [{"n": "Étreinte barbelée", "t": "une figurine ennemie à 1” ou moins du Sorcier goétique ne peut pas effectuer l’ACTION de Repli."}, {"n": "Mains griffues de fer", "t": "le Sorcier goétique peut effectuer des attaques au corps à corps avec le mot-clé BALAYA GE 2 et CRITIQUE même s’il ne dispose d’aucune arme de corps à corps. Le modificateur d’arme secondaire s’applique à la seconde attaque."}, {"n": "ACTION Regard goétique", "t": "le Sorcier goétique peut déclarer l’ACTION Regard goétique. Effectuez alors un jet de résolution pour la figurine. En cas d’échec, rien ne se passe. En cas de réussite, placez 1 M ARQUEUR SANG à côté d’une figurine à 24” ou moins du Sorcier goétique et dans sa ligne de vue, ou 2 MAR QUEURS SANG en cas de résussite critique."}, {"n": "ACTION Portail goétique", "t": "le Sorcier goétique peut déclarer l’ACTION Portail goétique. Dans ce cas, effectuez un jet de résolution risqué en y ajoutant +1 D É. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique, vous pouvez redéployer le Sorcier goétique à 6” ou moins de son emplacement d’origine (en mesurant du centre de son socle jusqu’au centre de son socle). Si vous ne le pouvez pas, il doit rester sur place. Notez que le Sorcier goétique peut se redéployer même s’il se trouve À terre ou à 1” ou moins d’une figurine ennemie (qui ne peut pas effectuer d’attaque au corps à corps avant le redéploiement du Sorcier goétique) et qu’il peut se déployer à 1” ou moins d’une figurine ennemie. En outre, en cas de réussite ou de réussite critique au jet, si le Sorcier goétique se trouve à 1” ou moins d’au moins une figurine ennemie montée sur un socle de 32 mm ou moins, il peut emporter une figurine ennemie avec lui. Dans ce cas, vous devez d’abord redéployer le Sorcier goétique, puis la figurine ennemie à 1” ou moins de lui ; si vous ne pouvez pas la placer ainsi, elle reste à son emplacement d’origine."}], "kw": "ARTIFICIEL, DÉ"}, "mer|observateur": {"fl": "Un Observateur est un Fidèle que peuvent recruter les bandes de la Nouvelle-Antioche et des Pèlerins des tranchées en tant que Mercenaire. Les moines-guerriers de cet ordre vivent dans la solitude absolue pour affûter leur esprit et leur corps, afin de devenir des armes vivantes dans la Main de Dieu. Quand un soldat les rejoint, il ne quitte plus que rarement le temple de la Parole. La seule exception survient quand on le convoque sur le champ de bataille, où ses capacités uniques peuvent donner un tour décisif aux événements en faveur des Fidèles. La moindre perturbation dans les prières ou l’entraînement de ces moines peut rompre leur lien avec le Seigneur de toute la Création. Ainsi, les Observateurs passent leurs jours et leurs nuits dans des cellules isolées et cloîtrées, sauf quand ils affinent leurs disciplines mentales et martiales rigoureuses.", "eq": "Un Observateur possède toujours une armure standard, un casque de combat, un masque à gaz, une trousse de soins et une arme d’hast.", "cap": [{"n": "ACTION Voix de Dieu", "t": "l’Observateur peut déclarer l’ACTION Voix de Dieu. Effectuez alors un jet de résolution risqué pour la figurine. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique, désignez 1 figurine (amie ou ennemie), n’importe où sur le champ de bataille, qui n’a pas encore été activée lors de ce tour. L’activation de l’Observateur prend fin et la figurine désignée est immédiatement activée. Œil de Dieu : vous pouvez relancer les échecs aux jets de résolution et de jets de résolution risqués d’un Observateur. Dans ce cas, si le résultat de la relance contient au moins un 1, le jet reste un échec, l’Observateur se retrouve À terre , et son activation prend fin."}, {"n": "Fugue temporelle", "t": "ajoutez −1 D É au jet de résolution pour les attaques (de tir comme de corps à corps) qui prennent pour cible l’Observateur."}, {"n": "Vitesse foudroyante", "t": "l’arme d’hast de l’Observateur gagne le mot-clé BALAYAG E 2 . Mots -clés Aucun 174 ==="}], "kw": ""}, "mer|gardien": {"fl": "Un Gardien des Saintes Écritures est un Mercenaire que peut recruter n’importe quelle bande, dont il partage alors l’alignement. Les origines des Gardiens des Saintes Écritures restent voilées de mystère, même si des rumeurs suggèrent qu’ils doivent leur création aux grands maîtres de la Kabbale. Les témoignages de leur existence commencèrent à circuler dès les premiers jours de la Grande Guerre, quand la destruction de Jérusalem mit au jour des tombes et des lieux de repos sacrés. Celles et ceux qu’on avait jadis enterrés en paix erraient à présent sur une terre mécontente, et ils récitaient sans fin les textes sacrés qu’on leur avait confiés dans la mort. En de rares occasions, des expéditions ont rencontré une telle créature dans le No Man’s Land : en plaçant le texte sacré de sa foi dans ses mains, elles ont transformé le Gardien des Saintes Écritures en puissant allié, soumis à la volonté de quiconque s’aligne avec le rouleau ou le tome sacré (ou impie) qu’il tient. Capable de parler et de lire la Seule Langue Véritable, le Gardien des Saintes Écritures peut déchaîner les puissances qu’il convoque contre les cibles que lui désigne son maître. Il poursuit son objectif avec la détermination d’un automate, dénué de raisonnement et d’empathie. Les mots que prononce le Gardien se retrouvent imprégnés par la puissance primordiale de la Création, et ils peuvent tout défaire sur leur chemin. Plus le Gardien se concentre sur sa cible, plus le pouvoir qu’il canalise s’amplifie.", "eq": "Un Gardien des Saintes Écritures possède toujours une armure renforcée et un casque de combat. De plus, il doit avoir soit deux armes de corps à corps à 1 main, soit une arme de corps à corps à 2 mains. Vous devez acheter ces armes de corps à corps dans les tables d’armurerie de votre faction, à leur prix habituel, et vous devez vous conformer à leurs restrictions éventuelles (comme Réservé aux ÉLITES ou Limite : 1). Les armes choisies ne peuvent être ni retirées ni perdues au fil de la campagne, quelle qu’en soit la raison.", "cap": [{"n": "ACTION Texte sacré vengeur", "t": "le Gardien des Saintes Écritures lit le texte sacré (ou impie) qu’il transporte. Il peut déclarer l’ACTION Texte sacré vengeur. Désignez alors 1 figurine ennemie à 18” ou moins de lui et dans sa ligne de vue. Effectuez ensuite un jet de résolution, en y ajoutant +2 D ÉS si la cible se trouve à 9” ou moins de lui, ou +1 D É dans le cas contraire. En cas d’échec, rien ne se passe. En cas de réussite, effectuez un jet de blessure pour la cible, avec +1 MO DIFICATEUR BLESSURE par MARQUEUR SANG présent (en plus de tout bénéfice que vous recevez si vous les dépensez ensuite pour affecter le jet de blessure). En cas de réussite critique, effectuez un jet de blessure pour la cible, avec +1 D É BLESSURE et +1 MO DIFICATEUR BLESSURE par MARQUEUR SANG à côté d’elle."}, {"n": "Lent", "t": "la caractéristique de Mouvement du Gardien des Saintes Écritures est égale 3” quand il effectue l’ACTION de Course."}], "kw": ""}, "mer|mamelouk": {"fl": "Un Mamelouk Faris est un Fidèle que peuvent recruter les bandes de la Nouvelle-Antioche et du Sultanat de Fer en tant que Mercenaire. Les Mamelouks sont les échos d’un âge disparu, ultimes vestiges de l’élite guerrière qui régnait jadis sur un grand empire d’Afrique du Nord. Ils subirent des pertes importantes durant les premiers temps de la Grande Guerre, quand les légions du démon Zalambuer émergèrent de la Porte de l’Enfer. Les Fatimides menèrent les forces des Mamelouks dans une campagne désespérée pour récupérer le Levant, mais aucun récit n’évoque leur destin : ils ne revinrent pas victorieux ; au lieu de ça, les esclaves du Jahannam balayèrent le Sinaï comme un vent maléfique, faisant table rase d’Alexandrie et du Caire. Les Mamelouks survivants combattirent avec ardeur pour protéger leurs foyers, en vain. Trop fiers pour abandonner leur terre ancestrale aux ténèbres, certains d’entre eux refusèrent de répondre à l’appel pour migrer derrière le Mur de Fer. Ils se dispersèrent plutôt dans toutes les terres sur lesquelles ils régnaient jadis, déterminés à poursuivre le combat. Ils mènent une guerre secrète qui fait rage depuis. À ce jour, les chevaliers mamelouks jouent à un jeu mortel d’ombre et d’acier. Ils frappent lors d’embuscades et de raids soudains le long du front égyptien, afin de harceler les légions de Mammon, et ils gagnent leur vie en tant que mercenaires. Ils mènent une guerre sans fin contre les Hérétiques et composent des poèmes de lamentations en mémoire de leurs terres perdues et dévastées. Des générations de guerre ininterrompue ont endurci les Mamelouks, devenus des guerriers hors pair : les parents transmettent à leurs enfants les anciens secrets de la furūsiyya, un code de cavalerie, de talent martial et de bravoure. Trop peu nombreux pour mener une guerre ouverte, les Mamelouks préfèrent se battre aux côtés des Peuples du Livre : ils gagnent leur vie en offrant leur sabre au plus offrant, pourvu que ce chef promette de combattre les forces de Shaytān. Ils respectent par-dessus tout la noblesse d’âme et les exploits guerriers, et ils forment souvent des liens en partageant leur voie du sabre avec un allié qu’ils estiment. Il ne reste qu’une poignée des légendaires chevaux de guerre lourds automatisés des Mamelouks, qui les risquent rarement au combat. La plupart sont réservés à la défense des dernières demeures cachées de ce peuple, dans les profondeurs des vastes déserts au-delà du delta du Nil. Quelquesunes de ces montures inépuisables transportent les guerriers mamelouks jusqu’à des positions avancées. De là, ils peuvent perturber les plans de l’ennemi et lancer des attaques surprises sur des unités hostiles exposées.", "eq": "Un Mamelouk Faris possède toujours une armure renforcée, un casque de combat et un djézaïl avec des munitions alchimiques, tirés de l’armurerie du Sultanat de Fer ( ▶ voir page 179). De plus, le Mamelouk Faris doit recevoir, au choix, une épée à deux mains, une arme d’hast et un bouclier de tranchée, ou un pistolet et une épée/hache. Choississez son équipement lors du recrutement du Mamelouk Faris, vous pourrez le modifier par la suite lors de la phade d’Intendance. Le Mamelouk Faris a une caractéristique d’armure de −2 ou de −3 s’il possède un bouclier de tranchée.", "cap": [{"n": "Destrier automatisé", "t": "si le scénario joué vous autorise à utiliser les règles d’INFILTRATEUR, après le déploiement de tous les INFILTRATEURS, vous pouvez déployer le Mamelouk Faris à 1” ou moins de tout bord du champ de bataille, mais à plus de 8” de toute figurine ennemie."}, {"n": "Exploit martial", "t": "les Mamelouks sont des disciples de la furūsiyya, la discipline chevaleresque transmise à travers les générations. Ils la pratiquent sans cesse et rencontrent donc peu d’égaux. L’épée à deux mains du Mamelouk perd le mot-clé LOURD, et son djézaïl gagne les mots-clés ASSAUT et la restriciton COMBO BOUCLIER ."}, {"n": "Frère juré", "t": "quand vous recrutez un Mamelouk Faris dans votre bande, avant de l’ajouter à la fiche, vous pouvez annoncer qu’il forme une ÉQUIPE-FEU avec une autre figurine de votre bande dotée du mot-clé ÉLITE. Les deux figurines reçoivent le mot-clé ÉQUIPE-FEU. Notez que cette ÉQUIPE- FEU s’ajoute au maximum d’ÉQUIPES-FEU que peut compter votre bande et que, si le Mamelouk Faris forme une ÉQUIPE-FEU avec une figurine d’une bande de la Nouvelle-Antioche, seule cette dernière peut utiliser la règle spéciale Tir concentré ."}], "kw": "ÉQUIPE-FEU"}};

Matériel", "p": "–", "k": "–", "e": "Récompenses vertueuses: placez 1 MARQUEUR BÉNÉDICTION à côté d’une figurine équipée d’un Tabot chaque fois qu’une ACTION effectuée par une figurine amie entraîne le retrait d’au moins 1 MARQUEUR SANG ou MARQUEUR INFECTION d’au moins 1 figurine amie.", "f": "na"}], "Bouclier à la sainte icône": [{"t": "Bouclier", "p": "–", "k": "−1 MODIFICATEUR BLESSURE, RÉSISTANT", "e": "", "f": "na"}], "Canardière": [{"t": "2 mains", "p": "18”", "k": "+1 DÉ, +1 DÉ BLESSURE, CHEVROTINE, LOURD, SHRAPNEL", "e": "Surcharge: avant de déclarer une attaque de tir avec une figurine dotée d’une canardière, vous pouvez annoncer qu’elle surcharge l’arme. Pour cela, la figurine doit soit avoir le motclé FORT, soit se trouver en contact avec une figurine amie. Une attaque de tir surchargée gagne les mots-clés EXPLOSION 3” et RECHARGEMENT. Après l’attaque, placez 1 MARQUEUR SANG à côté de la figurine du tireur, dont l’activation prend fin.", "f": "na"}], "Capirote de fer": [{"t": "Matériel", "p": "–", "k": "IGNORE SHRAPNEL, IMMUNITÉ PEUR", "e": "", "f": "na"}], "Croix de guerre": [{"t": "Grenade", "p": "8”", "k": "ASSAUT, IGNORE PORTÉE LONGUE", "e": "", "f": "na"}], "Armure à la sainte icône": [{"t": "Armure", "p": "–", "k": "−1 MODIFICATEUR BLESSURE, RÉSISTANT", "e": "", "f": "pe"}], "Agneau sacrificiel": [{"t": "Matériel", "p": "–", "k": "CONSOMMABLE", "e": "Égide carmin : quand vous déployez une figurine dotée d’un agneau sacrificiel, vous pouvez annoncer qu’elle le sacrifie et s’oint de son sang. Dans ce cas, ignorez le premier MARQUEUR SANG qui devrait être placé à côté d’elle.", "f": "pe"}], "Alaybozan": [{"t": "2 mains", "p": "12”", "k": "SHRAPNEL", "e": "", "f": "su"}], "Amulette du vent": [{"t": "Matériel", "p": "–", "k": "–", "e": "Bourrasques : une fois par partie, quand vous activez une figurine dotée d’une amulette du vent, vous pouvez déclarer qu’elle l’utilise avant d’effectuer la moindre ACTION. Elle ajoute alors 3” à sa caractéristique de Mouvement pour le reste de cette activation.", "f": "su"}], "Armure d’alchimiste": [{"t": "Armure", "p": "–", "k": "−2 MODIFICATEURS BLESSURE, IMMUNITÉ FEU, IMMUNITÉ GAZ", "e": "Protection contre les dégâts : ajoutez −1 DÉ BLESSURE au jet de blessure pour les attaques portées avec des armes dotées des mots-clés FEU ou GAZ et qui prennent pour cible une figurine avec une armure d’alchimiste, même si l’attaque bénéficie du mot-clé IGNORE ARMURE.", "f": "su"}], "Bombarde M.U.R.A.D.": [{"t": "1 main", "p": "36”", "k": "DÉVIATION, EXPLO SION 3 ” , LO URD", "e": "Écho de l’explosion : s i le jet de résolution d’une attaque de tir effectuée avec une bombarde M.U.R.A.D. est un succès ou un succès critique, ou si l’attaque est un échec et que le tir dévie sur une figurine ennemie, appliquez le mot-clé MORTEL au jet de blessure de la cible . Toutes les autres figurines prises dans le rayon d’explosion de la bombarde sont jetées À terre , mais ne subissent aucune blessure (notez qu’elles recoivent 1 MAR QUEUR SANG, comme tout résultat À terre ).", "f": "su"}], "Canon à flammes": [{"t": "1 main", "p": "12”", "k": "FEU, IGNORE ARMURE, LOURD", "e": "Feu grégeois : lors d’une attaque de tir avec un canon à flammes, ne faites pas de jet de résolution. À la place, mesurez une ligne droite de 1 mm de large et de 12” ou moins de long, à partir de la figurine qui attaque jusqu’à un emplacement au sol du champ de bataille ou un socle de figurine. La ligne s’arrête si elle atteint un élément de terrain plus grand que la figurine qui attaque. Effectuez un jet de blessure pour chaque figurine (amie comme ennemie) que touche la ligne, en dehors de celle du tireur.", "f": "su"}], "Cape d’Alamut": [{"t": "Matériel", "p": "–", "k": "–", "e": "Camouflage : le modificateur d’attaque de tir d’une cible à couvert augmente à −2 DÉS si elle porte une cape d’Alamut.", "f": "su"}], "Dague d’Assassin": [{"t": "1 main", "p": "CàC", "k": "+1 MODIFICATEUR BLESSURE, CRITIQUE", "e": "Taillade : si une dague d’Assassin cause au moins 1 MARQ UEUR SANG à la cible, l’Assassin peut effectuer une ACTION de Course pour se replier durant la même activation. En outre, si l’Assassin se replie (en courant ou grâce à une ACTION de Repli ordinaire) durant la même activation, les figurines ennemies à 1” ou moins de lui ne peuvent pas effectuer d’attaque au corps à corps avant qu’il ne se déplace, comme elles le pourraient en temps normal.", "f": "su"}], "Djézaïl": [{"t": "2 mains", "p": "18”", "k": "–", "e": "", "f": "su"}], "Djézaïl de siège": [{"t": "2 mains", "p": "30”", "k": "+1 DÉ BLESSURE, LOURD", "e": "", "f": "su"}], "Hallebarde de tir": [{"t": "2 mains", "p": "CàC/24”", "k": "ASSAUT, BLOCAGE, COMBO BOUCLIER, ENCOMBRANT", "e": "", "f": "su"}], "Munitions alchimiques": [{"t": "Matériel", "p": "–", "k": "M UNITIONS (+1 DÉ)", "e": "Chemin tracé : vous ne pouvez utiliser des munitions alchimiques qu’avec un alaybozan (même s’il a le mot-clé SHRAPNEL), une hallebarde de tir, un djézaïl ou un djézaïl de siège. En campagne , vous ne pouvez pas réallouer les munitins alchimiques à une autre figurine.", "f": "su"}], "Oiseau anqā du Takwin": [{"t": "Matériel", "p": "–", "k": "–", "e": "Confusion : les jets de résolution des attaques au corps à corps qui prennent pour cible une figurine équipée d’un oiseau anqā du Takwin deviennent des jets de résolution risqués (aucun effet s’il s’agit déjà de jets de résolution risqués ). De plus, avant qu’une figurine ennemie à 1” ou moins d’une figurine avec un oiseau anqā du Takwin ne se replie, le joueur qui la contrôle doit effectuer un jet de résolution risqué pour elle. En cas d’échec, elle ne peut pas se replier et son activation prend fin. En cas de réussite ou de réussite critique, la figurine ennemie peut se replier normalement.", "f": "su"}], "Pelle de marid": [{"t": "Matériel", "p": "–", "k": "LOURD", "e": "Pelle de marid : si un Taureau d’airain équipé d’une pelle de marid commence la partie en terrain dégagé, il bénéficie du mot-clé COUVERT jusqu’à ce qu’il quitte sa position. De plus, il peut se servir de ce matériel comme d’un gourdin de tranchée ( ▶ voir page 137).", "f": "su"}], "Zulfiqar titanesque": [{"t": "1 main", "p": "CàC", "k": "+2 MODI FICATEURS BLESSURES, CRITIQUE, LOURD", "e": "", "f": "su"}], "Arc d’Alamut": [{"t": "2 mains", "p": "40”", "k": "ASSAUT, CRITIQUE, IGNORE ARMURE", "e": "Sillage temporel : si une attaque de tir effectuée avec cette arme cause le placement d’au moins 1 MAR QUEUR SANG à côté de la cible, vous pouvez immédiatement redéployer la figurine du tireur à 1” ou moins de sa cible, quelle que soit la distance qui les sépare et en dépit des éventuels obstacles. Notez que si l’attaque met la cible Hors de combat , aucun MARQUEUR SANG n’est placé et cette capacité ne peut donc pas servir.", "f": "su"}], "Feuille d’Hashashin": [{"t": "Matériel", "p": "–", "k": "CONSOMMABLE", "e": "Force accrue : quand vous déployez pour la première fois une figurine dotée d’une feuille d’Hashashin, vous pouvez annoncer qu’elle la consomme. La figurine bénéficie alors du mot-clé FORT pour le reste de la partie.", "f": "su"}], "Khanjar d’or": [{"t": "1 main", "p": "CàC", "k": "+1 MODIFICATEUR BLESSURE, BALAYAGE 2", "e": "", "f": "su"}], "Bouclier ignifugé": [{"t": "Bouclier", "p": "–", "k": "−1 MODIFICATEUR BLESSURE, IGNORE FEU", "e": "Ininflammable : ajoutez −1 DÉ B LESSURE aux jets de blessure des attaques portées avec des armes avec le mot-clé FEU et qui ciblent le porteur de ce bouclier et ce, même si l’arme a le mot-clé IGNORE ARMURE.", "f": "le"}], "Élixir d’Al-Khidr": [{"t": "Matériel", "p": "–", "k": "CONSOMMABLE", "e": "Fontaine de vie : quand vous déployez pour la première fois une figurine dotée de l’élixir d’Al-Khidr, vous pouvez annoncer qu’elle le consomme. Elle bénéficie alors du mot-clé ROBUSTE pour le reste de la partie. Les figurines avec le mot-clé ARTIFICIEL ne peuvent pas utiliser l’élixir d’Al-Khidr.", "f": "le"}], "Bannière du vent du Désert": [{"t": "Matériel", "p": "–", "k": "CHEF, TENU", "e": "Tempête de sable : les figurines ennemies qui débutent leur activation à 24” ou moins du porteur de la bannière du vent du Désert soustraient 1 à leur caractéristique de Mouvement jusqu’à la fin de leur activation. Cette règle ne s’applique pas si le porteur est À terre .", "f": "le"}], "Charges explosives": [{"t": "Matériel", "p": "–", "k": "CONSOMMABLE", "e": "Explosifs cachés : au début de la partie, après le déploiement, vous pouvez annoncer qu’une figurine dotée de charges explosives les installe sur le champ de bataille. Sur un bout de papier, notez alors en secret leur emplacement sur le champ de bataille. Les charges explosives doivent être placées sur un unique élément de terrain qui mesure au maximum 8” sur 8”, ne se trouve pas dans la zone de déploiement ennemie (même partiellement) ou à 1” ou moins d’une figurine et ne constitue pas un objectif de scénario valant le moindre point de victoire. Déclencher les explosifs : quand vous activez une figurine amie, mais avant de déclarer la moindre ACTION, vous pouvez annoncer qu’elle va déclencher des explosifs cachés installés en début de partie. Montrez alors votre note à votre adversaire en lui dévoilant l’emplacement des explosifs cachés, puis effectuez un jet de blessure avec le mot-clé SHRAPNEL pour chaque figurine (amie ou ennemie) sur l’élément de terrain ou en contact avec lui. L’élément de terrain est ensuite retiré du jeu. Les figurines qui se trouvaient dessus chutent directe", "f": "le"}], "Garde anqā": [{"t": "Matériel", "p": "–", "k": "DÉPLOYABLE, LOURD", "e": "Un garde anqā est représenté par un élément de terrain de ½” de haut sur un socle de 40 mm, avec le mot-clé TERRAIN INFRANCHISSABLE. Déploiement anticipé : au début de chaque partie, après le déploiement, vous pouvez annoncer qu’une figurine dotée d’un garde anqā va le déployer. Déployez alors le garde anqā, dont le socle doit se trouver entièrement dans votre zone de déploiement. Une fois déployée, la figurine équipée du garde anqā compte comme n’en étant plus équipée pour le reste de la partie. ACTION Déploiement de combat : une figurine équipée d’un garde anqā peut déclarer l’ACTION Déploiement de combat. Effectuer alors un jet de résolution risqué avec +2 D ÉS. En cas d’échec, rien ne se passe et son activation prend fin. En cas de réussite ou de réussite critique, vous pouvez déployer le garde anqā à 1” ou moins de la figurine. Une fois déployée, la figurine équipée du garde anqā compte comme n’en étant plus équipée pour le reste de la partie.", "f": "le"}], "Grand canon du Sultanat": [{"t": "1 main", "p": "48”", "k": "+2 DÉS BLESSURE, DÉPLOYABLE, IGNORE ARMURE, LOURD", "e": "Quand vous ajoutez un Grand canon du Sultanat à une bande de Défenseurs du Mur de fer, vous devez soit l’équiper sur un Taureau d’airain déjà présent dans votre bande, soit l’ajouter à l’armurerie de votre bande en tant que batterie d’artillerie. Une batterie d’artillerie est représentée par un élément de terrain d’au moins ½” de haut, sur un socle de 50 mm, avec le mot-clé TERRAIN INFRANCHISSABLE . Déploiement de batterie d’artillerie : un Grand canon inclus dans l’armurerie d’une fiche de bande sous la forme d’une batterie d’artillerie doit être déployé comme toute unité de votre bande. Grand canon de Taureau d’airain : un Grand canon transporté par un Taureau d’airain est considéré comme une arme de tir à 1 main qui utilise le profil ci-dessus pour toute règle. Si le Taureau d’airain le perd ou est retiré de la bande pour quelque raison que ce soit, le Grand canon est perdu (vous ne pouvez pas le déployer en tant que batterie d’artillerie).", "f": "le"}], "Kalkan du Mur de Fer": [{"t": "Bouclier", "p": "–", "k": "COUVERT", "e": "Othismos : quand un Taureau d’airain équipé d’un kalkan du Mur de Fer effectue une ACTION de Déplacement (pas de Course ou de Charge), s’il se trouve au contact d’une figurine ennemie montée sur un socle de 40 mm ou moins, il peut utiliser ce bouclier pour la repousser quand il se déplace. Le Taureau d’airain doit avancer en ligne droite en direction de la figurine ennemie. Celle-ci est repoussée dans la même direction, sur toute la longueur du déplacement. Ce dernier peut donc servir à pousser une figurine du haut d’un élément de terrain afin qu’elle chute ( ▶ voir les règles de chute, page 122). Le Taureau d’airain et la figurine ennemie cessent de se déplacer si le déplacement amène la figurine ennemie au contact d’une autre figurine ou au contact d’un élément de terrain de plus de ½” de haut. Dans ce dernier cas, vous devez en outre effectuer un jet de blessure pour la figurine ennemie.", "f": "le"}], "Bâton blasphématoire": [{"t": "1 main", "p": "CàC", "k": "CRITIQUE, FEU", "e": "Puissance maléfique : ajoutez +1 DÉ aux jets de résolution et aux jets de résolution risqués , pour une figurine équipée d’un bâton blasphématoire, à l’exception des jets pour l’ AC - TION de Course ou pour les jets d’attaque (de tir ou au corps à corps).", "f": "le"}], "Griffes du Tartare": [{"t": "2 mains", "p": "CàC", "k": "BALAYAGE 2, CRITIQUE, ENCOMBRANT", "e": "Assaut implacable : si une attaque au corps à corps portée par les Griffes du Tartare met la cible À terre ou Hors de combat , vous pouvez immédiatement déplacer la figurine qui en est équipée de 3” ou moins. Si elle parvient alors à 1” ou moins d’une figurine ennemie, elle peut effectuer une nouvelle ACTION de Combat. La figurine ne peut pas se déplacer une nouvelle fois si cette seconde ACTION de Combat met encore la cible À terre ou Hors de combat .", "f": "le"}], "Lame infernale": [{"t": "2 mains", "p": "CàC", "k": "+1 DÉ BLESSURE, FEU", "e": "", "f": "le"}, {"t": "2 mains", "p": "CàC", "k": "+1 DÉ BLESSURE, FEU", "e": "", "f": "mer"}], "Palanquin blindé": [{"t": "Armure", "p": "–", "k": "−3 MODIFICATEURS BLESSURE, FORT", "e": "Imposant : Une figurine équipée du Palanquin blindé doit être sur une socle de 50mm et ne peut recevoir de bouclier. De plus, son bonus de charge est de d3” au lieu de d6”. Inamovible : quand une figurine équipée de cette armure subit un résultat À terre sur la table de blessure, elle le considère comme un résultat Blessure légère à la place. La mort venue d’en haut : ajoutez 3” à la hauteur de la figurine sur un palanquin blindé quand vous déterminez si elle reçoit le modificateur de Position surélevée dans le cadre d’une attaque de tir.", "f": "gn"}], "Sarcophage miné": [{"t": "Armure", "p": "3”", "k": "−3 MODIFICATEURS BLESSURE, EXPLOSION", "e": "Bombe ambulante : une figurine équipée d’un sarcophage miné ne peut recevoir aucun autre équipement. Elle peut déclarer l’ACTION Déclenchement ( ▶ voir ci-dessous). En outre, quand une figurine ennemie termine un déplacement à 3” ou moins de cette figurine, vous pouvez interrompre son activation et déclencher le sarcophage miné sans déclarer d’ACTION Déclenchement. ACTION Déclenchement : une figurine équipée d’un sarcophage miné peut déclarer l’ACTION Déclenchement. Effectuez alors un jet de résolution risqué en y ajoutant +1 D É. En cas d’échec, rien ne se passe et son activation prend fin (mais vous pourrez réessayer à la prochaine activation de la figurine). En cas de réussite ou de réussite critique, le sarcophage miné explose, comme décrit ci-dessous. Détonation : quand un sarcophage miné explose, toutes les figurines (amies comme ennemies) à 3” ou moins du porteur et dans sa ligne de vue sont touchées par une attaque de tir avec le mot-clé SHRAPNEL. Ajoutez +1 D É BLESSURE au jet de blessure pour les figurines situées à 1” ou moins du porteur du sarcophage miné. La figurine équ", "f": "gn"}], "Marteau des pièces": [{"t": "2 mains", "p": "CàC", "k": "+1 DÉ BLESSURE, LOURD", "e": "Rune de Mammon : si le jet de blessure pour une attaque portée avec le marteau des pièces cause au moins 1 M ARQUEUR SANG à la cible, placez 1 MARQU EUR BÉNÉDICTION à côté de la figurine de l’attaquant.", "f": "gn"}], "Armure ternie": [{"t": "Armure", "p": "–", "k": "−2 MODIFICATEURS BLESSURE, IMMUNITÉ GAZ", "e": "Cible de la colère : une figurine ennemie qui charge doit prendre pour cible le porteur d’une armure ternie s’il se trouve dans sa ligne de vue, n’est pas déjà à 1” ou moins d’une figurine ennemie et peut être atteint sans qu’elle ait besoin d’escalader, de sauter, de faire une charge plongeante ou de traverser du terrain dangereux.", "f": "gn"}], "Autel du Veau d’or": [{"t": "Matériel", "p": "–", "k": "DÉPLOYABLE, LOURD", "e": "L’autel du Veau d’or est représenté par un élément de terrain de ½” de haut, sur un socle de 25 mm avec le mot-clé TERRAIN INFRANCHISSABLE . I llusions : les figurines ennemies considèrent tous les types de terrain à 3” ou moins de l’autel du Veau d’or comme du terrain difficile (s’il ne l’est pas déjà), même si elles volent. ACTION Déposer l’autel : une figurine équipée d’un autel du Veau d’or peut déclarer l’ ACTION Déposer l’autel. Dans ce cas, déployez l’autel à 1” ou moins du porteur. Une fois déployée, la figurine équipée de l’autel du Veau d’or compte comme n’en étant plus équipée pour le reste de la partie. De plus, l’autel du Veau d’or est perdu à la fin de la partie et doit être retiré de votre fiche de bande . Bombes de gaz | Compris dans le coût de la Sorcière artilleuse Les Sorcières artilleuses des Chevaliers de l’Avarice remplacent leurs bombes infernales par des bombes de gaz tout aussi meurtrières. Elles s’assurent ainsi de ne pas endommager du butin précieux.", "f": "gn"}], "Étendard de Mammon": [{"t": "Matériel", "p": "–", "k": "TENU, CHEF", "e": "Agenouillez-vous devant moi ! : une figurine ennemie À terre à 1” ou moins du porte-étendard de Mammon ne peut pas se relever. De plus, le joueur adverse doit effectuer un jet de résolution pour chacune de ses figurines qui termine une charge à 1” ou moins du porte-étendard de Mammon. En cas d’échec, la figurine ennemie concernée tombe À terre . En cas de réussite ou de réussite critique, elle reste debout.", "f": "gn"}], "Arme à chevrotine putride": [{"t": "2 mains", "p": "12”", "k": "+1 DÉ, ASSAUT, CHEVROTINE, MARQUEUR INFECTION", "e": "", "f": "gn"}], "Bouclier du Graal noir": [{"t": "Bouclier", "p": "–", "k": "−1 MODIFICATEUR BLESSURE", "e": "Influence du Culte du Graal noir : une figurine équipée de ce bouclier et prise pour cible d’une attaque de tir en appelle à l’influence du Graal noir avant le jet de résolution pour cette attaque. Effectuez alors un jet de résolution : en cas d’échec, rien ne se passe et l’attaque se déroule normalement. En cas de réussite, ajoutez −2 DÉ S au jet de résolution pour l’attaque de tir ; en cas de réussite critique, l’attaque se solde automatiquement par un échec (n’effectuez pas le jet de résolution pour elle).", "f": "gn"}], "Canon à viscères": [{"t": "2 mains", "p": "24”", "k": "+2 DÉS, LOURD", "e": "Sacrifice personnel : si le canon à viscères touche sa cible, après la résolution du jet de blessure, vous pouvez placer jusqu’à 3 MA RQUEURS SANG à côté de la figurine du tireur (jusqu’à un maximum de 6 marqueurs). Placez ensuite autant de MARQUEURS INFECTION à côté de la cible.", "f": "gn"}], "Casque aux yeux à facettes": [{"t": "Matériel", "p": "–", "k": "IMMUNITÉ SHRAPNEL", "e": "Vision améliorée : ajoutez +1 D É au jet de résolution des attaques de tir effectuées par la figurine.", "f": "co"}], "Fusil infecté": [{"t": "2 mains", "p": "18", "k": "” PERFORANT", "e": "", "f": "co"}], "Dévot du Graal": [{"t": "Matériel", "p": "–", "k": "–", "e": "Dévots du Graal : jusqu’à 2 figurines peuvent avoir, chacune, jusqu’à 2 Dévots du Graal. Pour chaque Dévot du Graal accompagnant une figurine, ajoutez +1 MODIFCATEUR BLESSURE au jet de blessure pour les attaques au corps à corps qu’elle effectue. Vous pouvez représenter chaque Dévot du Graal par une figurine si vous le souhaitez. Placez-le à côté de la figurine qu’il suit, mais notez que les règles ne considèrent pas les Dévots du Graal comme des figurines en tant que telles, écartez-les donc s’ils se trouvent sur la route d’une véritable figurine. Dévotion jalouse : la Limite : 2 est le nombre de figurines de votre bande qui peuvent avoir des Dévots du Graal. Chacune peut être accompagnée de jusqu’à 2 Dévots du Graal. Le coût du deuxième Dévot d’une même figurine est payé en ☼ au lieu de 👑 . Les Dévots du Graal ne peuvent pas être transférés à une autre figurine, sauf si la première est retirée de votre fiche de bande.", "f": "co"}], "Grenades à parasites": [{"t": "Grenade", "p": "8”", "k": "ASSAUT, IGNORE COUVERT, IGNORE PORTÉE LONGUE", "e": "Hallucinations terrifiantes : si une grenade à parasites touche une cible, après la résolution du jet de blessure, vous pouvez déplacer cette figurine de 3”, en ligne droite, dans n’importe quelle direction. Vous pouvez l’amener à 1” ou moins d’un ennemi, opérer un repli, escalader une surface abrupte, sauter par-dessus un trou ou sauter en contrebas.", "f": "co"}], "Hache de Belzébuth": [{"t": "2 mains", "p": "CàC", "k": "+2 DÉS BLESSURE, LOURD, MARQUEUR INFECTION", "e": "", "f": "co"}], "Lame de la peste": [{"t": "1 main", "p": "CàC", "k": "MARQUEUR INFECTION", "e": "", "f": "co"}], "Vomisseur de corruption": [{"t": "2 mains", "p": "8”", "k": "GAZ, IGNORE ARMURE, LANCE-FLAMMES", "e": "", "f": "co"}], "Couronne brisée": [{"t": "Matériel", "p": "–", "k": "–", "e": "Foyer de désespoir : à chaque activation du porteur de la couronne brisée, avant de déclarer la moindre ACTION avec sa figurine, placez 1 MARQUE UR INFECTION à côté de chaque figurine ennemie à 1” ou moins de lui.", "f": "co"}], "Urne des Cendres amères": [{"t": "Matériel", "p": "–", "k": "–", "e": "Murmures sinistres : ajoutez −1 D É aux attaques de tir qui prennent pour cible le porteur de l’urne des Cendres amères ou une figurine qui se trouve à 3” ou moins de lui.", "f": "co"}], "Arquebuse": [{"t": "2 mains", "p": "18”", "k": "ENCOMBRANT", "e": "Coup de crosse : une figurine équipée d’une arquebuse peut s’en servir d’arme de corps à corps à 2 mains. Canon d’assaut du Serpent | 50 👑 | Limite : function parseItem(cat,n,c,k,r,o,extra){
  r=r||'';
  const it={n,c,k,r,cat,key:n,src:null,lim:0,o:o?String(o).split(','):[],ban:false,limEx:[]};
  const m=r.match(/Limite\s*:\s*(\d+)/); if(m) it.lim=+m[1];
  it.coiffe=/Coiffe/.test(r); it.combo=/Combo bouclier/i.test(r); it.tenon=/Tenon de baïonnette/.test(r);
  it.consom=/Consommable/.test(r); it.pm=/1\/figurine/.test(r);
  if(/sauf (les )?Fantassins/.test(r)) it.limEx=['fantassin'];
  if(typeof extra==='string') it.needItem=extra; else if(extra&&typeof extra==='object') Object.assign(it,extra);
  const parts=r.split(' · '); it.restr=parts[0]; it.stats=parts.slice(1).join(' · ');
  return it;
}
function statsFor(n,fid){
  const l=ITEMDB[n]||ITEMDB[ITEMALIAS[n]]; if(!l) return null;
  return l.find(x=>x.f===fid)||l.find(x=>x.f==='*')||l[0];
}
function handsOf(it){const t=it.st&&it.st.t; if(t==='1 main')return 1; if(t==='2 mains')return 2; return (it.cat==='Armes de tir'||it.cat==='Armes de corps à corps')?1:0;}
function handsCheck(defs){
  const msgs=[]; const rng=defs.filter(i=>i.cat==='Armes de tir'), mel=defs.filter(i=>i.cat==='Armes de corps à corps'), sh=defs.filter(i=>i.cat==='Boucliers'), gr=defs.filter(i=>i.cat==='Grenades');
  const hs=a=>a.reduce((x,i)=>x+handsOf(i),0);
  if(hs(rng)>2) msgs.push('armes de tir : une arme à 2 mains ou deux armes à 1 main au maximum');
  if(hs(mel)>2) msgs.push('armes de corps à corps : une arme à 2 mains ou deux armes à 1 main au maximum');
  if(new Set(gr.map(i=>i.n)).size>1) msgs.push('un seul type de grenade');
  if(sh.length){ const b=sh[0];
    [[rng,'tir'],[mel,'corps à corps']].forEach(([arr,nm])=>{
      if(arr.length>1) msgs.push('avec un bouclier : une seule arme de '+nm);
      arr.forEach(w=>{ if(handsOf(w)===2&&!(w.combo&&b.combo)) msgs.push('« '+w.n+' » (2 mains) est incompatible avec un bouclier'+(w.combo?' sans COMBO BOUCLIER (le bouclier n’a pas ce mot-clé)':' : il manque COMBO BOUCLIER')); });
    });
  }
  return [...new Set(msgs)];
}
function addBlock(rowDefs,it,noHands){
  if(['Armures','Boucliers','Matériel','Grenades'].includes(it.cat)&&rowDefs.some(d=>d.n===it.n)) return 'déjà équipé';
  if(it.cat==='Armures'&&rowDefs.some(d=>d.cat==='Armures')) return 'une seule armure par figurine';
  if(it.cat==='Boucliers'&&rowDefs.some(d=>d.cat==='Boucliers')) return 'un seul bouclier par figurine';
  if(it.coiffe&&rowDefs.some(d=>d.coiffe)) return 'une seule coiffe par figurine';
  if(it.cat==='Grenades'&&rowDefs.some(d=>d.cat==='Grenades'&&d.n!==it.n)) return 'un seul type de grenade';
  if(it.n==='Baïonnette'&&!rowDefs.some(d=>d.tenon)) return 'exige une arme de tir avec Tenon de baïonnette';
  if(it.needItem&&!rowDefs.some(d=>d.n===it.needItem)) return 'nécessite : '+it.needItem;
  if(it.needAny&&!rowDefs.some(d=>it.needAny.includes(d.n))) return 'nécessite : '+it.needAny.join(' ou ');
  if(it.glory&&it.n==='Muselière (☼)'&&false) return null;
  if(!noHands){ const before=handsCheck(rowDefs), after=handsCheck([...rowDefs,it]).filter(x=>!before.includes(x)); if(after.length) return after[0]; }
  return null;
}
function itemsOf(F){const out=[];F.arm.forEach(([cat,arr])=>arr.forEach(a=>out.push(parseItem(cat,...a))));return out;}

function buildCtx(L){
  const F=FACTIONS.find(f=>f.id===L.fid); const V=(F.variants||[]).find(v=>v.id===L.vid)||null;
  const cloneU=u=>({...u,opts:(u.opts||[]).map(o=>({...o})),bases:u.bases?u.bases.map(b=>({...b})):null});
  let units=F.units.map(cloneU);
  let items=itemsOf(F);
  if(V){
    (V.units||[]).forEach(u=>{const c=cloneU(u); if(c.leader) units.unshift(c); else units.push(c);});
    (V.ban||[]).forEach(id=>{const u=units.find(x=>x.id===id); if(u)u.banned=true;});
    Object.entries(V.unitMod||{}).forEach(([id,m])=>{const u=units.find(x=>x.id===id); if(u)Object.assign(u,m);});
    Object.entries(V.optAdd||{}).forEach(([id,arr])=>{const u=units.find(x=>x.id===id); if(u)arr.forEach(o=>{if(!u.opts.some(x=>x.id===o.id))u.opts.push({...o});});});
    if(V.optAddAll&&V.optAddAll.notElite) units.forEach(u=>{if(!u.elite&&!u.banned&&!u.noEquip) V.optAddAll.notElite.forEach(o=>{if(!u.opts.some(x=>x.id===o.id))u.opts.push({...o});});});
    Object.entries(V.optMod||{}).forEach(([uid,mm])=>{const u=units.find(x=>x.id===uid); if(u)Object.entries(mm).forEach(([oid,m])=>{const o=u.opts.find(x=>x.id===oid); if(o)Object.assign(o,m);});});
    (V.noOpt||[]).forEach(id=>units.forEach(u=>{u.opts=u.opts.filter(o=>o.id!==id);}));
    Object.entries(V.noBase||{}).forEach(([uid,flags])=>{const u=units.find(x=>x.id===uid); if(u&&u.bases)u.bases=u.bases.filter(b=>!flags.some(f=>b[f]));});
    Object.entries(V.itemMod||{}).forEach(([n,m])=>{const it=items.find(x=>x.n===n); if(it){const mm={...m}; if('o' in mm) mm.o=mm.o?String(mm.o).split(','):[]; Object.assign(it,mm);}});
    (V.banItems||[]).forEach(n=>{const it=items.find(x=>x.n===n); if(it)it.ban=true;});
    (V.items||[]).forEach(a=>items.push(parseItem(a[0],a[1],a[2],a[3],a[4],a[5],a[6])));
    (V.collect||[]).forEach(src=>{const SF=FACTIONS.find(f=>f.id===src); itemsOf(SF).forEach(it=>{items.push({...it,src,key:it.n+'|'+src,foreignLabel:SF.short,collect:src});});});
  }
  // armes étrangères liées à une option (rang Croix putréfiée / Regard envieux)
  if(F.id==='gn') ['na','le'].forEach(src=>{const SF=FACTIONS.find(f=>f.id===src); itemsOf(SF).filter(i=>WEAPON_CATS.includes(i.cat)).forEach(it=>items.push({...it,src,key:it.n+'|x'+src,foreignLabel:SF.short,needOpt:'r_croix'}));});
  if(F.id==='co') ['na','pe','su'].forEach(src=>{const SF=FACTIONS.find(f=>f.id===src); itemsOf(SF).forEach(it=>items.push({...it,src,key:it.n+'|x'+src,foreignLabel:SF.short,needOpt:'pw7'}));});
  // pouvoirs : filtrer selon le péché
  units.forEach(u=>{u.opts=u.opts.filter(o=>!o.pw||!o.sin||o.sin===L.sin);});
  // mercenaires
  let mercs=MERCS.filter(m=>m.who==='any'?m.align===undefined||true:m.who.includes(F.id)).filter(m=>m.who==='any'?true:true);
  mercs=mercs.filter(m=>{
    if(m.who==='any') return true;
    if(m.who.includes(F.id)) return true;
    return false;
  });
  if(V&&V.banMerc) mercs=mercs.filter(m=>!V.banMerc.includes(m.n));
  if(V&&V.noMerc) mercs=[];
  mercs=mercs.map(m=>({...m,opts:(m.opts||[]).map(o=>({...o})),merc:true,max:m.max||1}));
  if(V&&V.goeticMerc){const g=mercs.find(m=>m.id==='goetique'); if(g)g.max=V.goeticMerc.max;}
  if(L.mode==='campagne'&&typeof GLOIRE_F!=='undefined'&&GLOIRE_F[F.id]) GLOIRE_F[F.id].forEach(([n,c,restr,o,lim])=>{
    const d=GLOIRE_DEF[n]; if(!d||d.band) return;
    const it=parseItem(d.hc||'Objets de gloire',n,c,'g',(restr?restr+', ':'')+'Limite : '+lim,o||'');
    it.glory=true; if(d.need) it.needAny=d.need; if(d.coiffe) it.coiffe=true; items.push(it);
  });
  items.forEach(i=>{i.st=statsFor(i.n,i.src||F.id);});
  const byKey={}; items.forEach(i=>byKey[i.key]=i);
  const byName={}; items.forEach(i=>{if(!byName[i.n]&&!i.needOpt&&!i.collect)byName[i.n]=i;});
  return {F,V,units,items,mercs,byKey,byName,L};
}
function unitOf(ctx,m){return m.merc?ctx.mercs.find(u=>u.id===m.unit):ctx.units.find(u=>u.id===m.unit);}

function baseOf(u,m){return u.bases?(u.bases[m.base||0]||u.bases[0]):null;}
function hasOpt(m,id){return !!(m.opts&&m.opts[id]);}
function isElite(u,m,ctx){return !!u.elite;}

/* disponibilité d'un équipement pour une figurine : {hide:bool, reason:str|null} */
function availability(ctx,m,u,it,model_items,evalData){
  if(it.ban) return {hide:true};
  if(u.noEquip) return {hide:true};
  if(u.noCat&&u.noCat.includes(it.cat)) return {hide:true};
  if(u.onlyCats&&u.onlyCats.length+((u.onlyNames||[]).length)>0){ if(!(u.onlyCats||[]).includes(it.cat)&&!(u.onlyNames||[]).includes(it.n)) return {hide:true}; }
  if(u.onlyCats&&u.onlyCats.length===0&&u.onlyNames&&!u.onlyNames.includes(it.n)) return {hide:true};
  if(u.allow&&u.allow[it.cat]&&!u.allow[it.cat].includes(it.n)) return {hide:true};
  if(u.noItems&&u.noItems.includes(it.n)) return {hide:true};
  if(u.maxItemCost&&(it.k!=='d'||it.c>u.maxItemCost)) return {hide:true};
  if(u.rangedMaxCost&&it.cat==='Armes de tir'&&(it.k!=='d'||it.c>u.rangedMaxCost)) return {hide:true};
  if(u.equipIf&&!u.equipIf.some(o=>hasOpt(m,o))) return {hide:true};
  for(const oid in (m.opts||{})){ if(!m.opts[oid]) continue; const o=u.opts.find(x=>x.id===oid); if(o){ if(o.noCat&&o.noCat.includes(it.cat)) return {hide:true}; if(o.noItems&&o.noItems.includes(it.n)) return {hide:true}; } }
  if(it.needOpt&&!hasOpt(m,it.needOpt)) return {hide:true};
  if(it.o&&it.o.length){
    const b=baseOf(u,m);
    const ok=it.o.some(t=>t==='ELITE'?!!u.elite:t.startsWith('@')?(t==='@mech'?!!(b&&b.mech):hasOpt(m,t.slice(1))):t===u.id);
    if(!ok) return {hide:true};
  }
  if(u.id==='lion'&&false) return {hide:true};
  return {hide:false};
}

/* évaluation complète d'une liste */
function evaluate(L){
  const ctx=buildCtx(L); const {F,V}=ctx;
  const E={ctx,rows:[],errors:[],warns:[],total:{d:0,g:0},counts:{},elites:0,models:0};
  const defB={d:(V&&V.budget!=null?V.budget:F.budget), g:(V&&V.glory!=null?V.glory:(F.glory||0))};
  const cb=L.budget||{}; const okN=v=>v!==undefined&&v!==null&&v!==''&&!isNaN(+v);
  const budget={d:okN(cb.d)?+cb.d:defB.d, g:okN(cb.g)?+cb.g:defB.g}; E.defBudget=defB; E.customBudget=!!(okN(cb.d)||okN(cb.g));
  E.budget=budget; E.itemCount=null;
  const seen={}, seenHalf={}; const itemCount={}; const optCount={}; const uCount={};
  const err=(msg,uid)=>E.errors.push({msg,uid}); const warn=(msg,uid)=>E.warns.push({msg,uid});
  // 1) coûts
  L.models.forEach((m,idx)=>{
    const u=unitOf(ctx,m);
    if(!u){ err('Figurine inconnue dans cette variante : '+(m.unit),m.uid); E.rows.push({m,u:null,cost:{d:0,g:0},itemsList:[],idx}); return; }
    const row={m,u,idx,cost:{d:0,g:0},unitCost:{d:0,g:0},itemsList:[],optsList:[],lockedItems:[...(u.inc||[])],reqPaid:[]};
    const b=baseOf(u,m);
    if(u.merc){
      let g=u.c,d=0;
      if(V&&V.goeticMerc&&u.id==='goetique'){ const prev=(uCount['merc:goetique']||0); if(prev===0){d=V.goeticMerc.firstGold;g=0;} }
      row.unitCost={d,g};
    } else { row.unitCost={d:b?b.c:u.c,g:u.cg||0}; }

    Object.entries(grp).forEach(([g,n])=>{ const o=u.opts.find(x=>x.grp===g); let mx=o.grpMax||1; if(u.pwMax&&g==='pouvoir'&&u.pwMax[L.sin]!=null) mx=u.pwMax[L.sin]; if(n>mx) err(`${u.n} : au plus ${mx} choix dans « ${g} ».`,m.uid); });

      (o.ex||[]).forEach(x=>{ if(hasOpt(m,x)){ const oo=u.opts.find(z=>z.id===x); err(`${u.n} : « ${o.n} » est incompatible avec « ${oo?oo.n:x} ».`,m.uid);} });
      if(o.exUnless){ const [a,b]=o.exUnless; if(hasOpt(m,a)&&!hasOpt(m,b)){ const oo=u.opts.find(z=>z.id===a); err(`${u.n} : « ${o.n} » et « ${oo?oo.n:a} » ne se combinent qu’avec Deux têtes.`,m.uid);} }
      (o.req||[]).forEach(x=>{ if(!hasOpt(m,x)){ const oo=u.opts.find(z=>z.id===x); err(`${u.n} : « ${o.n} » nécessite « ${oo?oo.n:x} ».`,m.uid);} });
    });

    if(u.maxRanged){ const w=allDefs.filter(i=>i.cat==='Armes de tir').length; if(w>u.maxRanged) err(`${u.n} : 1 seule arme de tir.`,m.uid); }
    const fOpt={}; defs.forEach(i=>{ if(i.needOpt) fOpt[i.needOpt]=(fOpt[i.needOpt]||0)+1; }); Object.entries(fOpt).forEach(([o,k])=>{ if(k>1) err(`${u.n} : une seule pièce d’équipement étrangère.`,m.uid); });
    if(V&&V.minUnitCost&&u.id!=='miserable'&&!u.merc&&row.cost.d<V.minUnitCost) warn(`${u.n} : coût de ${row.cost.d} 👑 (minimum ${V.minUnitCost} 👑 pour les Chevaliers de l’Avarice).`,m.uid);
    // armes interdites avec options (ex. Colère de Dieu)
  });
  E.itemCount=itemCount;

const NUM=s=>{const m=String(s==null?'':s).replace(/−/g,'-').match(/-?\d+/);return m?+m[0]:null;};
const fmtDice=n=>(n<0?'−':'+')+Math.abs(n)+' D';

const DICE_RE=/([+−-]\d)\s*D\s?ÉS?(?!\s*BLESSURE)/;

}
function profileFor(ctx,u,m,row){

  if(ap.includes('/')){ const parts=ap.split('/').map(x=>x.trim()); ap=parts[m.base||0]||parts[0]; vals[3]=ap; base[3]=ap; }
  const items=row.itemsList.filter(i=>i.it&&i.it.st).map(i=>i.it);
  let aMod=0, soc=NUM(base[4]); let nsoc=soc; const dT={v:0}, dC={v:0};
  items.forEach(it=>{
    const st=it.st, c=it.cat, e=st.e||'', k=String(st.k||'').replace(/−/g,'-');
    if(c==='Armures'||c==='Boucliers'){ const mm=k.match(/(-?\d+)\s*MODIFICATEURS?\s*BLESSURES?/); if(mm){ aMod+=+mm[1]; why[3].push(it.n+' '+fmtSgn(+mm[1])); } }
    if(c==='Armures'){ const sn=e.split(/\.\s+/).find(x=>/socle/i.test(x)&&/\d+\s?mm/.test(x)); if(sn){ const z=+sn.match(/(\d+)\s?mm/)[1]; if(soc!=null&&z>nsoc){ nsoc=z; why[4].push(it.n); } } }

    mm2=e.match(/ajoutez ([+−-]\d) D\s?ÉS? au jet de résolution des attaques de tir effectuées par la figurine/); if(mm2){ dT.v+=NUM(mm2[1]); why[1].push(it.n+' '+fmtDice(NUM(mm2[1]))); }
  });
  const a0=NUM(ap);
  if(aMod&&a0!==null){ vals[3]=fmtSgn(a0+aMod); mod[3]=1; } else if(aMod&&(ap===''||ap==='–')){ vals[3]=fmtSgn(aMod); mod[3]=1; }
  if(nsoc!==soc){ vals[4]=nsoc+' mm'; mod[4]=1; }
  if(dT.v&&NUM(base[1])!==null){ vals[1]=fmtDice(NUM(base[1])+dT.v); mod[1]=1; }
  if(dC.v&&NUM(base[2])!==null){ vals[2]=fmtDice(NUM(base[2])+dC.v); mod[2]=1; }

function weaponsOf(ctx,u,m,row,pr){

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='trenchsnot.v1';
let S={bands:[],cur:null,view:'home',tab:'units',openModel:null,eq:{},cat:{},peek:null};
try{const r=localStorage.getItem(KEY); if(r){const j=JSON.parse(r); if(j&&Array.isArray(j.bands)) S.bands=j.bands;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({bands:S.bands}));}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,9);
const cur=()=>S.bands.find(b=>b.id===S.cur);
const emb=(fid,sz)=>(typeof EMB!=='undefined'&&EMB[fid])?`<img class="emb" src="data:image/jpeg;base64,${EMB[fid]}" width="${sz}" height="${sz}" alt="">`:'';
const CATSHORT={'Armes de tir':'Tir','Armes de corps à corps':'Corps à corps','Grenades':'Grenades','Boucliers':'Boucliers','Armures':'Armures','Matériel':'Matériel','Objets de gloire':'Gloire'};

function go(v,extra){S.view=v;Object.assign(S,extra||{});render();window.scrollTo(0,0);}
function newBand(fid,vid,name,sin,budget,ex){
  const b={id:uid(),name:name||'Ma bande',fid,vid:vid||null,sin:sin||null,models:[],t:Date.now()};
  if(ex&&ex.mode==='campagne'){b.mode='campagne';b.patron=ex.patron||'';b.game=ex.game||0;b.armory=[];}
  if(budget) b.budget=budget;
  S.bands.unshift(b);S.cur=b.id;save();
}
function chrome(inner){
  return `<header class="top"><a class="brand" href="#" data-act="home"><img src="${SNOT}" alt=""><span class="bt"><b>Trench Snot</b><i>constructeur de bandes · Trench Crusade</i></span></a>
  <nav><button data-act="home" class="${S.view==='home'?'on':''}">Bandes</button><button data-act="about" class="${S.view==='about'?'on':''}">À propos</button></nav></header>
  <main>${inner}</main>
  <footer class="sig">${LOGO}<span>by <b>coffee-time</b> · règles Warbands of Trench Crusade 1.0.2 (VF) + errata</span></footer>`;
}
function vHome(){
  const list=S.bands.map(b=>{
    const F=FACTIONS.find(f=>f.id===b.fid); if(!F) return '';
    const V=(F.variants||[]).find(v=>v.id===b.vid); let E; try{E=evaluate(b);}catch(e){E=null;}
    return `<li class="bandcard" style="--fc:${F.color}"><div class="bc">${emb(F.id,52)}<div><h3>${esc(b.name)}</h3><p>${esc(F.short)}${V?' · '+esc(V.n):''}${b.mode==='campagne'?' · <b>Campagne</b>':' · Escarmouche'}</p>
    <p class="m">${E?`<b>${E.total.d}</b>/${E.budget.d} 👑${E.budget.g||E.total.g?` · <b>${E.total.g}</b>/${E.budget.g} ☼`:''} · ${E.models} fig.${E.errors.length?` · <span class="bad">${E.errors.length} problème(s)</span>`:''}`:''}</p></div></div>
    <div class="row"><button class="btn" data-act="open" data-id="${b.id}">Ouvrir</button><button class="btn ghost" data-act="dup" data-id="${b.id}">Dupliquer</button><button class="btn ghost" data-act="del" data-id="${b.id}">${S.confirmDel===b.id?'Confirmer ?':'Supprimer'}</button></div></li>`;
  }).join('');
  return `<section class="hero"><h1>Trench Snot</h1><p>Composez votre bande pour <b>Trench Crusade</b> : budget, limites, options et équipement sont vérifiés pendant que vous construisez.</p><button class="btn big" data-act="new">Nouvelle bande</button></section>
  ${S.bands.length?`<h2>Vos bandes</h2><ul class="bands">${list}</ul>`:'<p class="muted">Aucune bande pour l’instant. Les bandes sont enregistrées dans ce navigateur.</p>'}`;
}
function syncNew(){
  const N=S.nw; if(!N) return; const g=id=>{const n=$(id);return n?n.value:null;};
  const nm=g('#nwname'), d=g('#nwd'), gl=g('#nwg'), vs=g('#nwvar'), ss=g('#nwsin');
  const pt=g('#nwpat'), gm=g('#nwgame'); if(pt!==null) N.patron=pt; if(gm!==null) N.game=+gm;
  if(nm!==null) N.name=nm; if(d!==null) N.d=d; if(gl!==null) N.g=gl; if(vs!==null) N.vid=vs; if(ss!==null) N.sin=ss;
}
function vNew(){
  const N=S.nw||(S.nw={fid:'na',vid:'',name:'',sin:'',d:'',g:'',mode:'escarmouche',patron:'',game:0});
  const F=FACTIONS.find(f=>f.id===N.fid); const V=(F.variants||[]).find(v=>v.id===N.vid);
  const dd=V&&V.budget!=null?V.budget:F.budget, dg=V&&V.glory!=null?V.glory:(F.glory||0);
  return `<h2>Nouvelle bande</h2>
  <div class="modes"><button class="mode ${N.mode!=='campagne'?'on':''}" data-act="nwm" data-id="escarmouche"><b>Escarmouche</b><span>Partie isolée : règles du livre, sans évolution.</span></button><button class="mode ${N.mode==='campagne'?'on':''}" data-act="nwm" data-id="campagne"><b>Campagne</b><span>Mécène, Objets de gloire, seuil de bande, évolution entre les parties.</span></button></div>
  <div class="facs">${FACTIONS.map(f=>`<button class="fac ${f.id===N.fid?'on':''}" style="--fc:${f.color}" data-act="nwf" data-id="${f.id}">${emb(f.id,44)}<span class="ft"><b>${esc(f.short)}</b><span>${esc(f.align)}</span></span></button>`).join('')}</div>
  <div class="card"><div class="bh">${emb(F.id,64)}<p style="margin:0">${esc(F.blurb)}</p></div>
  <label>Nom de la bande<input id="nwname" value="${esc(N.name)}" placeholder="ex. Les Fusiliers de l’Aube"></label>
  ${(F.variants||[]).length?`<label>Variante<select id="nwvar"><option value="">Bande standard (${F.budget} 👑)</option>${F.variants.map(v=>`<option value="${v.id}" ${v.id===N.vid?'selected':''}>${esc(v.n)}</option>`).join('')}</select></label>`:''}
  ${F.sins?`<label>Péché capital<select id="nwsin"><option value="">— choisir —</option>${F.sins.map(s=>`<option ${s===N.sin?'selected':''}>${esc(s)}</option>`).join('')}</select></label>`:''}
  </div>
  ${N.mode==='campagne'?`<div class="card"><h3>Campagne</h3>
  <label>Mécène<select id="nwpat"><option value="">— choisir plus tard —</option>${PATRONS.filter(p=>p.who.includes(F.id)).map(p=>`<option value="${p.id}" ${p.id===N.patron?'selected':''}>${esc(p.n)}</option>`).join('')}</select></label>
  ${(PATRONS.find(p=>p.id===N.patron)||{}).d?`<p class="muted sm">${esc(PATRONS.find(p=>p.id===N.patron).d)}</p>`:''}
  <label>Valeur de seuil de départ<select id="nwgame">${SEUIL.map((s,i)=>`<option value="${i}" ${i===(N.game||0)?'selected':''}>${s[0]} 👑 — force déployée ${s[1]}</option>`).join('')}</select></label>
  <p class="muted sm">Le seuil et la force déployée augmentent après chaque partie. Les Objets de gloire (☼) apparaissent dans les onglets d’équipement.</p></div>`:''}
  <div class="card"><h3>Budget de la bande</h3>
  <div class="two"><label>Ducats 👑<input id="nwd" type="number" inputmode="numeric" min="0" step="10" value="${esc(N.d)}" placeholder="${dd}"></label><label>Points de Gloire ☼<input id="nwg" type="number" inputmode="numeric" min="0" step="1" value="${esc(N.g)}" placeholder="${dg}"></label></div>
  <div class="pre"><span class="muted sm">Formats courants :</span>${[500,700,1000,1500].map(v=>`<button class="btn ghost sm" data-act="nwdp" data-v="${v}">${v} 👑</button>`).join('')}</div>
  <p class="muted sm">Laissez vide pour le budget standard de cette bande (${dd} 👑${dg?` + ${dg} ☼`:''}). Vous pourrez le modifier à tout moment dans la bande.</p></div>
  <div class="card"><h3>Règles de la bande</h3>${F.rules.map(r=>`<details><summary>${esc(r.t)}</summary><p>${esc(r.d)}</p></details>`).join('')}</div>
  <button class="btn big" data-act="create">Créer la bande</button>`;
}
function costStr(p){return (p.d?p.d+' 👑':'')+(p.d&&p.g?' + ':'')+(p.g?p.g+' ☼':'')||'0 👑';}

/* ---------- fiches ---------- */
function capsHtml(ctx,u){
  const ud=udOf(ctx,u);
  if(ud&&ud.cap&&ud.cap.length) return `<div class="caps"><h4>Capacités</h4>${ud.cap.map(c=>`<p><b>${esc(c.n)}</b> : ${esc(c.t)}</p>`).join('')}</div>`;
  if(u.cap) return `<div class="caps"><h4>Capacités <small>(résumé)</small></h4><p>${esc(u.cap)}</p></div>`;
  return '';
}
function weaponsHtml(ws){
  if(!ws.length) return '';
  return `<div class="wt"><h4>Armes portées</h4><div class="scx"><table><thead><tr><th>Arme</th><th>Type</th><th>Portée</th><th>Attaque</th><th>Mots-clés</th></tr></thead><tbody>${ws.map(w=>`<tr><td><b>${esc(w.n)}</b></td><td>${esc(w.t)}</td><td>${esc(w.p||'–')}</td><td>${esc(w.atk)}</td><td>${esc(w.k&&w.k!=='–'?w.k:'–')}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function profHtml(pr){
  const labels=['Mouv.','Tir','CàC','Armure','Socle'];
  return `<div class="prof">${pr.vals.map((v,i)=>`<span class="${pr.mod[i]?'chg':''}"${pr.mod[i]?` title="${esc('Base : '+pr.base[i]+' — '+pr.why[i].join(', '))}"`:''}><i>${labels[i]}</i>${esc(v||'–')}${pr.mod[i]?`<small>base ${esc(pr.base[i])}</small>`:''}</span>`).join('')}</div>
  ${pr.mod.some(x=>x)?`<p class="modnote">Profil modifié par l’équipement : ${pr.why.flat().map(esc).join(' · ')}</p>`:''}
  <p class="kw">${pr.kwBase.map(esc).join(', ')}${pr.kwAdd.map(k=>`, <span class="kadd" title="apporté par l’équipement">${esc(k)}</span>`).join('')}</p>`;
}
function itemCard(it,o){
  const st=it&&it.st; const tags=[];
  if(st){ tags.push(st.t); if(st.p&&st.p!=='–') tags.push('Portée '+st.p); }
  if(o.tag) tags.push(o.tag);
  const k=st&&st.k&&st.k!=='–'?st.k:'';
  return `<div class="icard ${o.dis?'dis':''}"><div class="ih"><b>${esc(o.name)}</b><span class="ipx">${o.price!=null?esc(o.price):''}</span></div>
  <div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  ${k?`<div class="ik">${esc(k)}</div>`:''}${st&&st.e?`<p class="ie">${esc(st.e)}</p>`:''}${!st&&it&&it.restr?`<p class="ie">${esc(it.restr)}</p>`:''}
  ${it&&it.restr&&st?`<p class="ir">${esc(it.restr)}</p>`:''}
  ${o.why?`<p class="why">${esc(o.why)}</p>`:''}
  <div class="row">${o.btn||''}</div></div>`;
}
function eqSection(ctx,u,m,row,E){
  if(u.noEquip&&!(u.inc||[]).length&&!(u.req||[]).length) return '';
  const entries=[];
  (row.lockedItems||[]).forEach(n=>{const it=ctx.byName[n]||ctx.items.find(i=>i.n===n); entries.push({it,n,cat:it?it.cat:'Matériel',tag:'Inclus'});});
  row.itemsList.forEach((i,k)=>{ entries.push({it:i.it,n:i.label||i.n,cat:i.it?i.it.cat:'Matériel',price:i.price,key:i.key,k,missing:i.missing,tag:m.items.includes(i.key)?null:'Imposé'}); });
  const avail=ctx.items.filter(it=>!availability(ctx,m,u,it).hide);
  const cats=CAT_ORDER.filter(c=>entries.some(e=>e.cat===c)||avail.some(it=>it.cat===c));
  if(!cats.length) return '';
  let tab=S.eq[m.uid]; if(!cats.includes(tab)) tab=cats.find(c=>entries.some(e=>e.cat===c))||cats[0];
  const cnt=c=>entries.filter(e=>e.cat===c).length;
  const tabs=`<div class="etabs" role="tablist">${cats.map(c=>`<button role="tab" class="${c===tab?'on':''}" data-act="eqt" data-id="${m.uid}" data-c="${esc(c)}">${CATSHORT[c]||c}${cnt(c)?` <i>${cnt(c)}</i>`:''}</button>`).join('')}</div>`;
  const mine=entries.filter(e=>e.cat===tab);
  const chosen=mine.map(e=>{
    const p=e.price?costStr(e.price):'';
    const btn=(!e.tag&&e.k!=null)?`<button class="btn ghost sm rm" data-act="ri" data-id="${m.uid}" data-k="${e.k}">✕ Retirer</button>`:'';
    if(e.missing) return `<div class="icard"><div class="ih"><b>${esc(e.n)}</b></div><p class="why">Équipement introuvable dans cette variante.</p><div class="row">${btn}</div></div>`;
    return itemCard(e.it,{name:e.n,price:p,tag:e.tag,btn});
  }).join('')||`<p class="muted sm">Aucun équipement de ce type. Utilisez le catalogue pour en ajouter.</p>`;
  const defs=rowDefs(ctx,row);
  const open=!!S.cat[m.uid+'|'+tab];
  const list=avail.filter(it=>it.cat===tab);
  let cat='';
  if(list.length){
    cat=`<button class="btn ghost" data-act="catog" data-id="${m.uid}" data-c="${esc(tab)}">${open?'▲ Fermer le catalogue':'＋ Ajouter un équipement ('+list.length+' disponible'+(list.length>1?'s':'')+')'}</button>`;
    if(open) cat+=`<div class="catalog">${list.map(it=>{
      const pr=(u.disc&&u.disc[it.n]!=null)?u.disc[it.n]:it.c; const price=pr+' '+(it.k==='g'?'☼':'👑');
      let why=addBlock(defs,it,u.merc||!!u.maxWeapons);
      if(!why&&it.lim&&!(it.limEx||[]).includes(u.id)){ const n=(it.limEx&&it.limEx.length)?(E.itemCount['~'+it.key]||0):(E.itemCount[it.key]||0); if(n>=it.lim) why='limite de la bande atteinte ('+n+'/'+it.lim+')'; }
      if(!why&&it.pm&&defs.some(d=>d.n===it.n)) why='1 par figurine';
      if(!why&&u.maxRanged&&it.cat==='Armes de tir'&&defs.filter(d=>d.cat==='Armes de tir').length>=u.maxRanged) why='une seule arme de tir';
      if(!why&&u.maxWeapons&&(WEAPON_CATS.includes(it.cat)||it.cat==='Boucliers')&&defs.filter(d=>WEAPON_CATS.includes(d.cat)||d.cat==='Boucliers').length>=u.maxWeapons) why='nombre maximal d’armes atteint';
      if(!why&&it.needOpt&&!hasOpt(m,it.needOpt)) why='option requise';
      return itemCard(it,{name:it.n+(it.foreignLabel?' ('+it.foreignLabel+')':''),price,dis:!!why,why,btn:`<button class="btn sm" data-act="addi" data-id="${m.uid}" data-key="${esc(it.key)}" ${why?'disabled':''}>＋ Ajouter</button>`});
    }).join('')}</div>`;
  }
  return `<div class="eq"><h4>Équipement</h4>${tabs}<div class="echosen">${chosen}</div>${cat}</div>`;
}
function optionsHtml(u,m,edit){
  const og={}; (u.opts||[]).forEach(o=>{(og[o.grp||'_']=og[o.grp||'_']||[]).push(o);});
  if(!(u.opts||[]).length) return '';
  return `<div class="opts"><h4>Options</h4>`+Object.entries(og).map(([g,arr])=>`${g!=='_'?`<h5>${esc(g)}</h5>`:''}${arr.map(o=>edit?`<label class="chk"><input type="checkbox" data-act="opt" data-id="${m.uid}" data-o="${o.id}" ${hasOpt(m,o.id)?'checked':''}><span>${esc(o.n)}${o.c?` <small>${o.c} 👑</small>`:''}${o.d?`<em>${esc(o.d)}</em>`:''}</span></label>`:`<p class="opl">• <b>${esc(o.n)}</b>${o.c?` <small>${o.c} 👑</small>`:''}${o.d?` — ${esc(o.d)}`:''}</p>`).join('')}`).join('')+`</div>`;
}
function unitSheet(ctx,u,m,row,edit,E){
  const pr=profileFor(ctx,u,m,row); const ud=udOf(ctx,u);
  let h=profHtml(pr);
  if(ud&&ud.eq) h+=`<p class="eqt"><b>Équipement</b> : ${esc(ud.eq)}</p>`;
  if(u.bases&&u.bases.length>1){
    h+=edit?`<label>Profil<select data-act="base" data-id="${m.uid}">${u.bases.map((b,i)=>`<option value="${i}" ${(m.base||0)===i?'selected':''}>${esc(b.n)} — ${b.c} 👑</option>`).join('')}</select></label>`
           :`<p class="eqt"><b>Profils</b> : ${u.bases.map(b=>esc(b.n)+' — '+b.c+' 👑').join(' · ')}</p>`;
  }
  if(edit){ h+=optionsHtml(u,m,true); h+=eqSection(ctx,u,m,row,E); }
  else { h+=optionsHtml(u,m,false); }
  h+=weaponsHtml(weaponsOf(ctx,u,m,row,pr));
  h+=capsHtml(ctx,u);
  if(ud&&ud.fl) h+=`<details class="fluff"><summary>Description</summary><p>${esc(ud.fl)}</p></details>`;
  return h;
}
function vPeek(L,E){

}

function vExport(L,E){
  const F=E.ctx.F,V=E.ctx.V,ctx=E.ctx; let t=`${L.name}\n${F.short}${V?' — '+V.n:''}${L.sin?' — Péché : '+L.sin:''}\n${E.total.d}/${E.budget.d} 👑${E.budget.g||E.total.g?` · ${E.total.g}/${E.budget.g} ☼`:''} · ${E.models} figurines\n${'─'.repeat(30)}\n`;
  E.rows.forEach(r=>{ if(!r.u) return; const pr=profileFor(ctx,r.u,r.m,r); const eq=[...(r.u.inc||[]),...r.itemsList.map(i=>i.label||i.n),...r.optsList.map(o=>o.n)]; t+=`• ${r.u.n} [${costStr(r.cost)}]\n    Mouv. ${pr.vals[0]} · Tir ${pr.vals[1]} · CàC ${pr.vals[2]} · Armure ${pr.vals[3]} · Socle ${pr.vals[4]}${eq.length?'\n    '+eq.join(', '):''}\n`; });

}
function vAbout(){
  const miss=(typeof NOCAPS!=='undefined'&&NOCAPS.length)?NOCAPS.join(', '):'';
  return `<h2>À propos</h2><div class="card"><p><b>Trench Snot</b> est un constructeur de bandes pour <i>Trench Crusade</i>, repensé à partir des vestiges de Trench Companion.</p>
<h3>Version des règles</h3><p>Données issues des <b>Warbands of Trench Crusade 1.0.2</b> en français (mise à jour VF du 11/08/26), qui intègrent déjà les errata publiés sur le Trench Wire (mouvement des Fantassins d’élite oints, texte d’IMPÉNÉTRABLE, harmonisation des mots-clés). Les capacités et l’équipement (type, portée, mots-clés, effets) proviennent du livre de règles et des fiches de bande.</p>
<h3>Équipement et mains</h3><p>Les contrôles suivent le livre (p. 69) : au plus une arme de tir et une arme de corps à corps portées en même temps, chacune à 2 mains <i>ou</i> à 1 main ×2, l’échange d’une arme à l’autre se faisant entre ACTIONS ; avec un bouclier, une seule arme par catégorie, à 1 main, sauf si l’arme et le bouclier ont tous deux COMBO BOUCLIER. Il est donc permis de porter une arme à 2 mains de corps à corps <i>et</i> un fusil à 2 mains, mais pas deux armes de tir.</p>
<h3>Non appliqué</h3><ul><li>Les errata du Trench Wire publiés <b>uniquement sous forme d’images</b> (illisibles depuis ici), hors Hallebarde de tir (COMBO BOUCLIER) ;</li><li>mode Campagne : l’expérience, les Cicatrices de combat et les tables d’exploration ne sont pas encore gérés ;</li><li>Le « Rules Review » bêta d’avril 2026 (Observateur, Brûleur, Mangeur de péchés, Sorcier goétique…) ;</li><li>le livre de règles imprimé V1.1 (sortie le 30 novembre 2026) ;</li><li>l’extension payante Carcass Front ;</li><li>les variantes absentes du livre en français (Grande Faim, Brigade rouge, Chœur noyé, Chevaliers de saint Lazare, Banc du Léviathan, Troupeau béni, Pillards navals et Procession autonomes).</li></ul>
<h3>Limites connues</h3><ul><li>Équipes-feu et armes lourdes : règle indiquée dans l’onglet Règles, non contrôlée.</li>${miss?`<li>Ces fiches affichent encore un résumé de capacités : ${esc(miss)}.</li>`:''}<li>Les Bombes infernales n’ont pas de profil d’arme chiffré dans le livre.</li><li>Grand Anachorète : 15 👑 dans le tableau d’armurerie de la Saint Méthode, 5 👑 dans sa fiche — le tableau (15 👑) est retenu.</li><li>Fer froid (Alba) : le demi-tarif est arrondi à l’entier supérieur.</li><li>Les modifications du profil calculées (armure, socle, dés) couvrent les cas écrits dans le livre ; vérifiez les cas particuliers.</li><li>Vérifiez toujours votre liste face au livre de règles.</li></ul>
