function render(){
  const v=S.view; let h;
  if(v==='home') h=vHome(); else if(v==='new') h=vNew(); else if(v==='build') h=vBuilder(); else h=vAbout();
  $('#app').innerHTML=chrome(h);
}
function addModel(L,id,merc){
  const m={uid:uid(),unit:id,merc:!!merc,base:0,opts:{},items:[]}; L.models.push(m); S.openModel=m.uid;
}
function setBudget(L,k,v){
  const E=evaluate(L); L.budget=L.budget||{};
  if(v===''||v==null||isNaN(+v)) delete L.budget[k]; else L.budget[k]=Math.max(0,Math.round(+v));
  if(L.budget.d==null&&L.budget.g==null) delete L.budget;
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act, id=el.dataset.id;
  if(el.tagName==='SELECT'||(el.tagName==='INPUT')) return;
  const L=cur();
  switch(a){
    case 'home': e.preventDefault(); go('home'); break;
    case 'about': go('about'); break;
    case 'new': S.nw=null; go('new'); break;
    case 'nwf': syncNew(); { const o=S.nw||{}; S.nw={fid:id,vid:'',name:o.name||'',sin:'',d:o.d||'',g:o.g||'',mode:o.mode||'escarmouche',patron:'',game:o.game||0}; } render(); break;
    case 'nwm': syncNew(); S.nw.mode=id; render(); break;
    case 'nwdp': syncNew(); S.nw.d=String(el.dataset.v); render(); break;
    case 'create': { syncNew(); const N=S.nw; const F=FACTIONS.find(f=>f.id===N.fid); const nm=(N.name||'').trim()||'Ma bande '+F.short;
      const V=(F.variants||[]).find(v=>v.id===N.vid); const dd=V&&V.budget!=null?V.budget:F.budget, dg=V&&V.glory!=null?V.glory:(F.glory||0);
      const hasD=N.d!==''&&!isNaN(+N.d), hasG=N.g!==''&&!isNaN(+N.g);
      newBand(N.fid,N.vid,nm,N.sin,(hasD||hasG)?{d:hasD?Math.max(0,Math.round(+N.d)):dd,g:hasG?Math.max(0,Math.round(+N.g)):dg}:null,{mode:N.mode,patron:N.patron,game:N.game});
      S.tab='units'; S.peek=null; go('build'); break; }
    case 'open': S.cur=id; S.tab='units'; S.openModel=null; S.peek=null; go('build'); break;
    case 'dup': { const b=S.bands.find(x=>x.id===id); const c=JSON.parse(JSON.stringify(b)); c.id=uid(); c.name+=' (copie)'; c.models.forEach(m=>m.uid=uid()); S.bands.unshift(c); save(); render(); break; }
    case 'del': if(S.confirmDel===id){ S.bands=S.bands.filter(b=>b.id!==id); S.confirmDel=null; save(); } else S.confirmDel=id; render(); break;
    case 'tab': S.tab=id; render(); break;
    case 'peek': S.peek=(S.peek&&S.peek.id===id&&S.peek.merc===(el.dataset.merc==='1'))?null:{id,merc:el.dataset.merc==='1'}; render(); { const p=$('.peek'); if(p) p.scrollIntoView({block:'nearest'}); } break;
    case 'peekx': S.peek=null; render(); break;
    case 'addu': addModel(L,id,el.dataset.merc==='1'); S.peek=null; save(); render(); break;
    case 'tog': S.openModel=S.openModel===id?null:id; render(); break;
    case 'rm': L.models=L.models.filter(m=>m.uid!==id); save(); render(); break;
    case 'cpy': { const m=L.models.find(x=>x.uid===id); const c=JSON.parse(JSON.stringify(m)); c.uid=uid(); L.models.splice(L.models.indexOf(m)+1,0,c); S.openModel=null; save(); render(); break; }
    case 'ri': { const m=L.models.find(x=>x.uid===id); const E=evaluate(L); const row=E.rows.find(r=>r.m===m); const k=+el.dataset.k; const key=row.itemsList[k].key; const i=m.items.indexOf(key); if(i>=0) m.items.splice(i,1); save(); render(); break; }
    case 'eqt': S.eq[id]=el.dataset.c; render(); break;
    case 'catog': { const kk=id+'|'+el.dataset.c; S.cat[kk]=!S.cat[kk]; render(); break; }
    case 'addi': { const m=L.models.find(x=>x.uid===id); if(m){ m.items.push(el.dataset.key); save(); render(); } break; }
    case 'ara': (L.armory=L.armory||[]).push(el.dataset.n); save(); render(); break;
    case 'arx': (L.armory||[]).splice(+el.dataset.k,1); save(); render(); break;
    case 'budp': setBudget(L,'d',el.dataset.v); save(); render(); break;
    case 'budreset': delete L.budget; save(); render(); break;
    case 'print': try{window.print();}catch(x){} break;
    case 'copy': { const t=S.exportText||''; const done=ok=>{const s=$('#cpmsg'); if(s)s.textContent=ok?'Copié.':'Sélectionnez le texte pour le copier.';}; try{navigator.clipboard.writeText(t).then(()=>done(true),()=>{selSheet();done(false);});}catch(x){selSheet();done(false);} break; }
  }
});
function selSheet(){const n=$('#sheet'); if(n){const r=document.createRange(); r.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(r);}}
document.addEventListener('change',e=>{
  const el=e.target; const a=el.dataset&&el.dataset.act; const L=cur();
  if(el.id==='nwvar'||el.id==='nwsin'||el.id==='nwname'||el.id==='nwd'||el.id==='nwg'){ syncNew(); if(el.id==='nwvar'||el.id==='nwd'||el.id==='nwg') render(); return; }
  if(el.id==='nwpat'||el.id==='nwgame'){ syncNew(); render(); return; }
  if(el.id==='cpat'){L.patron=el.value;save();render();return;}
  if(el.id==='cgame'){L.game=+el.value;save();render();return;}
  if(el.id==='bname'){L.name=el.value;save();return;}
  if(el.id==='bd'||el.id==='bg'){ setBudget(L,el.id==='bd'?'d':'g',el.value); save(); render(); return; }
  if(!a||!L) return; const m=L.models.find(x=>x.uid===el.dataset.id); if(!m) return;
  if(a==='opt'){ m.opts[el.dataset.o]=el.checked; if(!el.checked) delete m.opts[el.dataset.o]; }
  else if(a==='base'){ m.base=+el.value; }
  save(); render();
});
render();

setTimeout(()=>{const s=document.getElementById('splash'); if(s) s.remove();},1950);
</script>
