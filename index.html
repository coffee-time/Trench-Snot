<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b3f1d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Trench Snot"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Trench Snot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Lobster&display=swap">
<style>
:root{--bg:#f3ead8;--panel:#fbf5e8;--fg:#2c1f12;--mute:#7a6650;--line:#d9c9a8;--accent:#6b3f1d;--accent-fg:#fbf5e8;--bad:#a3261b;--okc:#3d6b2a;--warn:#8a5a00;--logo-bg:#e8d7b4;--logo-cup:#5a3416;--shadow:0 1px 0 rgba(60,35,10,.08),0 6px 18px -10px rgba(60,35,10,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1610;--panel:#2a2019;--fg:#efe3cb;--mute:#b09a7a;--line:#45362a;--accent:#d9a45b;--accent-fg:#1d1610;--bad:#ff8a78;--okc:#9fd27d;--warn:#e8b24f;--logo-bg:#3a2b1e;--logo-cup:#e9c48a;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1610;--panel:#2a2019;--fg:#efe3cb;--mute:#b09a7a;--line:#45362a;--accent:#d9a45b;--accent-fg:#1d1610;--bad:#ff8a78;--okc:#9fd27d;--warn:#e8b24f;--logo-bg:#3a2b1e;--logo-cup:#e9c48a;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:17px/1.5 Alegreya,Georgia,serif;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:860px;margin:0 auto}
h1,h2,h3,h4,.btn,.stats,.tabs,nav button,.c,.cnt{font-family:'Special Elite','Courier New',monospace;font-weight:400}
h1{font-size:2.6rem;margin:.2em 0;text-wrap:balance}h2{font-size:1.5rem;margin:1.2em 0 .5em}h3{font-size:1.1rem;margin:1.2em 0 .5em}h3 small{font:inherit;color:var(--mute);font-size:.8em}
h4{margin:.8em 0 .3em;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}h5{margin:.6em 0 .2em;font-size:.85rem;color:var(--mute)}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:2px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit}.bt{display:flex;flex-direction:column;line-height:1.1}.bt b{font:1.35rem 'Special Elite',monospace}.bt i{font-size:.8rem;color:var(--mute)}
nav{display:flex;gap:4px}nav button{background:none;border:0;color:var(--fg);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:.95rem}nav button.on{background:var(--panel);box-shadow:inset 0 -2px 0 var(--accent)}
main{padding:14px 0 30px;min-width:0}
.hero{padding:28px 0 8px}.hero p{max-width:55ch;color:var(--mute);font-size:1.1rem}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:9px 16px;cursor:pointer;font-size:.95rem}.btn.big{padding:13px 24px;font-size:1.05rem;margin-top:12px}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}.btn.sm{padding:3px 9px}
.btn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bands{list-style:none;padding:0;display:grid;gap:10px}.bandcard{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--fc);border-radius:8px;padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}.bandcard h3{margin:0}.bandcard p{margin:0;color:var(--mute)}.bandcard .m{color:var(--fg)}
.bad{color:var(--bad)}.muted{color:var(--mute)}.sm{font-size:.9rem;margin:.2em 0}
.facs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}.fac{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--fc);border-radius:8px;padding:10px;text-align:left;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;font-size:1rem}.fac b{font:1rem 'Special Elite',monospace}.fac span{color:var(--mute);font-size:.85rem}.fac.on{outline:2px solid var(--accent);background:var(--bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:12px 0;box-shadow:var(--shadow)}.card h3{margin-top:.3em}
label{display:block;margin:.7em 0;font-size:.9rem;color:var(--mute)}input,select{display:block;width:100%;margin-top:4px;font:1rem Alegreya,serif;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
details{border-top:1px solid var(--line);padding:6px 0}summary{cursor:pointer;font-weight:700}details p{margin:.4em 0;color:var(--fg)}
.bhead{border-left:6px solid var(--fc);padding-left:12px;margin:6px 0}.bhead p{margin:0;color:var(--mute)}input.nm{font:1.5rem 'Special Elite',monospace;background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:2px 0}
.sticky{position:sticky;top:0;background:var(--bg);z-index:5;padding:8px 0;border-bottom:1px solid var(--line)}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}.meter.over i{background:var(--bad)}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:.95rem}.ok{color:var(--okc)}.ok.bad{color:var(--bad)}
.errs,.warns{margin:8px 0;padding:8px 8px 8px 28px;border-radius:6px;font-size:.95rem}.errs{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}.warns{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.tabs{display:flex;gap:4px;margin:10px 0;border-bottom:1px solid var(--line)}.tabs button{background:none;border:0;padding:8px 14px;color:var(--mute);cursor:pointer;font-size:.95rem}.tabs button.on{color:var(--fg);box-shadow:inset 0 -3px 0 var(--accent)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ucard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 52px 9px 11px;text-align:left;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;font-size:1rem;min-width:0}.ucard b{font-weight:700;overflow-wrap:anywhere}.ucard .c{font-size:.85rem;color:var(--mute)}.ucard .cnt{position:absolute;right:10px;top:9px;font-size:.85rem;background:var(--bg);border-radius:10px;padding:0 8px}.ucard.full{opacity:.55}.ucard em,.mdl em{font-style:normal;font-size:.7rem;letter-spacing:.06em;color:var(--accent)}
.ucard:hover{border-color:var(--accent)}
.mdl{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;min-width:0}.mdl.has-err{border-color:var(--bad)}
.mh{display:flex;justify-content:space-between;gap:8px;align-items:center}.mt{flex:1;display:flex;gap:8px;align-items:baseline;background:none;border:0;color:var(--fg);cursor:pointer;font:1.05rem Alegreya,serif;text-align:left;padding:4px 0;min-width:0;flex-wrap:wrap}.mc{margin-left:auto;font:.9rem 'Special Elite',monospace;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}.chip{font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 8px;display:inline-flex;align-items:center;gap:4px}.chip.lock{opacity:.7;border-style:dashed}.chip.opt{border-color:var(--accent)}.chip small{color:var(--mute)}.chip button{background:none;border:0;color:var(--bad);cursor:pointer;font-size:1rem;padding:0 2px}
.prof{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}.prof span{background:var(--bg);border-radius:6px;padding:3px 6px;font-size:.9rem;text-align:center;min-width:0;overflow-wrap:anywhere}.prof i{display:block;font-style:normal;font-size:.7rem;color:var(--mute);text-transform:uppercase}
.kw{font-size:.8rem;letter-spacing:.05em;color:var(--accent);margin:.2em 0}.cap{font-size:.92rem;color:var(--mute);margin:.2em 0}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--fg);margin:.3em 0;font-size:.95rem}.chk input{width:auto;margin-top:5px}.chk em{display:block;color:var(--mute);font-size:.85rem}
.sel{display:grid;grid-template-columns:1fr;gap:0}.sel span{font-size:.8rem}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font:.9rem/1.5 'Courier New',monospace}
.sig{display:flex;gap:10px;align-items:center;justify-content:center;border-top:2px solid var(--line);padding:16px 0 28px;color:var(--mute);font-size:.9rem;text-align:center;flex-wrap:wrap}.sig b{color:var(--fg)}
a{color:var(--accent)}ul{padding-left:1.2em}
@media(max-width:480px){h1{font-size:2.1rem}.prof{grid-template-columns:repeat(3,1fr)}}
#printsheet{display:none}
@media print{
 body{background:#fff;color:#000;padding:0;font-size:11pt}
 .top,.sticky,.tabs,.errs,.warns,.bhead,.sig,main>*:not(#printsheet){display:none!important}
 main{padding:0}#printsheet{display:block!important}
 #printsheet h1{font-size:20pt;margin:0}#printsheet .ps{margin:.2em 0 .8em;border-bottom:1.5pt solid #000;padding-bottom:6pt}
 .pm{break-inside:avoid;border:.8pt solid #444;border-radius:4pt;padding:5pt 8pt;margin:0 0 6pt}
 .pmh{display:flex;justify-content:space-between;font-size:12pt}.pmh em{font-style:normal;font-size:8pt;margin-left:6pt}
 .pp{font-size:9.5pt}.pk{font-size:8.5pt;letter-spacing:.04em}.pe{font-size:10pt;margin-top:2pt}.pc{font-size:8.5pt;color:#333;margin-top:2pt}
 .pf{font-size:8pt;color:#555;text-align:center;margin-top:10pt}
 @page{margin:14mm}
}
#splash{position:fixed;inset:0;z-index:999;background:#f3ead8;color:#2c1f12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;animation:spOut .35s ease 1.6s forwards}
#splash img{width:min(52vw,230px);height:auto;animation:spIn .7s ease both}
#splash h1{font:clamp(2.2rem,9vw,3.4rem) 'Special Elite','Courier New',monospace;margin:.1em 0 0;animation:spUp .6s ease .25s both}
#splash p{margin:0;font:clamp(1.4rem,6vw,2rem) Lobster,cursive;color:#6b3f1d;animation:spUp .6s ease .5s both}
@keyframes spIn{from{opacity:0;transform:scale(.8) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash,#splash *{animation-duration:.01s!important}#splash{animation-delay:1.6s!important}}
.brand img{width:40px;height:40px;object-fit:contain}
@media print{#splash{display:none!important}}
.ctlogo{width:84px;height:auto;max-height:70px;object-fit:contain}
</style>

/* ===== Moteur Trench Snot ===== */
const CAT_ORDER=['Armes de tir','Armes de corps à corps','Grenades','Boucliers','Armures','Matériel'];
const WEAPON_CATS=['Armes de tir','Armes de corps à corps'];
const fmtD=n=>Number.isInteger(n)?String(n):n.toFixed(1);

function parseItem(cat,n,c,k,r,o,extra){
  r=r||'';
  const it={n,c,k,r,cat,key:n,src:null,lim:0,o:o?String(o).split(','):[],ban:false,limEx:[]};
  const m=r.match(/Limite\s*:\s*(\d+)/); if(m) it.lim=+m[1];
  it.coiffe=/Coiffe/.test(r); it.combo=/Combo bouclier/i.test(r); it.tenon=/Tenon de baïonnette/.test(r);
  it.consom=/Consommable/.test(r); it.pm=/1\/figurine/.test(r);
  if(/sauf (les )?Fantassins/.test(r)) it.limEx=['fantassin'];
  if(typeof extra==='string') it.needItem=extra; else if(extra&&typeof extra==='object') Object.assign(it,extra);
  const parts=r.split(' · '); it.restr=parts[0]; it.stats=parts.slice(1).join(' · ');
  return it;
}
function itemsOf(F){const out=[];F.arm.forEach(([cat,arr])=>arr.forEach(a=>out.push(parseItem(cat,...a))));return out;}

function buildCtx(L){
  const F=FACTIONS.find(f=>f.id===L.fid); const V=(F.variants||[]).find(v=>v.id===L.vid)||null;
  const cloneU=u=>({...u,opts:(u.opts||[]).map(o=>({...o})),bases:u.bases?u.bases.map(b=>({...b})):null});
  let units=F.units.map(cloneU);
  let items=itemsOf(F);
  if(V){
    (V.units||[]).forEach(u=>{const c=cloneU(u); if(c.leader) units.unshift(c); else units.push(c);});
    (V.ban||[]).forEach(id=>{const u=units.find(x=>x.id===id); if(u)u.banned=true;});
    Object.entries(V.unitMod||{}).forEach(([id,m])=>{const u=units.find(x=>x.id===id); if(u)Object.assign(u,m);});
    Object.entries(V.optAdd||{}).forEach(([id,arr])=>{const u=units.find(x=>x.id===id); if(u)arr.forEach(o=>{if(!u.opts.some(x=>x.id===o.id))u.opts.push({...o});});});
    if(V.optAddAll&&V.optAddAll.notElite) units.forEach(u=>{if(!u.elite&&!u.banned&&!u.noEquip) V.optAddAll.notElite.forEach(o=>{if(!u.opts.some(x=>x.id===o.id))u.opts.push({...o});});});
    Object.entries(V.optMod||{}).forEach(([uid,mm])=>{const u=units.find(x=>x.id===uid); if(u)Object.entries(mm).forEach(([oid,m])=>{const o=u.opts.find(x=>x.id===oid); if(o)Object.assign(o,m);});});
    (V.noOpt||[]).forEach(id=>units.forEach(u=>{u.opts=u.opts.filter(o=>o.id!==id);}));
    Object.entries(V.noBase||{}).forEach(([uid,flags])=>{const u=units.find(x=>x.id===uid); if(u&&u.bases)u.bases=u.bases.filter(b=>!flags.some(f=>b[f]));});
    Object.entries(V.itemMod||{}).forEach(([n,m])=>{const it=items.find(x=>x.n===n); if(it){const mm={...m}; if('o' in mm) mm.o=mm.o?String(mm.o).split(','):[]; Object.assign(it,mm);}});
    (V.banItems||[]).forEach(n=>{const it=items.find(x=>x.n===n); if(it)it.ban=true;});
    (V.items||[]).forEach(a=>items.push(parseItem(a[0],a[1],a[2],a[3],a[4],a[5],a[6])));
    (V.collect||[]).forEach(src=>{const SF=FACTIONS.find(f=>f.id===src); itemsOf(SF).forEach(it=>{items.push({...it,src,key:it.n+'|'+src,foreignLabel:SF.short,collect:src});});});
  }
  // armes étrangères liées à une option (rang Croix putréfiée / Regard envieux)
  if(F.id==='gn') ['na','le'].forEach(src=>{const SF=FACTIONS.find(f=>f.id===src); itemsOf(SF).filter(i=>WEAPON_CATS.includes(i.cat)).forEach(it=>items.push({...it,src,key:it.n+'|x'+src,foreignLabel:SF.short,needOpt:'r_croix'}));});
  if(F.id==='co') ['na','pe','su'].forEach(src=>{const SF=FACTIONS.find(f=>f.id===src); itemsOf(SF).forEach(it=>items.push({...it,src,key:it.n+'|x'+src,foreignLabel:SF.short,needOpt:'pw7'}));});
  // pouvoirs : filtrer selon le péché
  units.forEach(u=>{u.opts=u.opts.filter(o=>!o.pw||!o.sin||o.sin===L.sin);});
  // mercenaires
  let mercs=MERCS.filter(m=>m.who==='any'?m.align===undefined||true:m.who.includes(F.id)).filter(m=>m.who==='any'?true:true);
  mercs=mercs.filter(m=>{
    if(m.who==='any') return true;
    if(m.who.includes(F.id)) return true;
    return false;
  });
  if(V&&V.banMerc) mercs=mercs.filter(m=>!V.banMerc.includes(m.n));
  if(V&&V.noMerc) mercs=[];
  mercs=mercs.map(m=>({...m,opts:(m.opts||[]).map(o=>({...o})),merc:true,max:m.max||1}));
  if(V&&V.goeticMerc){const g=mercs.find(m=>m.id==='goetique'); if(g)g.max=V.goeticMerc.max;}
  const byKey={}; items.forEach(i=>byKey[i.key]=i);
  const byName={}; items.forEach(i=>{if(!byName[i.n]&&!i.needOpt&&!i.collect)byName[i.n]=i;});
  return {F,V,units,items,mercs,byKey,byName,L};
}
function unitOf(ctx,m){return m.merc?ctx.mercs.find(u=>u.id===m.unit):ctx.units.find(u=>u.id===m.unit);}

function baseOf(u,m){return u.bases?(u.bases[m.base||0]||u.bases[0]):null;}
function hasOpt(m,id){return !!(m.opts&&m.opts[id]);}
function isElite(u,m,ctx){return !!u.elite;}

/* disponibilité d'un équipement pour une figurine : {hide:bool, reason:str|null} */
function availability(ctx,m,u,it,model_items,evalData){
  if(it.ban) return {hide:true};
  if(u.noEquip) return {hide:true};
  if(u.noCat&&u.noCat.includes(it.cat)) return {hide:true};
  if(u.onlyCats&&u.onlyCats.length+((u.onlyNames||[]).length)>0){ if(!(u.onlyCats||[]).includes(it.cat)&&!(u.onlyNames||[]).includes(it.n)) return {hide:true}; }
  if(u.onlyCats&&u.onlyCats.length===0&&u.onlyNames&&!u.onlyNames.includes(it.n)) return {hide:true};
  if(u.allow&&u.allow[it.cat]&&!u.allow[it.cat].includes(it.n)) return {hide:true};
  if(u.noItems&&u.noItems.includes(it.n)) return {hide:true};
  if(u.maxItemCost&&(it.k!=='d'||it.c>u.maxItemCost)) return {hide:true};
  if(u.rangedMaxCost&&it.cat==='Armes de tir'&&(it.k!=='d'||it.c>u.rangedMaxCost)) return {hide:true};
  if(u.equipIf&&!u.equipIf.some(o=>hasOpt(m,o))) return {hide:true};
  for(const oid in (m.opts||{})){ if(!m.opts[oid]) continue; const o=u.opts.find(x=>x.id===oid); if(o){ if(o.noCat&&o.noCat.includes(it.cat)) return {hide:true}; if(o.noItems&&o.noItems.includes(it.n)) return {hide:true}; } }
  if(it.needOpt&&!hasOpt(m,it.needOpt)) return {hide:true};
  if(it.o&&it.o.length){
    const b=baseOf(u,m);
    const ok=it.o.some(t=>t==='ELITE'?!!u.elite:t.startsWith('@')?(t==='@mech'?!!(b&&b.mech):hasOpt(m,t.slice(1))):t===u.id);
    if(!ok) return {hide:true};
  }
  if(u.id==='lion'&&false) return {hide:true};
  return {hide:false};
}

/* évaluation complète d'une liste */
function evaluate(L){
  const ctx=buildCtx(L); const {F,V}=ctx;
  const E={ctx,rows:[],errors:[],warns:[],total:{d:0,g:0},counts:{},elites:0,models:0};
  const budget={d:L.budget?L.budget.d:(V&&V.budget!=null?V.budget:F.budget), g:L.budget?L.budget.g:(V&&V.glory!=null?V.glory:F.glory)};
  E.budget=budget;
  const seen={}, seenHalf={}; const itemCount={}; const optCount={}; const uCount={};
  const err=(msg,uid)=>E.errors.push({msg,uid}); const warn=(msg,uid)=>E.warns.push({msg,uid});
  // 1) coûts
  L.models.forEach((m,idx)=>{
    const u=unitOf(ctx,m);
    if(!u){ err('Figurine inconnue dans cette variante : '+(m.unit),m.uid); E.rows.push({m,u:null,cost:{d:0,g:0},itemsList:[],idx}); return; }
    const row={m,u,idx,cost:{d:0,g:0},unitCost:{d:0,g:0},itemsList:[],optsList:[],lockedItems:[...(u.inc||[])],reqPaid:[]};
    const b=baseOf(u,m);
    if(u.merc){
      let g=u.c,d=0;
      if(V&&V.goeticMerc&&u.id==='goetique'){ const prev=(uCount['merc:goetique']||0); if(prev===0){d=V.goeticMerc.firstGold;g=0;} }
      row.unitCost={d,g};
    } else { row.unitCost={d:b?b.c:u.c,g:u.cg||0}; }
    uCount[(u.merc?'merc:':'')+u.id]=(uCount[(u.merc?'merc:':'')+u.id]||0)+1;
    row.cost.d+=row.unitCost.d; row.cost.g+=row.unitCost.g;
    (u.opts||[]).forEach(o=>{ if(hasOpt(m,o.id)){ row.optsList.push(o); row.cost.d+=o.c; optCount[o.id]=(optCount[o.id]||0)+1; }});
    const itemKeys=[...(u.req||[]).filter(n=>!m.items.includes(n)),...m.items];
    itemKeys.forEach(key=>{
      const it=ctx.byKey[key]||ctx.byName[key];
      if(!it){ row.itemsList.push({key,n:key,price:{d:0,g:0},missing:true}); return; }
      let price=(u.disc&&u.disc[it.n]!=null)?u.disc[it.n]:it.c; let k=it.k;
      if(V&&V.items){ const vi=V.items.find(a=>a[1]===it.n&&a[6]&&a[6].freeFirst); if(vi&&!seen[it.key]) price=0; }
      if(V&&V.firstHalf&&it.cat===V.firstHalf.cat&&!seenHalf[it.key]){ price=Math.ceil(price/2); seenHalf[it.key]=1; }
      seen[it.key]=(seen[it.key]||0)+1;
      const p={d:k==='d'?price:0,g:k==='g'?price:0};
      row.cost.d+=p.d; row.cost.g+=p.g; row.itemsList.push({key:it.key,n:it.n,it,price:p,label:it.foreignLabel?it.n+' ('+it.foreignLabel+')':it.n});
      itemCount[it.key]=(itemCount[it.key]||0)+1;
      if(!(it.limEx&&it.limEx.includes(u.id))) itemCount['~'+it.key]=(itemCount['~'+it.key]||0)+1;
    });
    E.total.d+=row.cost.d; E.total.g+=row.cost.g; E.models++;
    if(u.elite) E.elites++;
    E.rows.push(row);
  });
  // 2) validations de composition
  const nonMercCount={}; L.models.forEach(m=>{ if(!m.merc) nonMercCount[m.unit]=(nonMercCount[m.unit]||0)+1; });
  E.counts=nonMercCount;
  const otherCost=(excl)=>E.rows.filter(r=>r.u&&!excl(r)).reduce((a,r)=>a+r.cost.d,0);
  ctx.units.forEach(u=>{
    if(u.banned) return;
    const n=nonMercCount[u.id]||0; let mx=u.max==null?Infinity:u.max; const mn=u.min||0;
    if(u.maxPer) mx=nonMercCount[u.maxPer]||0;
    if(u.special==='sorciere'){ mx=u.noLift?1:(otherCost(r=>r.u.id==='sorciere')>=1000?2:1); }
    if(u.id==='chevalier'&&F.id==='gn'&&!(V&&V.id==='hegemon')){ mx=(nonMercCount.seigneur||0)>0?2:3; }
    if(n<mn) err(`Il faut au moins ${mn} × ${u.n}.`);
    if(n>mx) err(`Trop de ${u.n} : ${n} pour un maximum de ${mx}${u.maxPer?' (un par Alchimiste)':''}.`);
    u._mx=mx;
  });
  const groups={}; ctx.units.forEach(u=>{ if(u.any&&!u.banned){(groups[u.any]=groups[u.any]||[]).push(u);} });
  Object.entries(groups).forEach(([g,us])=>{ const n=us.reduce((a,u)=>a+(nonMercCount[u.id]||0),0); if(n<1) err('Il faut au moins : '+us.map(u=>u.n).join(' ou ')+'.'); });
  if(F.id==='gn'&&!(V&&V.id==='hegemon')&&(nonMercCount.seigneur||0)===0&&(nonMercCount.chevalier||0)>3) err('Sans Seigneur des Tumeurs : 1 à 3 Chevaliers de la Peste.');
  if(F.id==='co'&&!L.sin) err('Choisissez le péché capital de la bande (Cour du Serpent à sept têtes).');
  // Misérables / démoniaques (Cour)
  if(F.id==='co'){ const mis=nonMercCount.miserable||0; const dem=E.rows.filter(r=>r.u&&r.u.demon).length; if(mis>0&&mis>=dem) err(`Les Misérables (${mis}) doivent être moins nombreux que les figurines DÉMONIAQUES (${dem}).`); }
  // Légionnaires
  if(F.id==='le'){ const T=nonMercCount.soldat||0; const Lg=E.rows.filter(r=>r.u&&r.u.id==='soldat'&&(hasOpt(r.m,'legion_t')||hasOpt(r.m,'legion_c'))).length; if(Lg>T-Lg) err(`Trop de Légionnaires hérétiques (${Lg}) : il ne peut pas y en avoir plus que de Soldats (${T-Lg}).`); }
  // options : bande
  const allOpts={}; ctx.units.forEach(u=>u.opts.forEach(o=>{allOpts[o.id]=o;}));
  Object.entries(optCount).forEach(([id,n])=>{
    const o=allOpts[id]; if(!o) return;
    let mx=o.max; if(o.special==='taupe') mx=2+(otherCost(r=>hasOpt(r.m,'taupe'))>=1000?1:0);
    if(o.bandMax) mx=o.bandMax;
    if(o.uniq&&n>1) err(`« ${o.n} » ne peut être choisi que par une seule figurine.`);
    if(mx&&n>mx) err(`« ${o.n} » : ${n} pour un maximum de ${mx}.`);
  });
  // options et équipement : figurine
  E.rows.forEach(row=>{
    const {m,u}=row; if(!u) return;
    const grp={}; (u.opts||[]).forEach(o=>{ if(hasOpt(m,o.id)&&o.grp){grp[o.grp]=(grp[o.grp]||0)+1;} });
    Object.entries(grp).forEach(([g,n])=>{ const o=u.opts.find(x=>x.grp===g); let mx=o.grpMax||1; if(u.pwMax&&g==='pouvoir'&&u.pwMax[L.sin]!=null) mx=u.pwMax[L.sin]; if(n>mx) err(`${u.n} : au plus ${mx} choix dans « ${g} ».`,m.uid); });
    (u.opts||[]).forEach(o=>{ if(!hasOpt(m,o.id)) return;
      (o.ex||[]).forEach(x=>{ if(hasOpt(m,x)){ const oo=u.opts.find(z=>z.id===x); err(`${u.n} : « ${o.n} » est incompatible avec « ${oo?oo.n:x} ».`,m.uid);} });
      if(o.exUnless){ const [a,b]=o.exUnless; if(hasOpt(m,a)&&!hasOpt(m,b)){ const oo=u.opts.find(z=>z.id===a); err(`${u.n} : « ${o.n} » et « ${oo?oo.n:a} » ne se combinent qu’avec Deux têtes.`,m.uid);} }
      (o.req||[]).forEach(x=>{ if(!hasOpt(m,x)){ const oo=u.opts.find(z=>z.id===x); err(`${u.n} : « ${o.n} » nécessite « ${oo?oo.n:x} ».`,m.uid);} });
    });
    if(u.reqGrp) u.reqGrp.forEach(g=>{ if(!(u.opts||[]).some(o=>o.grp===g&&hasOpt(m,o.id))) err(`${u.n} : choisissez son équipement.`,m.uid); });
    if(u.bases&&!u.bases.length) err(`${u.n} indisponible.`,m.uid);
    // équipement
    const names=row.itemsList.map(i=>i.n); const defs=row.itemsList.map(i=>i.it).filter(Boolean);
    const incDefs=row.lockedItems.map(n=>ctx.byName[n]||ctx.items.find(i=>i.n===n)).filter(Boolean);
    const allDefs=[...defs,...incDefs];
    const cnt=cat=>allDefs.filter(i=>i.cat===cat).length;
    if(cnt('Armures')>1) err(`${u.n} : une seule armure par figurine.`,m.uid);
    if(cnt('Boucliers')>1&&!u.maxWeapons) err(`${u.n} : un seul bouclier par figurine.`,m.uid);
    if(allDefs.filter(i=>i.coiffe).length>1) err(`${u.n} : une seule coiffe par figurine.`,m.uid);
    if(names.includes('Baïonnette')&&!allDefs.some(i=>i.tenon)) err(`${u.n} : la baïonnette exige une arme à distance avec Tenon de baïonnette.`,m.uid);
    row.itemsList.forEach(i=>{ if(i.it&&i.it.needItem&&!names.includes(i.it.needItem)) err(`${u.n} : « ${i.it.n} » nécessite « ${i.it.needItem} ».`,m.uid); });
    if(u.needCat&&cnt(u.needCat)<1) err(`${u.n} : doit posséder une armure.`,m.uid);
    if(u.needWeapon){ const cats=u.id==='gardien'?['Armes de corps à corps']:WEAPON_CATS; if(!allDefs.some(i=>cats.includes(i.cat))) err(`${u.n} : doit avoir au moins une arme.`,m.uid); }
    if(u.maxWeapons){ const w=allDefs.filter(i=>WEAPON_CATS.includes(i.cat)||i.cat==='Boucliers').length; if(w>u.maxWeapons) err(`${u.n} : ${w} armes pour un maximum de ${u.maxWeapons}.`,m.uid); if(u.id==='amalgame'){ const c={}; names.forEach(n=>c[n]=(c[n]||0)+1); Object.entries(c).forEach(([n,k])=>{ if(k>2) err(`Amalgame : pas plus de 2 exemplaires de « ${n} ».`,m.uid);}); } }
    if(u.maxRanged){ const w=allDefs.filter(i=>i.cat==='Armes de tir').length; if(w>u.maxRanged) err(`${u.n} : 1 seule arme de tir.`,m.uid); }
    const fOpt={}; defs.forEach(i=>{ if(i.needOpt) fOpt[i.needOpt]=(fOpt[i.needOpt]||0)+1; }); Object.entries(fOpt).forEach(([o,k])=>{ if(k>1) err(`${u.n} : une seule pièce d’équipement étrangère.`,m.uid); });

  });

  });
  (V&&V.collect||[]).forEach(src=>{ const n=ctx.items.filter(i=>i.collect===src).reduce((a,i)=>a+(itemCount[i.key]||0),0); const SF=FACTIONS.find(f=>f.id===src); if(n>1) err(`Collection d’armes (${SF.short}) : 1 seule pièce d’équipement (${n} choisies).`); });

function go(v,extra){S.view=v;Object.assign(S,extra||{});render();window.scrollTo(0,0);}
function newBand(fid,vid,name,sin){
  const F=FACTIONS.find(f=>f.id===fid);
  const b={id:uid(),name:name||'Ma bande',fid,vid:vid||null,sin:sin||null,models:[],t:Date.now()};
  S.bands.unshift(b);S.cur=b.id;save();
}
function chrome(inner){
  return `<header class="top"><a class="brand" href="#" data-act="home"><img src="${SNOT}" alt=""><span class="bt"><b>Trench Snot</b><i>constructeur de bandes · Trench Crusade</i></span></a>
  <nav><button data-act="home" class="${S.view==='home'?'on':''}">Bandes</button><button data-act="about" class="${S.view==='about'?'on':''}">À propos</button></nav></header>
  <main>${inner}</main>
  <footer class="sig">${LOGO}<span>by <b>coffee-time</b> · règles Warbands of Trench Crusade 1.0.2 (VF) + errata</span></footer>`;
}
function vHome(){
  const list=S.bands.map(b=>{
    const F=FACTIONS.find(f=>f.id===b.fid); if(!F) return '';
    const V=(F.variants||[]).find(v=>v.id===b.vid); let E; try{E=evaluate(b);}catch(e){E=null;}
    return `<li class="bandcard" style="--fc:${F.color}"><div><h3>${esc(b.name)}</h3><p>${esc(F.short)}${V?' · '+esc(V.name):''}</p>
    <p class="m">${E?`<b>${E.total.d}</b>/${E.budget.d} 👑${E.budget.g||E.total.g?` · <b>${E.total.g}</b>/${E.budget.g} ☼`:''} · ${E.models} fig.${E.errors.length?` · <span class="bad">${E.errors.length} problème(s)</span>`:''}`:''}</p></div>
    <div class="row"><button class="btn" data-act="open" data-id="${b.id}">Ouvrir</button><button class="btn ghost" data-act="dup" data-id="${b.id}">Dupliquer</button><button class="btn ghost" data-act="del" data-id="${b.id}">${S.confirmDel===b.id?'Confirmer ?':'Supprimer'}</button></div></li>`;
  }).join('');
  return `<section class="hero"><h1>Trench Snot</h1><p>Composez votre bande pour <b>Trench Crusade</b> : budget, limites, options et équipement sont vérifiés pendant que vous construisez.</p><button class="btn big" data-act="new">Nouvelle bande</button></section>
  ${S.bands.length?`<h2>Vos bandes</h2><ul class="bands">${list}</ul>`:'<p class="muted">Aucune bande pour l’instant. Les bandes sont enregistrées dans ce navigateur.</p>'}`;
}
function vNew(){
  const N=S.nw||(S.nw={fid:'na',vid:'',name:'',sin:''});
  const F=FACTIONS.find(f=>f.id===N.fid);
  return `<h2>Nouvelle bande</h2>
  <div class="facs">${FACTIONS.map(f=>`<button class="fac ${f.id===N.fid?'on':''}" style="--fc:${f.color}" data-act="nwf" data-id="${f.id}"><b>${esc(f.short)}</b><span>${esc(f.align)}</span></button>`).join('')}</div>
  <div class="card"><p>${esc(F.blurb)}</p>
  <label>Nom de la bande<input id="nwname" value="${esc(N.name)}" placeholder="ex. Les Fusiliers de l’Aube"></label>
  ${(F.variants||[]).length?`<label>Variante<select id="nwvar"><option value="">Bande standard (${F.budget} 👑)</option>${F.variants.map(v=>`<option value="${v.id}" ${v.id===N.vid?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label>`:''}
  ${F.sins?`<label>Péché capital<select id="nwsin"><option value="">— choisir —</option>${F.sins.map(s=>`<option ${s===N.sin?'selected':''}>${esc(s)}</option>`).join('')}</select></label>`:''}
  </div>
  <div class="card"><h3>Règles de la bande</h3>${F.rules.map(r=>`<details><summary>${esc(r.t)}</summary><p>${esc(r.d)}</p></details>`).join('')}</div>
  <button class="btn big" data-act="create">Créer la bande</button>`;
}
function costStr(p){return (p.d?p.d+' 👑':'')+(p.d&&p.g?' + ':'')+(p.g?p.g+' ☼':'')||'0 👑';}
function vBuilder(){
  const L=cur(); if(!L) return vHome();
  const E=evaluate(L); const {ctx}=E; const F=ctx.F, V=ctx.V;
  const pd=Math.min(100,E.total.d/E.budget.d*100);
  const bad=E.errors.length>0;
  const unitBtns=(arr,merc)=>arr.filter(u=>!u.banned).map(u=>{
    const n=merc?(L.models.filter(m=>m.merc&&m.unit===u.id).length):(E.counts[u.id]||0);
    const mx=merc?u.max:(u._mx!=null?u._mx:u.max);
    const mxs=mx==null||mx===Infinity?'':'/'+mx; const full=mx!=null&&mx!==Infinity&&n>=mx;
    const c=merc?u.c+' ☼':((u.bases?u.bases[0].c:u.c)+' 👑'+(u.cg?' + '+u.cg+' ☼':''));
    return `<button class="ucard ${full?'full':''} ${u.elite?'elite':''}" data-act="addu" data-id="${u.id}" data-merc="${merc?1:0}"><b>${esc(u.n)}</b><span class="c">${c}</span><span class="cnt">${n}${mxs}</span>${u.elite?'<em>ÉLITE</em>':''}${u.leader?'<em>CHEF</em>':''}</button>`;}).join('');
  const rows=E.rows.map(r=>mdl(L,E,r)).join('');
  const tabs=`<div class="tabs"><button data-act="tab" data-id="units" class="${S.tab==='units'?'on':''}">Figurines</button><button data-act="tab" data-id="rules" class="${S.tab==='rules'?'on':''}">Règles</button><button data-act="tab" data-id="export" class="${S.tab==='export'?'on':''}">Exporter</button></div>`;
  let body='';
  if(S.tab==='units'){
    body=`<h3>Recruter</h3><div class="ugrid">${unitBtns(ctx.units,false)}</div>
    ${ctx.mercs.length?`<h3>Mercenaires <small>(☼ points de Gloire)</small></h3><div class="ugrid">${unitBtns(ctx.mercs,true)}</div>`:''}
    <h3>Composition <small>${E.models} figurine(s)</small></h3>${rows||'<p class="muted">Ajoutez des figurines ci-dessus.</p>'}`;
  } else if(S.tab==='rules'){
    const rl=[...F.rules,...(V?V.rules||[]:[])];
    body=rl.map(r=>`<details open><summary>${esc(r.t)}</summary><p>${esc(r.d)}</p></details>`).join('');
  } else body=vExport(L,E);
  return `<div class="bhead" style="--fc:${F.color}"><div><input class="nm" id="bname" value="${esc(L.name)}" aria-label="Nom de la bande"><p>${esc(F.short)}${V?' · '+esc(V.name):''}${L.sin?' · Péché : '+esc(L.sin):''}</p></div></div>
  <div class="sticky"><div class="meter ${E.total.d>E.budget.d?'over':''}"><i style="width:${pd}%"></i></div>
  <div class="stats"><span><b>${E.total.d}</b>/${E.budget.d} 👑</span>${E.budget.g||E.total.g?`<span class="${E.total.g>E.budget.g?'bad':''}"><b>${E.total.g}</b>/${E.budget.g} ☼</span>`:''}<span class="${E.elites>6?'bad':''}">ÉLITE <b>${E.elites}</b>/6</span><span><b>${E.models}</b> fig.</span><span class="ok ${bad?'bad':''}">${bad?E.errors.length+' problème(s)':'✔ valide'}</span></div></div>
  ${E.errors.length?`<ul class="errs">${E.errors.map(e=>`<li>${esc(e.msg)}</li>`).join('')}</ul>`:''}${E.warns.length?`<ul class="warns">${E.warns.map(e=>`<li>${esc(e.msg)}</li>`).join('')}</ul>`:''}
  ${tabs}${body}${printSheet(L,E)}`;
}
function printSheet(L,E){
  const F=E.ctx.F,V=E.ctx.V;
  const rows=E.rows.filter(r=>r.u).map(r=>{const u=r.u,pr=u.prof||[];
    const eq=[...(u.inc||[]).map(n=>n+' (inclus)'),...r.itemsList.map(i=>(i.label||i.n)+' ('+costStr(i.price)+')'),...r.optsList.map(o=>o.n+(o.c?' ('+o.c+' 👑)':''))];
    return `<div class="pm"><div class="pmh"><b>${esc(u.n)}</b>${u.elite?' <em>ÉLITE</em>':''}<span>${costStr(r.cost)}</span></div><div class="pp">Mouv. ${esc(pr[0]||'–')} · Tir ${esc(pr[1]||'–')} · CàC ${esc(pr[2]||'–')} · Armure ${esc(pr[3]||'–')} · Socle ${esc(pr[4]||'–')}</div>${u.kw?`<div class="pk">${esc(u.kw)}</div>`:''}${eq.length?`<div class="pe">${eq.map(esc).join(' · ')}</div>`:''}${u.cap?`<div class="pc">${esc(u.cap)}</div>`:''}</div>`;}).join('');
  return `<section id="printsheet"><h1>${esc(L.name)}</h1><p class="ps">${esc(F.short)}${V?' — '+esc(V.name):''}${L.sin?' — Péché : '+esc(L.sin):''}<br><b>${E.total.d}/${E.budget.d} 👑</b>${E.budget.g||E.total.g?' · <b>'+E.total.g+'/'+E.budget.g+' ☼</b>':''} · ${E.models} figurines · ÉLITE ${E.elites}/6${E.errors.length?' · ⚠ '+E.errors.length+' problème(s)':''}</p>${rows}<p class="pf">Trench Snot — by coffee-time · règles Warbands of Trench Crusade 1.0.2 (VF)</p></section>`;
}
function mdl(L,E,r){
  const {m,u}=r; const ctx=E.ctx; if(!u) return `<div class="mdl"><p class="bad">Figurine inconnue</p><button class="btn ghost" data-act="rm" data-id="${m.uid}">Retirer</button></div>`;
  const open=S.openModel===m.uid; const prof=u.prof||[];
  const head=`<div class="mh"><button class="mt" data-act="tog" data-id="${m.uid}"><b>${esc(u.n)}</b>${u.elite?' <em>ÉLITE</em>':''}<span class="mc">${costStr(r.cost)}</span></button><div class="row"><button class="btn ghost sm" data-act="cpy" data-id="${m.uid}" title="Dupliquer">⧉</button><button class="btn ghost sm" data-act="rm" data-id="${m.uid}" title="Retirer">✕</button></div></div>`;
  const chips=[...(u.inc||[]).map(n=>`<span class="chip lock">${esc(n)}</span>`),...r.itemsList.map((i,k)=>`<span class="chip">${esc(i.label||i.n)}${i.missing?' ⚠':''} <small>${costStr(i.price)}</small><button data-act="ri" data-id="${m.uid}" data-k="${k}" aria-label="Retirer">×</button></span>`),...r.optsList.map(o=>`<span class="chip opt">${esc(o.n)}${o.c?' <small>'+o.c+' 👑</small>':''}</span>`)].join('');
  const mine=E.errors.filter(e=>e.uid===m.uid);
  let det='';
  if(open){
    det+=`<div class="prof">${['Mouv.','Tir','CàC','Armure','Socle'].map((k,i)=>`<span><i>${k}</i>${esc(prof[i]||'–')}</span>`).join('')}</div>`;
    if(u.kw) det+=`<p class="kw">${esc(u.kw)}</p>`; if(u.cap) det+=`<p class="cap">${esc(u.cap)}</p>`;
    if(u.bases&&u.bases.length>1) det+=`<label>Profil<select data-act="base" data-id="${m.uid}">${u.bases.map((b,i)=>`<option value="${i}" ${(m.base||0)===i?'selected':''}>${esc(b.n)} — ${b.c} 👑</option>`).join('')}</select></label>`;
    // options
    const og={}; (u.opts||[]).forEach(o=>{(og[o.grp||'_']=og[o.grp||'_']||[]).push(o);});
    if((u.opts||[]).length) det+=`<div class="opts"><h4>Options</h4>`+Object.entries(og).map(([g,arr])=>`${g!=='_'?`<h5>${esc(g)}</h5>`:''}${arr.map(o=>`<label class="chk"><input type="checkbox" data-act="opt" data-id="${m.uid}" data-o="${o.id}" ${hasOpt(m,o.id)?'checked':''}><span>${esc(o.n)}${o.c?` <small>${o.c} 👑</small>`:''}${o.d?`<em>${esc(o.d)}</em>`:''}</span></label>`).join('')}`).join('')+`</div>`;
    // equipement
    if(!u.noEquip){
      const cats={}; ctx.items.forEach(it=>{ if(!availability(ctx,m,u,it).hide){(cats[it.cat]=cats[it.cat]||[]).push(it);} });
      det+=`<div class="eq"><h4>Équipement</h4>`+CAT_ORDER.filter(c=>cats[c]).map(c=>`<label class="sel"><span>${c}</span><select data-act="add" data-id="${m.uid}"><option value="">+ ajouter…</option>${cats[c].map(it=>{const p=(u.disc&&u.disc[it.n]!=null)?u.disc[it.n]:it.c;return `<option value="${esc(it.key)}">${esc(it.n)}${it.foreignLabel?' ('+esc(it.foreignLabel)+')':''} — ${p} ${it.k==='g'?'☼':'👑'}${it.r&&it.restr?' · '+esc(it.restr):''}</option>`;}).join('')}</select></label>`).join('')+`</div>`;
    }
  }
  return `<article class="mdl ${mine.length?'has-err':''}">${head}<div class="chips">${chips}</div>${mine.map(e=>`<p class="bad sm">${esc(e.msg)}</p>`).join('')}${det}</article>`;
}
function vExport(L,E){
  const F=E.ctx.F,V=E.ctx.V; let t=`${L.name}\n${F.short}${V?' — '+V.name:''}${L.sin?' — Péché : '+L.sin:''}\n${E.total.d}/${E.budget.d} 👑${E.budget.g||E.total.g?` · ${E.total.g}/${E.budget.g} ☼`:''} · ${E.models} figurines\n${'─'.repeat(30)}\n`;
  E.rows.forEach(r=>{ if(!r.u) return; const eq=[...(r.u.inc||[]),...r.itemsList.map(i=>i.label||i.n),...r.optsList.map(o=>o.n)]; t+=`• ${r.u.n} [${costStr(r.cost)}]${eq.length?'\n    '+eq.join(', '):''}\n`; });
  if(E.errors.length) t+=`\n⚠ ${E.errors.length} problème(s) :\n`+E.errors.map(e=>' - '+e.msg).join('\n')+'\n';
  t+=`\nCréé avec Trench Snot — by coffee-time`;
  S.exportText=t;
  return `<h3>Feuille de bande</h3><pre class="sheet" id="sheet">${esc(t)}</pre><div class="row"><button class="btn" data-act="print">Exporter en PDF / imprimer</button><button class="btn ghost" data-act="copy">Copier le texte</button><span id="cpmsg" class="muted"></span></div>`;
}
function vAbout(){return `<h2>À propos</h2><div class="card"><p><b>Trench Snot</b> est un constructeur de bandes pour <i>Trench Crusade</i>, repensé à partir des vestiges de Trench Companion.</p>
<h3>Version des règles</h3><p>Données issues des <b>Warbands of Trench Crusade 1.0.2</b> en français (mise à jour VF du 11/08/26), qui intègrent déjà les errata publiés sur le Trench Wire (mouvement des Fantassins d’élite oints, texte d’IMPÉNÉTRABLE, harmonisation des mots-clés).</p>
<h3>Non appliqué</h3><ul><li>Le « Rules Review » bêta d’avril 2026 (Observateur, Brûleur, Mangeur de péchés, Sorcier goétique…) ;</li><li>le livre de règles imprimé V1.1 (sortie le 30 novembre 2026) ;</li><li>l’extension payante Carcass Front ;</li><li>les variantes absentes du livre en français (Grande Faim, Brigade rouge, Chœur noyé, Chevaliers de saint Lazare, Banc du Léviathan, Troupeau béni, Pillards navals et Procession autonomes).</li></ul>
<h3>Limites connues</h3><ul><li>Les mains occupées et le Combo bouclier ne sont pas contrôlés.</li><li>Équipes-feu et armes lourdes : règle indiquée dans l’onglet Règles, non contrôlée.</li><li>Grand Anachorète : 15 👑 dans le tableau d’armurerie de la Saint Méthode, 5 👑 dans sa fiche — le tableau (15 👑) est retenu.</li><li>Fer froid (Alba) : le demi-tarif est arrondi à l’entier supérieur.</li><li>Vérifiez toujours votre liste face au livre de règles.</li></ul>
<h3>Sources</h3><p><a href="https://trenchcrusade.fr/regles" target="_blank" rel="noopener">trenchcrusade.fr/regles</a> · <a href="https://www.trenchcrusade.com/trench-wire/" target="_blank" rel="noopener">trenchcrusade.com/trench-wire</a> · <a href="https://trench-companion.com/" target="_blank" rel="noopener">trench-companion.com</a></p>
<p class="muted">Projet de fans non officiel. Trench Crusade appartient à ses ayants droit.</p></div>`;}

function render(){
  const v=S.view; let h;
  if(v==='home') h=vHome(); else if(v==='new') h=vNew(); else if(v==='build') h=vBuilder(); else h=vAbout();
  const keep=document.activeElement&&document.activeElement.id; 
  $('#app').innerHTML=chrome(h);
}
function addModel(L,id,merc){
  const m={uid:uid(),unit:id,merc:!!merc,base:0,opts:{},items:[]}; L.models.push(m); S.openModel=m.uid;
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act, id=el.dataset.id;
  if(el.tagName==='SELECT'||(el.tagName==='INPUT')) return;
  const L=cur();
  switch(a){
    case 'home': e.preventDefault(); go('home'); break;
    case 'about': go('about'); break;
    case 'new': S.nw=null; go('new'); break;
    case 'nwf': S.nw=S.nw||{}; { const n=$('#nwname'); const nm=n?n.value:''; S.nw={fid:id,vid:'',name:nm,sin:''}; } render(); break;
    case 'create': { const N=S.nw; const F=FACTIONS.find(f=>f.id===N.fid); const nm=($('#nwname').value||'').trim()||'Ma bande '+F.short; const vs=$('#nwvar'),ss=$('#nwsin'); newBand(N.fid,vs?vs.value:'',nm,ss?ss.value:''); S.tab='units'; go('build'); break; }
    case 'open': S.cur=id; S.tab='units'; S.openModel=null; go('build'); break;
    case 'dup': { const b=S.bands.find(x=>x.id===id); const c=JSON.parse(JSON.stringify(b)); c.id=uid(); c.name+=' (copie)'; c.models.forEach(m=>m.uid=uid()); S.bands.unshift(c); save(); render(); break; }
    case 'del': if(S.confirmDel===id){ S.bands=S.bands.filter(b=>b.id!==id); S.confirmDel=null; save(); } else S.confirmDel=id; render(); break;
    case 'tab': S.tab=id; render(); break;
    case 'addu': addModel(L,id,el.dataset.merc==='1'); save(); render(); break;
    case 'tog': S.openModel=S.openModel===id?null:id; render(); break;
    case 'rm': L.models=L.models.filter(m=>m.uid!==id); save(); render(); break;
    case 'cpy': { const m=L.models.find(x=>x.uid===id); const c=JSON.parse(JSON.stringify(m)); c.uid=uid(); L.models.splice(L.models.indexOf(m)+1,0,c); S.openModel=null; save(); render(); break; }
    case 'ri': { const m=L.models.find(x=>x.uid===id); const E=evaluate(L); const row=E.rows.find(r=>r.m===m); const k=+el.dataset.k; const key=row.itemsList[k].key; const reqN=(row.u.req||[]); const i=m.items.indexOf(key); if(i>=0) m.items.splice(i,1); save(); render(); break; }
    case 'print': try{window.print();}catch(x){} break;
    case 'copy': { const t=S.exportText||''; const done=ok=>{const s=$('#cpmsg'); if(s)s.textContent=ok?'Copié.':'Sélectionnez le texte pour le copier.';}; try{navigator.clipboard.writeText(t).then(()=>done(true),()=>{selSheet();done(false);});}catch(x){selSheet();done(false);} break; }
  }
});
function selSheet(){const n=$('#sheet'); if(n){const r=document.createRange(); r.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(r);}}
document.addEventListener('change',e=>{
  const el=e.target; const a=el.dataset&&el.dataset.act; const L=cur();
  if(el.id==='nwvar'){S.nw.vid=el.value;S.nw.name=$('#nwname').value;return;}
  if(el.id==='nwsin'){S.nw.sin=el.value;return;}
  if(el.id==='nwname'){S.nw.name=el.value;return;}
  if(el.id==='bname'){L.name=el.value;save();return;}
  if(!a||!L) return; const m=L.models.find(x=>x.uid===el.dataset.id); if(!m) return;
  if(a==='opt'){ m.opts[el.dataset.o]=el.checked; if(!el.checked) delete m.opts[el.dataset.o]; }
  else if(a==='base'){ m.base=+el.value; }
  else if(a==='add'){ if(!el.value) return; m.items.push(el.value); }
  save(); render();
});
render();

setTimeout(()=>{const s=document.getElementById('splash'); if(s) s.remove();},1950);
</script>
